      nonOpIncCash: pad6([0]), nonOpIncNonCash: pad6([0]), nonOpExpCash: pad6([0]), nonOpExpNonCash: pad6([0]),
      salesHierarchy: [{ id: 'c1', name: '대한민국', bizTypes: [{ id: 'bt1', name: 'B2B/B2C 통합', salesModes: [{ id: 'sm1', name: '온/오프라인 통합', channels: [{ id: 'ch1', name: '기본 채널', clients: [{ id: 'cl1', name: 'A상사', categories: [{ id: 'cat1', name: '기본 품목군', products: [{ id: 'p1', name: '기본 자체생산 제품', isInternal: true, prices: pad6([15000]), volumes: pad6([100000, 110000, 120000, 130000, 140000, 150000]), supplyCosts: pad6([0]), purchaseVolumes: pad6([0]) }] }] }] }] }] }] }]
    };

    const formatCurrency = (val) => (val || 0).toLocaleString('ko-KR', { maximumFractionDigits: 0 });
    const formatPercent = (val) => `${((val || 0) * 100).toFixed(1)}%`;
    const toMil = (val) => (val || 0) * 1000000;
    const cloneDeep = (obj) => JSON.parse(JSON.stringify(obj));

    const calculateIRR = (cashFlows) => {
      let guess = 0.1;
      for (let i = 0; i < 1000; i++) {
        let npv = 0, derivative = 0;
        for (let t = 0; t < cashFlows.length; t++) {
          npv += cashFlows[t] / Math.pow(1 + guess, t);
          if (t > 0) derivative -= (t * cashFlows[t]) / Math.pow(1 + guess, t + 1);
        }
        if (Math.abs(npv) < 0.001) return guess;
        let nextGuess = guess - npv / derivative;
        if (nextGuess <= -1) nextGuess = -0.99;
        if (Math.abs(nextGuess - guess) < 0.00001) return nextGuess;
        guess = nextGuess;
      }
      return guess;
    };

    const NumInput = React.memo(({ value, onChange, placeholder, className = "" }) => {
      const [localVal, setLocalVal] = useState(value === 0 ? '0' : (value||0).toLocaleString());
      useEffect(() => { setLocalVal(value === 0 ? '0' : (value||0).toLocaleString()); }, [value]);
      const handleChange = (e) => {
        const raw = e.target.value.replace(/[^0-9.-]/g, '');
        setLocalVal(raw);
        if (raw !== '' && raw !== '-' && raw !== '.') onChange(Number(raw));
      };
      return <input type="text" value={localVal} onChange={handleChange} placeholder={placeholder} className={`text-right border border-slate-300 rounded py-1 px-1.5 transition-all text-xs text-slate-800 ${className}`} />;
    });

    const YearlyInputField = React.memo(({ label, arrName, values, onChangeArray }) => (

          {pad6(values).map((v, i) => (
            <div key={i} className="flex flex-col">

              <NumInput value={v} onChange={(val) => onChangeArray(arrName, i, val)} />
            </div>
          ))}
        </div>
      </div>
    ));

    const DynamicListYearly = React.memo(({ listName, items, title, namePlaceholder, hasUsefulLife, onAdd, onRemove, onFieldChange, onAmountChange }) => (
      <div className="mb-6">
        <div className="flex justify-between items-center mb-2">
          <label className="text-[13px] font-bold text-slate-800 tracking-wide">{title}</label>
          <button onClick={() => onAdd(listName)} className="text-[10px] font-bold text-slate-600 bg-white border border-slate-300 hover:border-slate-800 px-2 py-1 rounded transition-colors shadow-sm">
            + 항목 추가
          </button>
        </div>
        <div className="space-y-3">
          {(items||[]).map((item) => (
            <div key={item.id} className="bg-white border border-slate-200 rounded p-2.5 shadow-sm">
              <div className="flex justify-between items-center mb-2 pb-1 border-b border-slate-100">

                  <div className="flex items-center gap-1 mr-2 shrink-0">
                    <span className="text-[10px] text-slate-500 font-bold">내용연수</span>
                    <input type="number" value={item.usefulLife || 5} onChange={(e) => onFieldChange(listName, item.id, 'usefulLife', Number(e.target.value))}

                    <span className="text-[10px] text-slate-500 font-bold">년</span>
                  </div>
                ) : null}
                <button onClick={() => onRemove(listName, item.id)} className="text-slate-400 hover:text-red-700 text-xs font-bold px-1">&times;</button>
              </div>
              <div className="grid grid-cols-6 gap-1 mt-1">
                {pad6(item.amounts).map((amt, idx) => (

                    <NumInput value={amt} onChange={(val) => onAmountChange(listName, item.id, idx, val)} className="text-[10px]" />
                  </div>
                ))}
              </div>

    const DynamicBaseCostList = React.memo(({ listName, items, title, onAdd, onRemove, onFieldChange, onAmountChange, model }) => (
      <div className="mb-6">
        <div className="flex justify-between items-center mb-2">
          <label className="text-[13px] font-bold text-slate-800 tracking-wide">{title}</label>
          <button onClick={() => onAdd(listName)} className="text-[10px] font-bold text-slate-600 bg-white border border-slate-300 hover:border-slate-800 px-2 py-1 rounded transition-colors shadow-sm">+ 항목 추가</button>
        </div>
        <div className="space-y-3">
          {(items||[]).map((item) => (
            <div key={item.id} className="bg-white border border-slate-200 rounded p-2.5 shadow-sm">
              <div className="flex justify-between items-center mb-2 pb-1 border-b border-slate-100">
                <input type="text" value={item.name} placeholder="기본원가 항목명" onChange={(e) => onFieldChange(listName, item.id, 'name', e.target.value)} className="flex-1 min-w-0 text-[12px] font-bold bg-transparent focus:border-b focus:border-red-700 outline-none text-slate-800" />
                <button onClick={() => onRemove(listName, item.id)} className="text-slate-400 hover:text-red-700 text-xs font-bold px-1">&times;</button>
              </div>
              <div className="grid grid-cols-6 gap-1 mt-1">
                {pad6(item.amounts).map((amt, idx) => {
                  const val = toMil(amt) * (model?.infMultArr?.[idx] || 1);
                  const up = (model?.is_managerial?.[idx]?.actualProdVol > 0) ? val / model.is_managerial[idx].actualProdVol : 0;
                  return (
                    <div key={idx} className="flex flex-col">
                      <span className="text-[9px] text-slate-400 text-center mb-0.5 font-bold">Y{idx}</span>
                      <NumInput value={amt} onChange={(v) => onAmountChange(listName, item.id, idx, v)} className="text-[10px]" />
                      <span className="text-[9px] text-blue-600 text-right mt-1 font-semibold leading-tight break-all truncate" title={`단가: ${formatCurrency(up)}원`}>@ {formatCurrency(up)}원</span>
                      <span className="text-[9px] text-slate-500 text-right leading-tight truncate" title={`총액: ${formatCurrency(val/1000000)}백만`}>{formatCurrency(val/1000000)}백만</span>
                    </div>

    const DynamicExpRateList = React.memo(({ listName, items, title, onAdd, onRemove, onFieldChange, onAmountChange, model }) => (
      <div className="mb-6">
        <div className="flex justify-between items-center mb-2">
          <label className="text-[13px] font-bold text-slate-800 tracking-wide">{title}</label>
          <button onClick={() => onAdd(listName)} className="text-[10px] font-bold text-slate-600 bg-white border border-slate-300 hover:border-slate-800 px-2 py-1 rounded transition-colors shadow-sm">+ 항목 추가</button>
        </div>

    const TableHead = ({ compact }) => (

    const TreeRow = ({ node, isCompact }) => {
        const [ex, setEx] = useState(false);
        const hasD = node.sub && node.sub.length > 0;
        
        return (
            <React.Fragment>

                         {node.ratios && node.ratios[vi] ? <div className="text-[9px] text-slate-400 font-normal mt-0.5">{formatPercent(node.ratios[vi])}</div> : null}

                   ))}
                </tr>
                {ex && hasD && node.sub.map((child, i) => <TreeRow key={`${node.level}-${i}`} node={child} isCompact={isCompact} />)}
            </React.Fragment>
        );
    };

    const ExpandableRow = ({ label, values, ratios, details, isBold, isTotal, isHeader, isCompact = false }) => {
      const [ex, setEx] = useState(false);
      const hasD = details && details.length > 0;
      
      let rowCls = 'border-b border-slate-200 text-slate-800 bg-white hover:bg-slate-50 transition-colors';
      if (isHeader) rowCls = 'border-t-2 border-b-2 border-slate-800 font-bold bg-slate-100 text-slate-900';
      else if (isTotal) rowCls = 'border-y border-slate-300 font-bold bg-slate-50 text-slate-900';
      else if (isBold) rowCls = 'font-bold text-slate-900';

      const paddingClass = isCompact ? 'py-1.5 px-3' : 'py-2.5 px-4';
      const labelTextSize = isCompact ? 'text-[12px]' : 'text-sm';
      const valueTextSize = isCompact ? 'text-[11px]' : 'text-[12px]';

      return (
        <React.Fragment>
          <tr className={rowCls}>
            <td className={`${paddingClass} text-left ${hasD ? 'cursor-pointer select-none' : ''}`} onClick={() => hasD && setEx(!ex)}>
              <div className="flex items-center gap-1.5">
                <span className="w-3 text-slate-400 text-[10px]">{hasD ? (ex ? '▼' : '▶') : ''}</span>
                <span className={labelTextSize}>{label}</span>
              </div>
            </td>
            {pad6(values).map((val, idx) => (
              <td key={idx} className={`${paddingClass} text-right align-middle ${valueTextSize}`}>
                <span>{formatCurrency((val||0) / 1000000)}</span>
                {ratios && ratios[idx] !== 0 ? <div className="text-[10px] text-slate-400 font-normal mt-0.5 tracking-tighter">({formatPercent(ratios[idx])})</div> : null}
              </td>
            ))}
          </tr>
          {ex && hasD && details.map((d, i) => <TreeRow key={`d-${i}`} node={d} isCompact={isCompact} />)}
        </React.Fragment>
      );
    };

    const HierarchyEditor = ({ list, level, pathIds, handlers }) => {
        const levelConfig = [
            { key: 'bizTypes', name: '사업영역 (B2B/B2C)', addFn: handlers.addBizType, rmFn: handlers.rmCountry, ph: '국가명' },
            { key: 'salesModes', name: '판매형태 (온/오프라인)', addFn: handlers.addSalesMode, rmFn: handlers.rmBizType, ph: '사업영역명' },
            { key: 'channels', name: '유통채널 (병원/약국 등)', addFn: handlers.addChannel, rmFn: handlers.rmSalesMode, ph: '판매형태명' },
            { key: 'clients', name: '거래처', addFn: handlers.addClient, rmFn: handlers.rmChannel, ph: '채널명' },
            { key: 'categories', name: '품목군', addFn: handlers.addCategory, rmFn: handlers.rmClient, ph: '거래처명' },
            { key: 'products', name: '품목', addFn: handlers.addProduct, rmFn: handlers.rmCategory, ph: '품목군명' }
        ];

        if (level === 6) { 
            return (
                <div className="space-y-3 mt-2">
                   {(list||[]).map(product => (

                            <div className="flex items-center gap-3">

                                  <input type="checkbox" checked={product.isInternal !== false} onChange={(e) => handlers.updateField(pathIds, product.id, 'isInternal', null, e.target.checked)} className="accent-red-700" /> 자체생산
                               </label>
                               <button onClick={() => handlers.rmProduct(pathIds, product.id)} className="text-slate-400 hover:text-red-700 font-bold px-1">&times;</button>
                            </div>
                         </div>
                         <div className="pl-2">
                             <div className="text-[10px] font-bold text-slate-600 mb-1">단가 (Price - 원)</div>
                             <div className="grid grid-cols-6 gap-1 mb-3">
                                {pad6(product.prices).map((p, idx) => (
                                   <NumInput key={`p-${idx}`} value={p} onChange={(v) => handlers.updateField(pathIds, product.id, 'prices', idx, v)} className="text-[10px] font-semibold" />
                                ))}
                             </div>
                             <div className="text-[10px] font-bold text-slate-600 mb-1">목표 수량 (Volume - 개)</div>
                             <div className="grid grid-cols-6 gap-1 mb-2">
                                {pad6(product.volumes).map((v, idx) => (
                                   <NumInput key={`v-${idx}`} value={v} onChange={(val) => handlers.updateField(pathIds, product.id, 'volumes', idx, val)} className="text-[10px] font-semibold" />
                                ))}
                             </div>
                             {product.isInternal === false && (
                                 <div className="mt-3 bg-orange-50/50 p-2 rounded border border-orange-100">
                                   <div className="text-[10px] font-black text-orange-700 mb-1">외부조달 공급원가 (Supply Cost - 원)</div>
                                   <div className="grid grid-cols-6 gap-1">
                                      {pad6(product.supplyCosts||[]).map((sc, idx) => (
                                         <NumInput key={`sc-${idx}`} value={sc} onChange={(v) => handlers.updateField(pathIds, product.id, 'supplyCosts', idx, v)} className="text-[10px] border-orange-300 focus:border-orange-500 bg-white text-orange-900 font-bold" />
                                      ))}
                                   </div>
                                 </div>
                             )}
                         </div>
                      </div>
                   ))}
                </div>
            );
        }

        const cfg = levelConfig[level];
        return (
            <div className="space-y-3">
                {(list||[]).map(item => (
                    <div key={item.id} className={`p-2.5 rounded border border-slate-200 ${level===0?'bg-slate-100':level===1?'bg-white ml-2 shadow-sm':level===2?'bg-slate-50 ml-2':'bg-white ml-2 shadow-sm'}`}>
                        <div className="flex justify-between items-center mb-2 pb-1 border-b border-slate-200/50">
                            <input type="text" value={item.name} onChange={(e) => handlers.updateName(pathIds, item.id, e.target.value)} placeholder={cfg.ph} className="text-xs font-bold text-slate-800 bg-transparent border-b border-transparent focus:border-red-700 outline-none w-1/2 px-1" />
                            <div className="flex gap-1">
                                <button onClick={() => cfg.addFn(pathIds, item.id)} className="text-[10px] font-bold text-slate-600 bg-white border border-slate-300 px-2 py-1 rounded shadow-sm hover:bg-slate-50">+ {cfg.name}</button>
                                <button onClick={() => cfg.rmFn(pathIds, item.id)} className="text-slate-400 hover:text-red-700 px-1.5 font-bold">&times;</button>
                            </div>
                        </div>
                        <HierarchyEditor list={item[cfg.key] || []} level={level+1} pathIds={[...pathIds, item.id]} handlers={handlers} />
                    </div>
                ))}
            </div>
        );
    };

    function App() {
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [authLoading, setAuthLoading] = useState(true);
      const [authError, setAuthError] = useState('');
      const [signUpMessage, setSignUpMessage] = useState('');
      
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [rememberId, setRememberId] = useState(false);

      const [activeTab, setActiveTab] = useState('npv');
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [inputs, setInputs] = useState(DEFAULT_INPUTS);
      const [projects, setProjects] = useState([]);
      const [projectName, setProjectName] = useState('새 프로젝트');
      const [currentProjectId, setCurrentProjectId] = useState(null);
      const [saveStatus, setSaveStatus] = useState('');

      const checkApprovalAndSetUser = async (sessionUser) => {
        if (!sessionUser) {
          setUser(null); setAuthLoading(false); return;
        }
        try {
          const { data, error } = await supabaseClient.from('user_profiles').select('is_approved').eq('id', sessionUser.id);
          const userEmail = sessionUser.email.toLowerCase();
          const isSuperAdmin = userEmail === 'ceo@hyminternational.com';
          let isApproved = false;
          let isAdminCheck = isSuperAdmin || userEmail.includes('admin');

          if (error) {
            console.warn("DB 프로필 조회 실패(테이블 미생성 등):", error.message);
          } else if (data && data.length > 0) {
            isApproved = data[0].is_approved === true;
          }

          if (isSuperAdmin) {
            isApproved = true;
            isAdminCheck = true;
          }

          if (isApproved || isAdminCheck) {
            setUser(sessionUser);
            setIsAdmin(isAdminCheck);
            setIsSidebarOpen(isAdminCheck);
            setAuthError('');
          } else {
            await supabaseClient.auth.signOut(); 
            setUser(null); 
            setAuthError('⏳ 관리자 승인 대기 중입니다.');
          }
        } catch (e) { 
          console.error("Auth Exception:", e);
          const userEmail = sessionUser.email?.toLowerCase() || '';
          const isSuperAdmin = userEmail === 'ceo@hyminternational.com';
          const isAdminCheck = isSuperAdmin || userEmail.includes('admin');
          
          setUser(sessionUser); 
          setIsAdmin(isAdminCheck);
          setIsSidebarOpen(isAdminCheck);
          setAuthError('');
        }
        setAuthLoading(false);
      };

      useEffect(() => {
        supabaseClient.auth.getSession().then(({ data }) => checkApprovalAndSetUser(data?.session?.user));
        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((event, session) => {
          if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') checkApprovalAndSetUser(session?.user);
          else if (event === 'SIGNED_OUT') setUser(null);
        });
        const savedEmail = localStorage.getItem('feasibility_saved_email');
        if(savedEmail) { setEmail(savedEmail); setRememberId(true); }
        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const fetchProjects = async () => {
          const { data } = await supabaseClient.from('feasibility_projects').select('id, name, updated_at, inputs').order('updated_at', { ascending: false });
          if (data) setProjects(data);
        };
        fetchProjects();
      }, [user]);

      const handleLogin = async (e) => {
        e.preventDefault(); setAuthError(''); setSignUpMessage(''); setAuthLoading(true);
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) setAuthError(`❌ 로그인 실패: ${error.message === 'Invalid login credentials' ? '정보 불일치' : error.message}`);
        else if(rememberId) localStorage.setItem('feasibility_saved_email', email);
        else localStorage.removeItem('feasibility_saved_email');
        setAuthLoading(false);
      };

      const handleSignUp = async (e) => {
        e.preventDefault(); setAuthError(''); setSignUpMessage('');
        if(password.length < 6) return setAuthError('비밀번호는 6자리 이상이어야 합니다.');
        setAuthLoading(true);
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) setAuthError(`❌ 가입 실패: ${error.message}`);
        else if (data?.user) { await supabaseClient.auth.signOut(); setSignUpMessage('✅ 가입 완료! 관리자 승인 후 로그인 가능합니다.'); }
        setAuthLoading(false);
      };

      const handleLogout = async () => { await supabaseClient.auth.signOut(); setUser(null); };

      const handleSave = async () => {
        if (!user) return; setSaveStatus('저장 중...');
        try {
          if (currentProjectId) await supabaseClient.from('feasibility_projects').update({ name: projectName, inputs, updated_at: new Date().toISOString() }).eq('id', currentProjectId);
          else {
            const { data } = await supabaseClient.from('feasibility_projects').insert([{ name: projectName, inputs, user_id: user.id }]).select();
            if (data && data.length > 0) setCurrentProjectId(data[0].id);
          }
          setSaveStatus('✅ 저장 완료');
          const { data: updated } = await supabaseClient.from('feasibility_projects').select('id, name, updated_at, inputs').order('updated_at', { ascending: false });
          if (updated) setProjects(updated);
          setTimeout(() => setSaveStatus(''), 3000);
        } catch (e) { setSaveStatus('❌ 권한 오류'); }
      };

      const handleLoad = (id) => {
        const proj = projects.find(p => p.id == id);
        if (proj) {
          let loaded = cloneDeep(proj.inputs);
          loaded = { ...DEFAULT_INPUTS, ...loaded };
          
          ['inflationRate', 'interestRate', 'exchangeRate', 'industryGrowth', 'taxRate', 'costOfEquity', 'capexMaxCapa', 'utilization', 'lossRate', 'arDays', 'invDays', 'apDays', 'logisticsRate', 'salesCommRate', 'asCostRate', 'utilities', 'travel', 'telecom', 'laborFix', 'benefits', 'rent', 'taxes', 'insurance', 'fees', 'rnd', 'marketing', 'supplies', 'badDebt', 'otherSga', 'nonOpIncCash', 'nonOpIncNonCash', 'nonOpExpCash', 'nonOpExpNonCash'].forEach(k => {
             loaded[k] = pad6(loaded[k] || DEFAULT_INPUTS[k]);
          });
          
          ['equityList', 'debtList', 'capexList', 'intangibleList', 'advancesList', 'accruedList', 'prepaidList', 'receivableList', 'baseCostList'].forEach(k => {
             if(loaded[k]) loaded[k] = loaded[k].map(it => ({...it, amounts: pad6(it.amounts)}));
          });
          
          ['directExpList', 'indirectExpList'].forEach(k => {
             if(loaded[k]) loaded[k] = loaded[k].map(it => ({...it, rates: pad6(it.rates || it.amounts)}));
          });

          const fixTree = (cList) => (cList||[]).map(c => {
             c.bizTypes = (c.bizTypes||[]).map(bt => {
                 bt.salesModes = (bt.salesModes||[]).map(sm => {
                     sm.channels = (sm.channels||[]).map(ch => {
                         ch.clients = (ch.clients||[]).map(cl => {
                             cl.categories = (cl.categories||[]).map(cat => {
                                 cat.products = (cat.products||[]).map(p => {
                                     p.prices = pad6(p.prices); 
                                     p.volumes = pad6(p.volumes); 
                                     p.supplyCosts = pad6(p.supplyCosts||[0]);
                                     p.purchaseVolumes = pad6(p.purchaseVolumes||[0]);
                                     if(p.isInternal === undefined) p.isInternal = true;
                                     return p;
                                 }); return cat;
                             }); return cl;
                         }); return ch;
                     }); return sm;
                 }); return bt;
             }); return c;
          });

          if (loaded.salesHierarchy && loaded.salesHierarchy.length>0 && loaded.salesHierarchy[0].clients) {
             loaded.salesHierarchy = loaded.salesHierarchy.map(c => ({
                id: c.id, name: c.name, bizTypes: [{ id: `bt_${c.id}`, name: 'B2B/B2C 통합', salesModes: [{ id: `sm_${c.id}`, name: '온/오프 통합', channels: [{ id: `ch_${c.id}`, name: '기본 채널', clients: (c.clients||[]).map(cl => ({
                   id: cl.id, name: cl.name, categories: [{ id: `cat_${cl.id}`, name: '기본 품목군', products: cl.products }]
                })) }] }] }]
             }));
          }
          loaded.salesHierarchy = fixTree(loaded.salesHierarchy);
          setInputs(loaded); setProjectName(proj.name); setCurrentProjectId(proj.id);
        }
      };

      const handleArrayChange = (name, index, value) => setInputs(prev => { const newArr = pad6(prev[name]); newArr[index] = value; return { ...prev, [name]: newArr }; });
      const handleListAmt = (listName, id, index, value) => setInputs(prev => ({ ...prev, [listName]: prev[listName].map(item => item.id === id ? { ...item, amounts: item.amounts.map((a, i) => i === index ? value : a), rates: item.rates ? item.rates.map((a, i) => i === index ? value : a) : undefined } : item) }));
      const handleListField = (listName, id, field, value) => setInputs(prev => ({ ...prev, [listName]: prev[listName].map(item => item.id === id ? { ...item, [field]: value } : item) }));
      const addListItem = (listName) => setInputs(prev => ({ ...prev, [listName]: [...prev[listName], { id: Date.now(), name: '', amounts: pad6([0]), rates: pad6([0]), usefulLife: 5 }] }));
      const removeListItem = (listName, id) => setInputs(prev => ({ ...prev, [listName]: prev[listName].filter(item => item.id !== id) }));

      const hHandlers = {
          addLevelItem: (pathIds, newObj, targetKey) => setInputs(p => {
              const h = cloneDeep(p.salesHierarchy); let targetArr = h;
              const keys = ['bizTypes', 'salesModes', 'channels', 'clients', 'categories', 'products'];
              pathIds.forEach((id, i) => { targetArr = targetArr.find(x => x.id === id)[keys[i]] = targetArr.find(x => x.id === id)[keys[i]]||[]; });
              targetArr.push(newObj); return {...p, salesHierarchy: h};
          }),
          rmLevelItem: (pathIds, targetId) => setInputs(p => {
              const h = cloneDeep(p.salesHierarchy); let targetArr = h;
              const keys = ['bizTypes', 'salesModes', 'channels', 'clients', 'categories', 'products'];
              pathIds.forEach((id, i) => { targetArr = targetArr.find(x => x.id === id)[keys[i]] = targetArr.find(x => x.id === id)[keys[i]]||[]; });
              const idx = targetArr.findIndex(x => x.id === targetId); if(idx > -1) targetArr.splice(idx, 1);
              return {...p, salesHierarchy: h};
          }),
          updateName: (pathIds, targetId, val) => setInputs(p => {
              const h = cloneDeep(p.salesHierarchy); let targetArr = h;
              const keys = ['bizTypes', 'salesModes', 'channels', 'clients', 'categories', 'products'];
              pathIds.forEach((id, i) => { targetArr = targetArr.find(x => x.id === id)[keys[i]] = targetArr.find(x => x.id === id)[keys[i]]||[]; });
              const node = targetArr.find(x => x.id === targetId); if(node) node.name = val;
              return {...p, salesHierarchy: h};
          }),
          updateField: (pathIds, targetId, field, arrIdx, val) => setInputs(p => {
              const h = cloneDeep(p.salesHierarchy); let targetArr = h;
              const keys = ['bizTypes', 'salesModes', 'channels', 'clients', 'categories', 'products'];
              pathIds.forEach((id, i) => { targetArr = targetArr.find(x => x.id === id)[keys[i]] = targetArr.find(x => x.id === id)[keys[i]]||[]; });
              const node = targetArr.find(x => x.id === targetId);
              if(node) { 
                 if(arrIdx !== null) { 
                    node[field] = pad6(node[field] || [0]); 
                    node[field][arrIdx] = val; 
                 } else node[field] = val; 
              }
              return {...p, salesHierarchy: h};
          })
      };

      const treeActions = {
          addCountry: () => hHandlers.addLevelItem([], {id: Date.now().toString(), name: '', bizTypes: []}, 'salesHierarchy'),
          rmCountry: (p, id) => hHandlers.rmLevelItem(p, id),
          addBizType: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', salesModes: []}, 'bizTypes'),
          rmBizType: (p, id) => hHandlers.rmLevelItem(p, id),
          addSalesMode: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', channels: []}, 'salesModes'),
          rmSalesMode: (p, id) => hHandlers.rmLevelItem(p, id),
          addChannel: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', clients: []}, 'channels'),
          rmChannel: (p, id) => hHandlers.rmLevelItem(p, id),
          addClient: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', categories: []}, 'clients'),
          rmClient: (p, id) => hHandlers.rmLevelItem(p, id),
          addCategory: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', products: []}, 'categories'),
          rmCategory: (p, id) => hHandlers.rmLevelItem(p, id),
          addProduct: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', isInternal: true, prices: pad6([0]), volumes: pad6([0]), supplyCosts: pad6([0]), purchaseVolumes: pad6([0])}, 'products'),
          rmProduct: (p, id) => hHandlers.rmLevelItem(p, id),
          updateName: hHandlers.updateName, updateField: hHandlers.updateField
      };

      const model = useMemo(() => {
        const infRate = pad6(inputs.inflationRate || [2.5]);
        const infMultArr = [1];
        for(let i=1; i<6; i++) infMultArr[i] = infMultArr[i-1] * (1 + (infRate[i]/100));

        const sumMil = (list, i) => (list||[]).reduce((s, it) => s + toMil((it.amounts||[])[i]), 0);
        const totalEquity = [0,1,2,3,4,5].map(i => sumMil(inputs.equityList, i));
        const totalDebt = [0,1,2,3,4,5].map(i => sumMil(inputs.debtList, i));
        const totalCapex = [0,1,2,3,4,5].map(i => sumMil(inputs.capexList, i));
        const totalIntangible = [0,1,2,3,4,5].map(i => sumMil(inputs.intangibleList, i));
        const totalAdvances = [0,1,2,3,4,5].map(i => sumMil(inputs.advancesList, i));
        const totalAccrued = [0,1,2,3,4,5].map(i => sumMil(inputs.accruedList, i));
        const totalPrepaid = [0,1,2,3,4,5].map(i => sumMil(inputs.prepaidList, i));
        const totalReceivable = [0,1,2,3,4,5].map(i => sumMil(inputs.receivableList, i));

        const initV = totalEquity[0] + totalDebt[0];
        const wE = initV > 0 ? totalEquity[0]/initV : 0;
        const wD = initV > 0 ? totalDebt[0]/initV : 0;
        const wacc = initV > 0 ? (wE * ((inputs.costOfEquity[0]||0)/100)) + (wD * ((inputs.interestRate[0]||0)/100) * (1 - (inputs.taxRate[0]||0)/100)) : ((inputs.costOfEquity[0]||0)/100);

        let res = { is_financial: [], is_managerial: [], bs: [], cf: [], fcffData: [], npv: 0, irr: 0, paybackPeriod: null, wacc, wE, wD, infMultArr, totalBaseCostArr: [] };
        
        let revTreeGlobal=[], intVolTreeGlobal=[], extCogsTreeGlobal=[], intCogsFactorTreeGlobal=[];
        let prevCash=0, accumDebt=0, accumCapital=0, accumBadDebt=0, accumOtherNonCash=0, prevArGross=0, prevInvValue=0, prevRetainedEarnings=0;

        for (let i = 0; i < 6; i++) {
          accumCapital += totalEquity[i]; accumDebt += totalDebt[i];

          const capa = (inputs.capexMaxCapa||[])[i]||0;
          const util = (inputs.utilization||[])[i]||0;
          const loss = (inputs.lossRate||[])[i]||0;
          const actualProdVol = capa * (util / 100) * (1 - loss / 100);

          const buildLevel = (nodes, type, currentExRate=1) => {
              let levelSum=0, levelSub=[];
              (nodes||[]).forEach(n => {
                  const exRate = n.bizTypes ? ((n.name && (n.name.includes('한국')||n.name.includes('대한민국')||n.name.includes('korea'))) ? 1 : ((inputs.exchangeRate||[])[i]||1)) : currentExRate;
                  if (n.products) { 
                     let catSum=0, catSub=[];
                     (n.products||[]).forEach(p => {
                         let vol = (p.volumes||[])[i]||0;
                         for(let y=1; y<=i; y++) vol *= (1 + (((inputs.industryGrowth||[])[y]||0)/100));
                         
                         if (type === 'rev') {
                             const sales = ((p.prices||[])[i]||0) * exRate * vol;
                             catSum += sales; catSub.push({ label: p.name||'품목', values: pad6([0]).map((_,idx)=>idx===i?sales:0), level: 8 });
                         } else if (type === 'intCogsVol' && p.isInternal !== false) {
                             catSum += vol; catSub.push({ label: p.name||'품목', vol, level: 8 });
                         } else if (type === 'extCogs' && p.isInternal === false) {
                             const ecogs = ((p.supplyCosts||[])[i]||0) * exRate * vol;
                             catSum += ecogs; catSub.push({ label: p.name||'품목', values: pad6([0]).map((_,idx)=>idx===i?ecogs:0), level: 8 });
                         }
                     });
                     levelSum += catSum; if(catSum>0 || i===0) levelSub.push({ label: n.name||'품목군', values: pad6([0]).map((_,idx)=>idx===i?catSum:0), isGroup:true, level:7, sub: catSub });
                  } else if (n.categories) { const { sum, sub } = buildLevel(n.categories, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ label: n.name||'거래처', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:6, sub });
                  } else if (n.clients) { const { sum, sub } = buildLevel(n.clients, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ label: n.name||'채널', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:5, sub });
                  } else if (n.channels) { const { sum, sub } = buildLevel(n.channels, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ label: n.name||'판매형태', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:4, sub });
                  } else if (n.salesModes) { const { sum, sub } = buildLevel(n.salesModes, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ label: n.name||'사업영역', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:3, sub });
                  } else if (n.bizTypes) { const { sum, sub } = buildLevel(n.bizTypes, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ label: n.name||'국가', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:2, sub });
                  }
              }); return { sum: levelSum, sub: levelSub };
          };

          const { sum: revenue, sub: revTree } = buildLevel(inputs.salesHierarchy, 'rev');
          const { sum: totalInternalSalesVol, sub: intVolTree } = buildLevel(inputs.salesHierarchy, 'intCogsVol');
          const { sum: externalCogs, sub: extCogsTree } = buildLevel(inputs.salesHierarchy, 'extCogs');

          const totalBaseCost = (inputs.baseCostList||[]).reduce((s, bc) => s + toMil((bc.amounts||[])[i])*infMultArr[i], 0);
          res.totalBaseCostArr.push(totalBaseCost);
          const totalDirExp = (inputs.directExpList||[]).reduce((s, de) => s + totalBaseCost*(((de.rates||[])[i]||0)/100), 0);
          const totalIndExp = (inputs.indirectExpList||[]).reduce((s, ie) => s + totalBaseCost*(((ie.rates||[])[i]||0)/100), 0);

          let depreciation=0, amortization=0;
          (inputs.capexList||[]).forEach(it => (it.amounts||[]).forEach((a, j) => { if(a && i >= j && i <= j+(it.usefulLife||5)-1) depreciation += toMil(a)/(it.usefulLife||5); }));
          (inputs.intangibleList||[]).forEach(it => (it.amounts||[]).forEach((a, j) => { if(a && i >= j && i <= j+(it.usefulLife||5)-1) amortization += toMil(a)/(it.usefulLife||5); }));

          const totalMfgCost = totalBaseCost + totalDirExp + totalIndExp + depreciation;
          const unitMfgCost = actualProdVol > 0 ? totalMfgCost / actualProdVol : 0;
          const internalCogs = totalInternalSalesVol * unitMfgCost;
          
          const convertVolToCogs = (nodes) => {
              nodes.forEach(n => {
                 if (n.vol !== undefined) { const cogs = n.vol * unitMfgCost; n.values = pad6([0]).map((_,idx)=>idx===i?cogs:0); delete n.vol; }
                 else if (n.sub) { convertVolToCogs(n.sub); n.values[i] = n.sub.reduce((s, c) => s + c.values[i], 0); }
              });
          };
          convertVolToCogs(intVolTree);

          const mergeTree = (target, source) => {
              source.forEach((sNode, idx) => {
                  if(target[idx]) { target[idx].values[i] = sNode.values[i]; if(sNode.sub) mergeTree(target[idx].sub, sNode.sub); } 
                  else target.push(sNode);
              });
          };

          const ratio = actualProdVol > 0 ? totalInternalSalesVol / actualProdVol : 0;
          let factors = [];
          (inputs.baseCostList||[]).forEach(bc => factors.push({ label: bc.name, values: pad6([0]).map((_, idx) => idx===i ? (toMil((bc.amounts||[])[i])*infMultArr[i])*ratio : 0), level: 2 }));
          (inputs.directExpList||[]).forEach(de => factors.push({ label: de.name, values: pad6([0]).map((_, idx) => idx===i ? (totalBaseCost*(((de.rates||[])[i]||0)/100))*ratio : 0), level: 2 }));

          const calcExtInv = (nodes, currentExRate=1) => {

          const totalSgaVar = revenue * ((((inputs.logisticsRate||[])[i]||0)+((inputs.salesCommRate||[])[i]||0)+((inputs.asCostRate||[])[i]||0))/100);
          const totalSgaSemi = toMil(((inputs.utilities||[])[i]||0) + ((inputs.travel||[])[i]||0) + ((inputs.telecom||[])[i]||0)) * infMultArr[i];
