    const calculateIRR = (cashFlows) => {
      let guess = 0.1;
      for (let i = 0; i < 1000; i++) {
        let npv = 0, derivative = 0;
        for (let t = 0; t < cashFlows.length; t++) {
          npv += cashFlows[t] / Math.pow(1 + guess, t);
          if (t > 0) derivative -= (t * cashFlows[t]) / Math.pow(1 + guess, t + 1);
        }
        if (Math.abs(npv) < 0.001) return guess;
        let nextGuess = guess - npv / derivative;
        if (nextGuess <= -1) nextGuess = -0.99;
        if (Math.abs(nextGuess - guess) < 0.00001) return nextGuess;
        guess = nextGuess;
      }
      return guess;
    };

      const [isEditing, setIsEditing] = useState(false);

      useEffect(() => { 
        if(!isEditing) setLocalVal(value === 0 ? '0' : (value||0).toLocaleString()); 
      }, [value, isEditing]);

      const handleChange = (e) => setLocalVal(e.target.value);

      const commitValue = () => {
        setIsEditing(false);
        try {
          let cleanExpr = localVal.replace(/,/g, '').replace(/[^0-9.+\-*/()\s%]/g, '').replace(/%/g, '/100');
          if (cleanExpr === '') { onChange(0); setLocalVal('0'); return; }
          const val = new Function('return ' + cleanExpr)();
          if (!isNaN(val) && isFinite(val)) {
            onChange(Number(val));
            setLocalVal(Number(val).toLocaleString());
          } else {
            setLocalVal(value === 0 ? '0' : (value||0).toLocaleString());
          }
        } catch(err) {
          setLocalVal(value === 0 ? '0' : (value||0).toLocaleString());
        }
      };

      return (
        <input 
          type="text" 
          value={localVal} 
          onChange={handleChange} 
          onFocus={() => setIsEditing(true)}
          onBlur={commitValue}
          onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}

              </div>
              <div className="grid grid-cols-6 gap-1 mt-1">
                {pad6(item.rates || item.amounts).map((rate, idx) => {
                  const bc = model?.totalBaseCostArr?.[idx] || 0;
                  const val = bc * ((rate||0)/100);
                  const up = (model?.is_managerial?.[idx]?.actualProdVol > 0) ? val / model.is_managerial[idx].actualProdVol : 0;
                  return (
                    <div key={idx} className="flex flex-col">
                      <span className="text-[9px] text-slate-400 text-center mb-0.5 font-bold">Y{idx}</span>
                      <NumInput value={rate} onChange={(v) => onAmountChange(listName, item.id, idx, v, 'rates')} className="text-[12px] font-semibold text-slate-800" />
                      <span className="text-[9px] text-blue-600 text-right mt-1 font-semibold leading-tight truncate" title={`단가: ${formatCurrency(up)}원`}>@ {formatCurrency(up)}원</span>
                      <span className="text-[9px] text-slate-500 text-right leading-tight truncate" title={`총액: ${formatCurrency(val/1000000)}백만`}>{formatCurrency(val/1000000)}백만</span>
                    </div>
                  )
                })}
              </div>
            </div>
          ))}
        </div>
      </div>
    ));

    const InputGroup = React.memo(({ title, children }) => (
      <div className="mb-6 bg-white p-5 border-t-2 border-slate-800 shadow-sm rounded-sm">
        <h3 className="text-sm font-black text-slate-900 mb-5 tracking-tight">{title}</h3>
        <div>{children}</div>
      </div>
    ));

    const TableHead = ({ compact }) => (
      <thead>
        <tr className="bg-slate-100 border-y-2 border-slate-800">
          <th className={`py-3 px-4 text-left text-[13px] font-black text-slate-800 tracking-wider ${compact ? 'w-1/3' : 'w-[28%]'}`}>항목</th>
          {[0,1,2,3,4,5].map(y => <th key={y} className="py-3 px-4 text-right text-[12px] font-black text-slate-800">Y{y}</th>)}
        </tr>
      </thead>
    );

    const TreeRow = ({ node, isCompact }) => {
        const [ex, setEx] = useState(false);
        const hasD = node.sub && node.sub.length > 0;
        return (
            <React.Fragment>
                <tr className="bg-white border-b border-slate-100 hover:bg-slate-50 transition-colors">
                   <td className={`py-2 px-4 text-left text-xs ${hasD?'cursor-pointer select-none':''} ${node.isGroup?'font-bold text-slate-800':'text-slate-600'}`} style={{ paddingLeft: `${node.level * 1.2}rem` }} onClick={() => hasD && setEx(!ex)}>
                      <div className="flex items-center gap-1.5">
                         {hasD ? <span className="w-3 text-slate-400 text-[10px] leading-none">{ex ? '▼' : '▶'}</span> : <span className="w-3"></span>}
                         <span className="leading-tight">{node.label}</span>
                      </div>
                   </td>
                   {(node.values||pad6([0])).map((v, vi) => (
                      <td key={vi} className={`py-2 px-4 text-right text-xs align-middle ${node.isGroup ? 'font-bold text-slate-800' : 'text-slate-600'}`}>
                         <span>{formatCurrency((v||0) / 1000000)}</span>
                         {node.ratios && node.ratios[vi] != null ? <div className="text-[9px] text-slate-400 font-normal mt-0.5">{formatPercent(node.ratios[vi])}</div> : null}
                      </td>
                   ))}
                </tr>
                {ex && hasD && node.sub.map((child, i) => <TreeRow key={`${node.level}-${i}`} node={child} isCompact={isCompact} />)}
            </React.Fragment>
        );
    };

    const ExpandableRow = ({ label, values, ratios, details, isBold, isTotal, isHeader, isCompact = false }) => {
      const [ex, setEx] = useState(false);
      const hasD = details && details.length > 0;
      let rowCls = 'border-b border-slate-200 text-slate-800 bg-white hover:bg-slate-50 transition-colors';
      if (isHeader) rowCls = 'border-t-2 border-b-2 border-slate-800 font-bold bg-slate-100 text-slate-900';
      else if (isTotal) rowCls = 'border-y border-slate-300 font-bold bg-slate-50 text-slate-900';
      else if (isBold) rowCls = 'font-bold text-slate-900';
      const paddingClass = isCompact ? 'py-1.5 px-3' : 'py-2.5 px-4';
      const labelTextSize = isCompact ? 'text-[12px]' : 'text-sm';
      const valueTextSize = isCompact ? 'text-[11px]' : 'text-[12px]';
      return (
        <React.Fragment>
          <tr className={rowCls}>
            <td className={`${paddingClass} text-left ${hasD ? 'cursor-pointer select-none' : ''}`} onClick={() => hasD && setEx(!ex)}>
              <div className="flex items-center gap-1.5">
                <span className="w-3 text-slate-400 text-[10px]">{hasD ? (ex ? '▼' : '▶') : ''}</span>
                <span className={labelTextSize}>{label}</span>
              </div>
            </td>
            {pad6(values).map((val, idx) => (
              <td key={idx} className={`${paddingClass} text-right align-middle ${valueTextSize}`}>
                <span>{formatCurrency((val||0) / 1000000)}</span>
                {ratios && ratios[idx] != null ? <div className="text-[10px] text-slate-400 font-normal mt-0.5 tracking-tighter">({formatPercent(ratios[idx])})</div> : null}
              </td>
            ))}
          </tr>
          {ex && hasD && details.map((d, i) => <TreeRow key={`d-${i}`} node={d} isCompact={isCompact} />)}
        </React.Fragment>
      );
    };

    const HierarchyEditor = ({ list, level, pathIds, handlers }) => {
        const levelConfig = [
            { key: 'countries', name: '국가', addFn: handlers.addCountry, rmFn: handlers.rmRevType, ph: '매출 유형명 (예: 제품/상품 판매)' },
            { key: 'brands', name: '브랜드', addFn: handlers.addBrand, rmFn: handlers.rmCountry, ph: '국가명' },
            { key: 'bizTypes', name: '사업영역 (B2B/B2C)', addFn: handlers.addBizType, rmFn: handlers.rmBrand, ph: '브랜드명' },
            { key: 'salesModes', name: '판매형태 (온/오프라인)', addFn: handlers.addSalesMode, rmFn: handlers.rmBizType, ph: '사업영역명' },
            { key: 'channels', name: '유통채널 (병원/약국 등)', addFn: handlers.addChannel, rmFn: handlers.rmSalesMode, ph: '판매형태명' },
            { key: 'clients', name: '거래처', addFn: handlers.addClient, rmFn: handlers.rmChannel, ph: '채널명' },
            { key: 'categories', name: '품목군', addFn: handlers.addCategory, rmFn: handlers.rmClient, ph: '거래처명' },
            { key: 'products', name: '품목', addFn: handlers.addProduct, rmFn: handlers.rmCategory, ph: '품목군명' }
        ];

        if (level === 8) { 
            return (
                <div className="space-y-3 mt-2">
                   {(list||[]).map(product => (
                      <div key={product.id} className="bg-slate-50 p-2.5 rounded border border-slate-200 shadow-sm relative overflow-hidden">
                         {product.isInternal === false && <div className="absolute top-0 left-0 w-1 h-full bg-orange-500"></div>}
                         <div className="flex justify-between items-center mb-3 border-b border-slate-200 pb-2 pl-2">
                            <input type="text" value={product.name} onChange={(e) => handlers.updateField(pathIds, product.id, 'name', null, e.target.value)} placeholder="품목명 입력" className="text-[12px] font-bold text-slate-800 bg-transparent border-b border-transparent focus:border-red-700 outline-none w-1/2 px-1" />
                            <div className="flex items-center gap-3">
                               <label className="text-[10px] flex items-center gap-1 font-bold text-slate-600 cursor-pointer bg-white px-1.5 py-0.5 rounded border border-slate-200 shadow-sm">
                                  <input type="checkbox" checked={product.isInternal !== false} onChange={(e) => handlers.updateField(pathIds, product.id, 'isInternal', null, e.target.checked)} className="accent-red-700" /> 자체생산
                               </label>
                               <button onClick={() => handlers.rmProduct(pathIds, product.id)} className="text-slate-400 hover:text-red-700 font-bold px-1">&times;</button>
                            </div>
                         </div>
                         <div className="pl-2 pr-1">
                             <div className="text-[11px] font-bold text-slate-700 mb-1.5 mt-1 border-t border-slate-200/50 pt-2">단가 (Price - 원)</div>
                             <div className="grid grid-cols-2 gap-x-3 gap-y-2 mb-3">
                                {pad6(product.prices).map((p, idx) => (
                                   <div key={`p-${idx}`} className="flex items-center gap-1.5">
                                      <span className="text-[10px] text-slate-400 font-bold w-4 text-center shrink-0">Y{idx}</span>
                                      <NumInput value={p} onChange={(v) => handlers.updateField(pathIds, product.id, 'prices', idx, v)} className="text-[12px] font-semibold flex-1 min-w-0" />
                                   </div>
                                ))}
                             </div>

                             <div className="text-[11px] font-bold text-slate-700 mb-1.5 mt-2 border-t border-slate-200/50 pt-2">목표 수량 (Volume - 개)</div>
                             <div className="grid grid-cols-2 gap-x-3 gap-y-2 mb-2">
                                {pad6(product.volumes).map((v, idx) => (
                                   <div key={`v-${idx}`} className="flex items-center gap-1.5">
                                      <span className="text-[10px] text-slate-400 font-bold w-4 text-center shrink-0">Y{idx}</span>
                                      <NumInput value={v} onChange={(val) => handlers.updateField(pathIds, product.id, 'volumes', idx, val)} className="text-[12px] font-semibold flex-1 min-w-0" />
                                   </div>
                                ))}
                             </div>
                             
                             {product.isInternal === false && (
                                 <div className="mt-3 bg-orange-50/50 p-2 rounded border border-orange-100">
                                   <div className="text-[11px] font-black text-orange-700 mb-1.5">외부조달 공급원가 (Supply Cost - 원)</div>
                                   <div className="grid grid-cols-2 gap-x-3 gap-y-2">
                                      {pad6(product.supplyCosts||[]).map((sc, idx) => (
                                         <div key={`sc-${idx}`} className="flex items-center gap-1.5">
                                            <span className="text-[10px] text-orange-400 font-bold w-4 text-center shrink-0">Y{idx}</span>
                                            <NumInput value={sc} onChange={(v) => handlers.updateField(pathIds, product.id, 'supplyCosts', idx, v)} className="text-[12px] font-semibold border-orange-300 focus:border-orange-500 bg-white text-orange-900 flex-1 min-w-0" />
                                         </div>
                                      ))}
                                   </div>
                                 </div>
                             )}
                         </div>
                      </div>
                   ))}
                </div>
            );
        }

        const cfg = levelConfig[level];
        return (
            <div className="space-y-3">
                {(list||[]).map(item => (
                    <div key={item.id} className={`p-2.5 rounded border border-slate-200 ${level===0?'bg-slate-100':level===1?'bg-white ml-2 shadow-sm':level===2?'bg-slate-50 ml-2':'bg-white ml-2 shadow-sm'}`}>
                        <div className="flex justify-between items-center mb-2 pb-1 border-b border-slate-200/50">
                            <input type="text" value={item.name} onChange={(e) => handlers.updateName(pathIds, item.id, e.target.value)} placeholder={cfg.ph} className="text-[12px] font-bold text-slate-800 bg-transparent border-b border-transparent focus:border-red-700 outline-none w-1/2 px-1" />
                            <div className="flex gap-1">
                                <button onClick={() => cfg.addFn(pathIds, item.id)} className="text-[10px] font-bold text-slate-600 bg-white border border-slate-300 px-2 py-1 rounded shadow-sm hover:bg-slate-50">+ {cfg.name}</button>
                                <button onClick={() => cfg.rmFn(pathIds, item.id)} className="text-slate-400 hover:text-red-700 px-1.5 font-bold">&times;</button>
                            </div>
                        </div>
                        <HierarchyEditor list={item[cfg.key] || []} level={level+1} pathIds={[...pathIds, item.id]} handlers={handlers} />
                    </div>
                ))}
            </div>
        );
    };

    function App() {
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [authLoading, setAuthLoading] = useState(true);
      const [authError, setAuthError] = useState('');
      const [signUpMessage, setSignUpMessage] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [rememberId, setRememberId] = useState(false);
      const [activeTab, setActiveTab] = useState('npv');
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [inputs, setInputs] = useState(DEFAULT_INPUTS);
      const [projects, setProjects] = useState([]);
      const [projectName, setProjectName] = useState('새 프로젝트');
      const [currentProjectId, setCurrentProjectId] = useState(null);
      const [saveStatus, setSaveStatus] = useState('');
      const [isPublicProject, setIsPublicProject] = useState(false);

      const checkApprovalAndSetUser = async (sessionUser) => {
        if (!sessionUser) {
          setUser(null); setAuthLoading(false); return;
        }
        try {
          const { data, error } = await supabaseClient.from('user_profiles').select('is_approved').eq('id', sessionUser.id);
          const userEmail = sessionUser.email.toLowerCase();
          const isSuperAdmin = userEmail === 'ceo@hyminternational.com';
          let isApproved = false;
          let isAdminCheck = isSuperAdmin || userEmail.includes('admin');

          if (error) console.warn("DB 프로필 조회 실패:", error.message);
          else if (data && data.length > 0) isApproved = data[0].is_approved === true;
          if (isSuperAdmin) { isApproved = true; isAdminCheck = true; }

          if (isApproved || isAdminCheck) {
            setUser(sessionUser); setIsAdmin(isAdminCheck); setIsSidebarOpen(isAdminCheck); setAuthError('');
          } else {
            await supabaseClient.auth.signOut(); setUser(null); setAuthError('⏳ 관리자 승인 대기 중입니다.');
          }
        } catch (e) { 
          const userEmail = sessionUser.email?.toLowerCase() || '';
          const isAdminCheck = userEmail === 'ceo@hyminternational.com' || userEmail.includes('admin');
          setUser(sessionUser); setIsAdmin(isAdminCheck); setIsSidebarOpen(isAdminCheck); setAuthError('');
        }
        setAuthLoading(false);
      };

      useEffect(() => {
        supabaseClient.auth.getSession().then(({ data }) => checkApprovalAndSetUser(data?.session?.user));
        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((event, session) => {
          if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') checkApprovalAndSetUser(session?.user);
          else if (event === 'SIGNED_OUT') setUser(null);
        });
        const savedEmail = localStorage.getItem('feasibility_saved_email');
        if(savedEmail) { setEmail(savedEmail); setRememberId(true); }
        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const fetchProjects = async () => {
          const query = supabaseClient.from('feasibility_projects').select('id, name, updated_at, inputs, is_public').order('updated_at', { ascending: false });
          if (!isAdmin) query.eq('is_public', true);
          const { data } = await query;
          if (data) setProjects(data);
        };
        fetchProjects();
      }, [user, isAdmin]);

      const handleLogin = async (e) => {
        e.preventDefault(); setAuthError(''); setSignUpMessage(''); setAuthLoading(true);
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) setAuthError(`❌ 로그인 실패: ${error.message === 'Invalid login credentials' ? '정보 불일치' : error.message}`);
        else if(rememberId) localStorage.setItem('feasibility_saved_email', email);
        else localStorage.removeItem('feasibility_saved_email');
        setAuthLoading(false);
      };

      const handleSignUp = async (e) => {
        e.preventDefault(); setAuthError(''); setSignUpMessage('');
        if(password.length < 6) return setAuthError('비밀번호는 6자리 이상이어야 합니다.');
        setAuthLoading(true);
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) setAuthError(`❌ 가입 실패: ${error.message}`);
        else if (data?.user) { await supabaseClient.auth.signOut(); setSignUpMessage('✅ 가입 완료! 관리자 승인 후 로그인 가능합니다.'); }
        setAuthLoading(false);
      };

      const handleLogout = async () => { await supabaseClient.auth.signOut(); setUser(null); };

      const handleSave = async () => {
        if (!user) return; setSaveStatus('저장 중...');
        try {
          if (currentProjectId) await supabaseClient.from('feasibility_projects').update({ name: projectName, inputs, is_public: isPublicProject, updated_at: new Date().toISOString() }).eq('id', currentProjectId);
          else {
            const { data } = await supabaseClient.from('feasibility_projects').insert([{ name: projectName, inputs, is_public: isPublicProject, user_id: user.id }]).select();
            if (data && data.length > 0) setCurrentProjectId(data[0].id);
          }
          setSaveStatus('✅ 저장 완료');
          const query = supabaseClient.from('feasibility_projects').select('id, name, updated_at, inputs, is_public').order('updated_at', { ascending: false });
          if (!isAdmin) query.eq('is_public', true);
          const { data: updated } = await query;
          if (updated) setProjects(updated);
          setTimeout(() => setSaveStatus(''), 3000);
        } catch (e) { setSaveStatus('❌ 권한 오류'); }
      };

      const handleDelete = async () => {
        if (!currentProjectId || !isAdmin) return;
        try {
          await supabaseClient.from('feasibility_projects').delete().eq('id', currentProjectId);
          setInputs(DEFAULT_INPUTS); setProjectName('새 프로젝트'); setCurrentProjectId(null); setIsPublicProject(false);
          const { data: updated } = await supabaseClient.from('feasibility_projects').select('id, name, updated_at, inputs, is_public').order('updated_at', { ascending: false });
          if (updated) setProjects(updated);
        } catch (e) { alert('삭제 권한이 없습니다.'); }
      };

      const handleLoad = (id) => {
        const proj = projects.find(p => p.id == id);
        if (proj) {
          let loaded = cloneDeep(proj.inputs);
          loaded = { ...DEFAULT_INPUTS, ...loaded };
          
          ['inflationRate', 'interestRate', 'exchangeRate', 'industryGrowth', 'taxRate', 'costOfEquity', 'capexMaxCapa', 'utilization', 'lossRate', 'arDays', 'invDays', 'apDays'].forEach(k => {
             loaded[k] = pad6(loaded[k] || DEFAULT_INPUTS[k]);
          });
          
          ['advancesList', 'accruedList', 'prepaidList', 'receivableList', 'sgaVarList', 'sgaSemiList', 'sgaFixList'].forEach(k => {
             if(loaded[k]) loaded[k] = loaded[k].map(it => ({...it, amounts: pad6(it.amounts), rates: pad6(it.rates), isRate: it.isRate ?? true, calcType: it.calcType || (it.isRate ? 'rate' : 'amount')}));
          });

          ['equityList', 'debtList', 'capexList', 'intangibleList', 'baseCostList', 'nonOpIncCashList', 'nonOpIncNonCashList', 'nonOpExpCashList', 'nonOpExpNonCashList'].forEach(k => {
             if(loaded[k]) loaded[k] = loaded[k].map(it => ({...it, amounts: pad6(it.amounts)}));
          });
          
          ['directExpList', 'indirectExpList'].forEach(k => {
             if(loaded[k]) loaded[k] = loaded[k].map(it => ({...it, rates: pad6(it.rates || it.amounts)}));
          });

          const fixTree = (cList) => (cList||[]).map(rt => {
             rt.countries = (rt.countries||[]).map(c => {
                 if (c.bizTypes && !c.brands) {
                     c.brands = [{ id: `br_${c.id}`, name: '기본 브랜드', bizTypes: c.bizTypes }];
                     delete c.bizTypes;
                 }
                 c.brands = (c.brands||[]).map(br => {
                     br.bizTypes = (br.bizTypes||[]).map(bt => {
                         bt.salesModes = (bt.salesModes||[]).map(sm => {
                             sm.channels = (sm.channels||[]).map(ch => {
                                 ch.clients = (ch.clients||[]).map(cl => {
                                     cl.categories = (cl.categories||[]).map(cat => {
                                         cat.products = (cat.products||[]).map(p => {
                                             p.prices = pad6(p.prices); p.volumes = pad6(p.volumes); p.supplyCosts = pad6(p.supplyCosts||[0]);
                                             p.purchaseVolumes = pad6(p.purchaseVolumes||[0]);
                                             if(p.isInternal === undefined) p.isInternal = true;
                                             return p;
                                         }); return cat;
                                     }); return cl;
                                 }); return ch;
                             }); return sm;
                         }); return bt;
                     }); return br;
                 }); return c;
             }); return rt;
          });

          loaded.salesHierarchy = fixTree(loaded.salesHierarchy);
          setInputs(loaded); setProjectName(proj.name); setCurrentProjectId(proj.id); setIsPublicProject(proj.is_public || false);
        }
      };

      const handleArrayChange = (name, index, value) => setInputs(prev => { const newArr = pad6(prev[name]); newArr[index] = value; return { ...prev, [name]: newArr }; });
      const handleListAmt = (listName, id, index, value, targetField = 'amounts') => setInputs(prev => ({ ...prev, [listName]: prev[listName].map(item => item.id === id ? { ...item, [targetField]: item[targetField] ? item[targetField].map((a, i) => i === index ? value : a) : undefined } : item) }));
      const handleListField = (listName, id, field, value) => setInputs(prev => ({ ...prev, [listName]: prev[listName].map(item => item.id === id ? { ...item, [field]: value } : item) }));
      const addListItem = (listName) => setInputs(prev => ({ ...prev, [listName]: [...prev[listName], { id: Date.now(), name: '', amounts: pad6([0]), rates: pad6([0]), isRate: true, calcType: 'rate', usefulLife: 5 }] }));
      const removeListItem = (listName, id) => setInputs(prev => ({ ...prev, [listName]: prev[listName].filter(item => item.id !== id) }));

      const hHandlers = {
          addLevelItem: (pathIds, newObj, targetKey) => setInputs(p => {
              const h = cloneDeep(p.salesHierarchy); let targetArr = h;
              const keys = ['countries', 'brands', 'bizTypes', 'salesModes', 'channels', 'clients', 'categories', 'products'];
              pathIds.forEach((id, i) => { targetArr = targetArr.find(x => x.id === id)[keys[i]] = targetArr.find(x => x.id === id)[keys[i]]||[]; });
              targetArr.push(newObj); return {...p, salesHierarchy: h};
          }),
          rmLevelItem: (pathIds, targetId) => setInputs(p => {
              const h = cloneDeep(p.salesHierarchy); let targetArr = h;
              const keys = ['countries', 'brands', 'bizTypes', 'salesModes', 'channels', 'clients', 'categories', 'products'];
              pathIds.forEach((id, i) => { targetArr = targetArr.find(x => x.id === id)[keys[i]] = targetArr.find(x => x.id === id)[keys[i]]||[]; });
              const idx = targetArr.findIndex(x => x.id === targetId); if(idx > -1) targetArr.splice(idx, 1);
              return {...p, salesHierarchy: h};
          }),
          updateName: (pathIds, targetId, val) => setInputs(p => {
              const h = cloneDeep(p.salesHierarchy); let targetArr = h;
              const keys = ['countries', 'brands', 'bizTypes', 'salesModes', 'channels', 'clients', 'categories', 'products'];
              pathIds.forEach((id, i) => { targetArr = targetArr.find(x => x.id === id)[keys[i]] = targetArr.find(x => x.id === id)[keys[i]]||[]; });
              const node = targetArr.find(x => x.id === targetId); if(node) node.name = val;
              return {...p, salesHierarchy: h};
          }),
          updateField: (pathIds, targetId, field, arrIdx, val) => setInputs(p => {
              const h = cloneDeep(p.salesHierarchy); let targetArr = h;
              const keys = ['countries', 'brands', 'bizTypes', 'salesModes', 'channels', 'clients', 'categories', 'products'];
              pathIds.forEach((id, i) => { targetArr = targetArr.find(x => x.id === id)[keys[i]] = targetArr.find(x => x.id === id)[keys[i]]||[]; });
              const node = targetArr.find(x => x.id === targetId);
              if(node) { if(arrIdx !== null) { node[field] = pad6(node[field]); node[field][arrIdx] = val; } else node[field] = val; }
              return {...p, salesHierarchy: h};
          })
      };

      const treeActions = {
          addRevType: () => hHandlers.addLevelItem([], {id: Date.now().toString(), name: '', countries: []}, 'salesHierarchy'),
          rmRevType: (p, id) => hHandlers.rmLevelItem(p, id),
          addCountry: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', brands: []}, 'countries'),
          rmCountry: (p, id) => hHandlers.rmLevelItem(p, id),
          addBrand: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', bizTypes: []}, 'brands'),
          rmBrand: (p, id) => hHandlers.rmLevelItem(p, id),
          addBizType: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', salesModes: []}, 'bizTypes'),
          rmBizType: (p, id) => hHandlers.rmLevelItem(p, id),
          addSalesMode: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', channels: []}, 'salesModes'),
          rmSalesMode: (p, id) => hHandlers.rmLevelItem(p, id),
          addChannel: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', clients: []}, 'channels'),
          rmChannel: (p, id) => hHandlers.rmLevelItem(p, id),
          addClient: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', categories: []}, 'clients'),
          rmClient: (p, id) => hHandlers.rmLevelItem(p, id),
          addCategory: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', products: []}, 'categories'),
          rmCategory: (p, id) => hHandlers.rmLevelItem(p, id),
          addProduct: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', isInternal: true, prices: pad6([0]), volumes: pad6([0]), supplyCosts: pad6([0]), purchaseVolumes: pad6([0])}, 'products'),
          rmProduct: (p, id) => hHandlers.rmLevelItem(p, id),
          updateName: hHandlers.updateName, updateField: hHandlers.updateField
      };

      const model = useMemo(() => {
        const infRate = pad6(inputs.inflationRate || [2.5]);
        const infMultArr = [1];
        for(let i=1; i<6; i++) infMultArr[i] = infMultArr[i-1] * (1 + (infRate[i]/100));

        const sumMil = (list, i) => (list||[]).reduce((s, it) => s + toMil((it.amounts||[])[i]), 0);
        const totalEquity = [0,1,2,3,4,5].map(i => sumMil(inputs.equityList, i));
        const totalDebt = [0,1,2,3,4,5].map(i => sumMil(inputs.debtList, i));
        const totalCapex = [0,1,2,3,4,5].map(i => sumMil(inputs.capexList, i));
        const totalIntangible = [0,1,2,3,4,5].map(i => sumMil(inputs.intangibleList, i));

        const initV = totalEquity[0] + totalDebt[0];
        const wE = initV > 0 ? totalEquity[0]/initV : 0;
        const wD = initV > 0 ? totalDebt[0]/initV : 0;
        const wacc = initV > 0 ? (wE * ((inputs.costOfEquity[0]||0)/100)) + (wD * ((inputs.interestRate[0]||0)/100) * (1 - (inputs.taxRate[0]||0)/100)) : ((inputs.costOfEquity[0]||0)/100);

        let res = { is_financial: [], is_managerial: [], bs: [], cf: [], fcffData: [], npv: 0, irr: 0, paybackPeriod: null, wacc, wE, wD, infMultArr, totalBaseCostArr: [], totalLaborArr: [] };
        
        let revTreeGlobal=[], intVolTreeGlobal=[], extCogsTreeGlobal=[], intCogsFactorTreeGlobal=[];
        let prevCash=0, accumDebt=0, accumCapital=0, accumBadDebt=0, accumOtherNonCash=0, prevArGross=0, prevInvValue=0, prevRetainedEarnings=0;

        let prevWcBal = { advances: 0, accrued: 0, prepaid: 0, receivable: 0 };

        for (let i = 0; i < 6; i++) {
          accumCapital += totalEquity[i]; accumDebt += totalDebt[i];

          const capa = (inputs.capexMaxCapa||[])[i]||0;
          const util = (inputs.utilization||[])[i]||0;
          const loss = (inputs.lossRate||[])[i]||0;
          const actualProdVol = capa * (util / 100) * (1 - loss / 100);

          const buildLevel = (nodes, type, currentExRate=1) => {
              let levelSum=0, levelSub=[];
              (nodes||[]).forEach(n => {
                  const exRate = n.brands ? ((n.name && (n.name.includes('한국')||n.name.includes('대한민국')||n.name.includes('korea'))) ? 1 : ((inputs.exchangeRate||[])[i]||1)) : currentExRate;
                  if (n.products) { 
                     let catSum=0, catSub=[];
                     (n.products||[]).forEach(p => {
                         let vol = (p.volumes||[])[i]||0;
                         for(let y=1; y<=i; y++) vol *= (1 + (((inputs.industryGrowth||[])[y]||0)/100));
                         
                         if (type === 'rev') {
                             const sales = ((p.prices||[])[i]||0) * exRate * vol;
                             catSum += sales; catSub.push({ id: p.id, label: p.name||'품목', values: pad6([0]).map((_,idx)=>idx===i?sales:0), level: 9 });
                         } else if (type === 'intCogsVol' && p.isInternal !== false) {
                             catSum += vol; catSub.push({ id: p.id, label: p.name||'품목', vol, level: 9 });
                         } else if (type === 'extCogs' && p.isInternal === false) {
                             const ecogs = ((p.supplyCosts||[])[i]||0) * exRate * vol;
                             catSum += ecogs; catSub.push({ id: p.id, label: p.name||'품목', values: pad6([0]).map((_,idx)=>idx===i?ecogs:0), level: 9 });
                         }
                     });
                     levelSum += catSum; if(catSum>0 || i===0) levelSub.push({ id: n.id, label: n.name||'품목군', values: pad6([0]).map((_,idx)=>idx===i?catSum:0), isGroup:true, level:8, sub: catSub });
                  } else if (n.categories) { const { sum, sub } = buildLevel(n.categories, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ id: n.id, label: n.name||'거래처', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:7, sub });
                  } else if (n.clients) { const { sum, sub } = buildLevel(n.clients, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ id: n.id, label: n.name||'채널', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:6, sub });
                  } else if (n.channels) { const { sum, sub } = buildLevel(n.channels, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ id: n.id, label: n.name||'판매형태', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:5, sub });
                  } else if (n.salesModes) { const { sum, sub } = buildLevel(n.salesModes, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ id: n.id, label: n.name||'사업영역', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:4, sub });
                  } else if (n.bizTypes) { const { sum, sub } = buildLevel(n.bizTypes, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ id: n.id, label: n.name||'브랜드', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:3, sub });
                  } else if (n.brands) { const { sum, sub } = buildLevel(n.brands, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ id: n.id, label: n.name||'국가', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:2, sub });
                  } else if (n.countries) { const { sum, sub } = buildLevel(n.countries, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ id: n.id, label: n.name||'매출유형', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:1, sub });
                  }
              }); return { sum: levelSum, sub: levelSub };
          };

          const { sum: revenue, sub: revTree } = buildLevel(inputs.salesHierarchy, 'rev');
          const { sum: totalInternalSalesVol, sub: intVolTree } = buildLevel(inputs.salesHierarchy, 'intCogsVol');
          const { sum: externalCogs, sub: extCogsTree } = buildLevel(inputs.salesHierarchy, 'extCogs');

          const calcMixedWcBal = (list) => (list||[]).reduce((s, it) => {
              const type = it.calcType || (it.isRate ? 'rate' : 'amount');
              if (type === 'rate') return s + revenue * (((it.rates||[])[i]||0)/100);
              return s + toMil((it.amounts||[])[i]) * infMultArr[i];
          }, 0);

          const balAdvances = calcMixedWcBal(inputs.advancesList);
          const balAccrued = calcMixedWcBal(inputs.accruedList);
          const balPrepaid = calcMixedWcBal(inputs.prepaidList);
          const balReceivable = calcMixedWcBal(inputs.receivableList);

          const flowAdvances = balAdvances - prevWcBal.advances;
          const flowAccrued = balAccrued - prevWcBal.accrued;
          const flowPrepaid = balPrepaid - prevWcBal.prepaid;
          const flowReceivable = balReceivable - prevWcBal.receivable;
          prevWcBal = { advances: balAdvances, accrued: balAccrued, prepaid: balPrepaid, receivable: balReceivable };

          const totalBaseCost = (inputs.baseCostList||[]).reduce((s, bc) => s + toMil((bc.amounts||[])[i])*infMultArr[i], 0);
          res.totalBaseCostArr.push(totalBaseCost);
          const totalDirExp = (inputs.directExpList||[]).reduce((s, de) => s + totalBaseCost*(((de.rates||[])[i]||0)/100), 0);
          const totalIndExp = (inputs.indirectExpList||[]).reduce((s, ie) => s + totalBaseCost*(((ie.rates||[])[i]||0)/100), 0);

          let depreciation=0, amortization=0;
          (inputs.capexList||[]).forEach(it => (it.amounts||[]).forEach((a, j) => { if(a && i >= j && i <= j+(it.usefulLife||5)-1) depreciation += toMil(a)/(it.usefulLife||5); }));
          (inputs.intangibleList||[]).forEach(it => (it.amounts||[]).forEach((a, j) => { if(a && i >= j && i <= j+(it.usefulLife||5)-1) amortization += toMil(a)/(it.usefulLife||5); }));

          const totalMfgCost = totalBaseCost + totalDirExp + totalIndExp + depreciation;
          const unitMfgCost = actualProdVol > 0 ? totalMfgCost / actualProdVol : 0;
          const internalCogs = totalInternalSalesVol * unitMfgCost;
          
          const convertVolToCogs = (nodes) => {
              nodes.forEach(n => {
                 if (n.vol !== undefined) { const cogs = n.vol * unitMfgCost; n.values = pad6([0]).map((_,idx)=>idx===i?cogs:0); delete n.vol; }
                 else if (n.sub) { convertVolToCogs(n.sub); n.values[i] = n.sub.reduce((s, c) => s + c.values[i], 0); }
              });
          };
          convertVolToCogs(intVolTree);

          const mergeTree = (target, source) => {
              source.forEach((sNode, idx) => {
                  if(target[idx]) { target[idx].values[i] = sNode.values[i]; if(sNode.sub) mergeTree(target[idx].sub, sNode.sub); } 
                  else target.push(sNode);
              });
          };

          const ratio = actualProdVol > 0 ? totalInternalSalesVol / actualProdVol : 0;
          let factors = [];
          (inputs.baseCostList||[]).forEach(bc => factors.push({ label: bc.name, values: pad6([0]).map((_, idx) => idx===i ? (toMil((bc.amounts||[])[i])*infMultArr[i])*ratio : 0), level: 2 }));
          (inputs.directExpList||[]).forEach(de => factors.push({ label: de.name, values: pad6([0]).map((_, idx) => idx===i ? (totalBaseCost*(((de.rates||[])[i]||0)/100))*ratio : 0), level: 2 }));
          (inputs.indirectExpList||[]).forEach(ie => factors.push({ label: ie.name, values: pad6([0]).map((_, idx) => idx===i ? (totalBaseCost*(((ie.rates||[])[i]||0)/100))*ratio : 0), level: 2 }));
          factors.push({ label: '제조 감가상각비', values: pad6([0]).map((_, idx) => idx===i ? depreciation*ratio : 0), level: 2 });

          if (i === 0) {
              revTreeGlobal = cloneDeep(revTree); intVolTreeGlobal = cloneDeep(intVolTree); extCogsTreeGlobal = cloneDeep(extCogsTree); intCogsFactorTreeGlobal = factors;
          } else {
              mergeTree(revTreeGlobal, revTree); mergeTree(intVolTreeGlobal, intVolTree); mergeTree(extCogsTreeGlobal, extCogsTree);
              factors.forEach((f, fIdx) => { if(intCogsFactorTreeGlobal[fIdx]) intCogsFactorTreeGlobal[fIdx].values[i] = f.values[i]; });
          }

          const unsoldVol = Math.max(0, actualProdVol - totalInternalSalesVol);
          const unsoldInvValue = unsoldVol * unitMfgCost;

          let unsoldExtInvValue = 0;
          const calcExtInv = (nodes, currentExRate=1) => {
              (nodes||[]).forEach(n => {
                  const exRate = n.brands ? ((n.name && (n.name.includes('한국')||n.name.includes('대한민국')||n.name.includes('korea'))) ? 1 : ((inputs.exchangeRate||[])[i]||1)) : currentExRate;
                  if (n.products) {
                      (n.products||[]).forEach(p => {
                          if (p.isInternal === false) {
                              let sVol = (p.volumes||[])[i]||0;
                              let pVol = (p.purchaseVolumes||[])[i]||0;
                              
                              for(let y=1; y<=i; y++) {
                                  const g = 1 + (((inputs.industryGrowth||[])[y]||0)/100);
                                  sVol *= g; pVol *= g;
                              }
                              const sc = ((p.supplyCosts||[])[i]||0) * exRate;
                              unsoldExtInvValue += Math.max(0, pVol - sVol) * sc;
                          }
                      });
                  } else if (n.categories) { calcExtInv(n.categories, exRate); }
                    else if (n.clients) { calcExtInv(n.clients, exRate); }
                    else if (n.channels) { calcExtInv(n.channels, exRate); }
                    else if (n.salesModes) { calcExtInv(n.salesModes, exRate); }
                    else if (n.bizTypes) { calcExtInv(n.bizTypes, exRate); }
                    else if (n.brands) { calcExtInv(n.brands, exRate); }
                    else if (n.countries) { calcExtInv(n.countries, exRate); }
              });
          };
          calcExtInv(inputs.salesHierarchy);

          let totalLabor = 0;
          [inputs.sgaVarList, inputs.sgaSemiList, inputs.sgaFixList].forEach(list => {
              (list||[]).forEach(it => {
                  if(it.name.includes('인건비') || it.name.includes('급여')) {
                      const type = it.calcType || (it.isRate ? 'rate' : 'amount');
                      if (type === 'rate') totalLabor += revenue * (((it.rates||[])[i]||0)/100);
                      else totalLabor += toMil((it.amounts||[])[i]) * infMultArr[i];
                  }
              });
          });
          res.totalLaborArr.push(totalLabor);

          const calcSgaItem = (it) => {
              const type = it.calcType || (it.isRate ? 'rate' : 'amount');
              if (type === 'rate') return revenue * (((it.rates||[])[i]||0)/100);
              if (type === 'labor_rate') return totalLabor * (((it.rates||[])[i]||0)/100);
              return toMil((it.amounts||[])[i]) * infMultArr[i];
          };

          let totalSgaVar = 0, totalSgaSemi = 0, totalSgaFixOnly = 0, fixBadDebt = 0;
          
          (inputs.sgaVarList||[]).forEach(it => totalSgaVar += calcSgaItem(it));
          (inputs.sgaSemiList||[]).forEach(it => totalSgaSemi += calcSgaItem(it));
          (inputs.sgaFixList||[]).forEach(it => {
              const val = calcSgaItem(it);
              totalSgaFixOnly += val;
              if (it.name.includes('대손')) { fixBadDebt += val; accumBadDebt += val; }
          });

          res.varMfgRatioArr = res.varMfgRatioArr || [];
          res.varMfgRatioArr.push(totalMfgCost > 0 ? (totalBaseCost + totalDirExp) / totalMfgCost : 0);
          
          res.varSgaRateArr = res.varSgaRateArr || [];
          res.varSgaRateArr.push(revenue > 0 ? totalSgaVar / revenue : 0);

          const cogs = internalCogs + externalCogs;
          const grossProfit = revenue - cogs;
          const totalSga = totalSgaVar + totalSgaSemi + totalSgaFixOnly + amortization;
          const operatingProfit = grossProfit - totalSga;

          const interestExpense = accumDebt * (((inputs.interestRate||[])[i]||0) / 100);
          const totalNonOpIncC = sumMil(inputs.nonOpIncCashList, i);
          const totalNonOpIncNC = sumMil(inputs.nonOpIncNonCashList, i);
          const totalNonOpExpC = sumMil(inputs.nonOpExpCashList, i);
          const totalNonOpExpNC = sumMil(inputs.nonOpExpNonCashList, i);

          const totalNonOpInc = totalNonOpIncC + totalNonOpIncNC;
          const totalNonOpExp = interestExpense + totalNonOpExpC + totalNonOpExpNC;
          const ebt = operatingProfit + totalNonOpInc - totalNonOpExp;
          const tax = Math.max(0, ebt * (((inputs.taxRate||[])[i]||0) / 100));
          const netIncome = ebt - tax;

          accumOtherNonCash += (totalNonOpIncNC - totalNonOpExpNC);

          const arGross = revenue * (((inputs.arDays||[])[i]||0) / 365);
          const deltaArGross = -(arGross - prevArGross); prevArGross = arGross;

          const invBase = cogs * (((inputs.invDays||[])[i]||0) / 365);
          const inv = invBase + unsoldInvValue + unsoldExtInvValue;
          const ap = cogs * (((inputs.apDays||[])[i]||0) / 365); 
          
          let ppeNet = totalCapex.slice(0, i+1).reduce((a,b)=>a+b,0);
          let intangibleNet = totalIntangible.slice(0, i+1).reduce((a,b)=>a+b,0);
          (inputs.capexList||[]).forEach(it => (it.amounts||[]).forEach((a, j) => { if(a && i >= j) ppeNet -= (toMil(a)/(it.usefulLife||5)) * (Math.min(i, j+(it.usefulLife||5)-1) - j + 1); }));
          (inputs.intangibleList||[]).forEach(it => (it.amounts||[]).forEach((a, j) => { if(a && i >= j) intangibleNet -= (toMil(a)/(it.usefulLife||5)) * (Math.min(i, j+(it.usefulLife||5)-1) - j + 1); }));

          const deltaWc = deltaArGross - (inv - prevInvValue) + (ap - (i>0?res.bs[i-1].bsDetails.ap:0)) + flowAdvances + flowAccrued - flowPrepaid - flowReceivable;
          const nonCashExpAdd = depreciation + amortization + fixBadDebt + totalNonOpExpNC;
          const operatingCf = netIncome + nonCashExpAdd - totalNonOpIncNC + deltaWc;
          const netCf = operatingCf - totalCapex[i] - totalIntangible[i] + totalEquity[i] + totalDebt[i]; 
          const endingCash = prevCash + netCf;

          res.is_financial.push({
            revenue, cogs, grossProfit, totalSga, operatingProfit, totalNonOpInc, totalNonOpExp, interestExpense, nonOpIncC: totalNonOpIncC, nonOpIncNC: totalNonOpIncNC, nonOpExpC: totalNonOpExpC, nonOpExpNC: totalNonOpExpNC, tax, netIncome, internalCogs, externalCogs,
            sgaDetails: { totalSgaVar, totalSgaSemi, totalSgaFixOnly, amortization, fixBadDebt },
            ratios: { cogsRatio: revenue>0?cogs/revenue:0, grossMargin: revenue>0?grossProfit/revenue:0, sgaRatio: revenue>0?totalSga/revenue:0, opMargin: revenue>0?operatingProfit/revenue:0, netMargin: revenue>0?netIncome/revenue:0 }
          });

          const variableCosts = (totalBaseCost + totalDirExp)*ratio + externalCogs + totalSgaVar;
          const contributionMargin = revenue - variableCosts;
          const fixedCosts = totalIndExp*ratio + depreciation*ratio + totalSgaSemi + totalSgaFixOnly + amortization;
          
          res.is_managerial.push({
            actualProdVol, revenue, variableCosts, contributionMargin, fixedCosts, operatingProfit: contributionMargin-fixedCosts, bepRevenue: contributionMargin>0?(fixedCosts*revenue)/contributionMargin:0,
            varCostDetails: { totalSgaVar },
            ratios: { varRatio: revenue>0?variableCosts/revenue:0, cmRatio: revenue>0?contributionMargin/revenue:0, fixedRatio: revenue>0?fixedCosts/revenue:0 }
          });

          res.bs.push({
            currentAssets: endingCash + Math.max(0, arGross-accumBadDebt) + inv + balPrepaid + balReceivable,
            nonCurrentAssets: ppeNet + intangibleNet + accumOtherNonCash,
            totalAssets: endingCash + Math.max(0, arGross-accumBadDebt) + inv + balPrepaid + balReceivable + ppeNet + intangibleNet + accumOtherNonCash,
            currentLiabilities: ap + balAdvances + balAccrued,
            nonCurrentLiabilities: accumDebt,
            totalLiabilities: ap + balAdvances + balAccrued + accumDebt,
            totalEquity: accumCapital + prevRetainedEarnings + netIncome,
            bsDetails: { cash: endingCash, ar: Math.max(0, arGross-accumBadDebt), inv, invBase, unsoldInvValue, unsoldExtInvValue, prepaidNet: balPrepaid, receivableNet: balReceivable, ppeNet, intangibleNet, otherNetAssets: accumOtherNonCash, ap, advancesNet: balAdvances, accruedNet: balAccrued, debt: accumDebt, capital: accumCapital, retainedEarnings: prevRetainedEarnings + netIncome }
          });

          res.cf.push({
            beginningCash: prevCash, operatingCf, investingCf: -totalCapex[i] - totalIntangible[i], financingCf: totalEquity[i] + totalDebt[i], netCf, endingCash, nonCashExpAdd, nonCashIncDed: totalNonOpIncNC, deltaWc,
            cfDetails: { netIncome, depreciation, amortization, badDebtExp: fixBadDebt, nonOpExpNonCash: totalNonOpExpNC, nonOpIncNonCash: totalNonOpIncNC, deltaArGross, deltaInv: -(inv - prevInvValue), deltaAp: (ap - (i>0?res.bs[i-1].bsDetails.ap:0)), advancesInflow: flowAdvances, accruedInflow: flowAccrued, prepaidOutflow: -flowPrepaid, receivableOutflow: -flowReceivable, capex: -totalCapex[i], intangibleCapex: -totalIntangible[i], equity: totalEquity[i], debt: totalDebt[i] }
          });

          const nopat = operatingProfit * (1 - (((inputs.taxRate||[])[i]||0)/100));
          const terminalValue = i === 5 ? Math.max(0, arGross-accumBadDebt) + inv - ap + ppeNet + intangibleNet + balPrepaid + balReceivable - balAdvances - balAccrued + accumOtherNonCash : 0;
          const fcff = nopat + depreciation + amortization + terminalValue - totalCapex[i] - totalIntangible[i] + deltaWc;
          
          res.fcffData.push({ nopat, depreciation, amortization, terminalValue, capex: totalCapex[i], intangibleCapex: totalIntangible[i], deltaWc: deltaWc, fcff, pvFcff: fcff / Math.pow(1 + wacc, i) });
          
          prevCash = endingCash; prevInvValue = inv; prevRetainedEarnings += netIncome;
        }

        const fcffArray = res.fcffData.map(d=>d.fcff);
        res.npv = fcffArray.reduce((acc, cf, idx) => acc + (cf / Math.pow(1 + wacc, idx)), 0);
        res.irr = calculateIRR(fcffArray);

        let cumFcff = 0;
        fcffArray.forEach((cf, idx) => {
          const prevCum = cumFcff; cumFcff += cf;
          if (res.paybackPeriod === null && cumFcff >= 0) res.paybackPeriod = idx === 0 ? 0 : (idx - 1) + Math.abs(prevCum) / cf;
        });

        res.revenueDetails = revTreeGlobal;
        res.internalCogsDetails = intVolTreeGlobal;
        res.externalCogsDetails = extCogsTreeGlobal;
        res.internalCogsFactorTree = intCogsFactorTreeGlobal;

        const buildCostRatioTree = (costNodes, revNodes) => {
            costNodes.forEach(c => {
                const r = revNodes.find(x => x.id === c.id);
                if (r && r.values) {
                    c.ratios = c.values.map((v, i) => r.values[i] > 0 ? v / r.values[i] : 0);
                    if (c.sub && r.sub) buildCostRatioTree(c.sub, r.sub);
                }
            });
        };
        buildCostRatioTree(res.internalCogsDetails, res.revenueDetails);
        buildCostRatioTree(res.externalCogsDetails, res.revenueDetails);

        const buildCmTree = (revNodes, intCogsNodes, extCogsNodes) => {
            return revNodes.map(r => {
                const iNode = intCogsNodes?.find(x => x.id === r.id);
                const eNode = extCogsNodes?.find(x => x.id === r.id);
                const cmValues = [0,1,2,3,4,5].map(y => {
                    const rev = r.values[y] || 0;
                    const intCogs = iNode?.values?.[y] || 0;
                    const extCogs = eNode?.values?.[y] || 0;
                    const varSga = rev * res.varSgaRateArr[y];
                    const intVarCogs = intCogs * res.varMfgRatioArr[y];
                    const totalVar = intVarCogs + extCogs + varSga;
                    return rev - totalVar;
                });
                const cmRatios = [0,1,2,3,4,5].map(y => r.values[y] > 0 ? cmValues[y] / r.values[y] : 0);
                
                let sub = [];
                if (r.sub) {
                    sub = buildCmTree(r.sub, iNode?.sub||[], eNode?.sub||[]);
                }
                return { id: r.id, label: r.label, isGroup: r.isGroup, level: r.level, values: cmValues, ratios: cmRatios, sub };
            });
        };
        res.cmAnalysisTree = buildCmTree(res.revenueDetails, res.internalCogsDetails, res.externalCogsDetails);

        return res;
      }, [inputs]);

                    </div>

                    </div>

                              { label: '무형자산 (순액)', values: getB('bsDetails', 'intangibleNet'), level: 1 },

                          <ExpandableRow label="자산 총계" values={getB('totalAssets')} isHeader />
                        </tbody>
                      </table>

                    <div className="border border-slate-200 rounded-sm shadow-sm overflow-hidden">

                        <TableHead />
                        <tbody className="divide-y divide-slate-100">
                          <ExpandableRow label="I. 유동부채" values={getB('currentLiabilities')} isBold details={[
                              { label: '매입채무', values: getB('bsDetails', 'ap'), level: 1 },

                      <tbody className="divide-y divide-slate-200">
                        <ExpandableRow label="I. 영업활동 현금흐름" values={getC('operatingCf')} isBold details={[
                            { label: '당기순이익', values: getC('cfDetails', 'netIncome'), level: 1 },

                                { label: '매출채권 감소(증가)', values: getC('cfDetails', 'deltaArGross'), level: 2 },
                                { label: '재고자산 감소(증가)', values: getC('cfDetails', 'deltaInv'), level: 2 },

                                { label: '선수금 등 증가(감소)', values: getC('cfDetails', 'advancesInflow'), level: 2 },
                                { label: '미지급금 등 증가(감소)', values: getC('cfDetails', 'accruedInflow'), level: 2 }

                        <ExpandableRow label="II. 투자활동 현금흐름" values={getC('investingCf')} isBold details={[

                            { label: '자기자본 유입 (증자)', values: getC('cfDetails', 'equity'), level: 1 },
                            { label: '타인자본 유입 (차입)', values: getC('cfDetails', 'debt'), level: 1 }
                          ]} />
                        <ExpandableRow label="현금의 증감 (I + II + III)" values={getC('netCf')} isTotal />

                        <ExpandableRow label="기말 현금" values={getC('endingCash')} isHeader />
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
