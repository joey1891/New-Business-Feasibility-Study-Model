    const calculateIRR = (rawCashFlows) => {
      const cashFlows = rawCashFlows.map(v => v / 1000000);
      
      if (cashFlows.every(v => v <= 0)) return -1.0; 
      const hasNegative = cashFlows.some(v => v < 0);
      if (!hasNegative) return Infinity;

      let low = -0.99999;
      let high = 100000; 
      let guess = 0;

      for (let i = 0; i < 200; i++) {
        guess = (low + high) / 2;
        let npv = 0;
        for (let t = 0; t < cashFlows.length; t++) {
          npv += cashFlows[t] / Math.pow(1 + guess, t);
        }

        if (Math.abs(npv) < 0.0001) break;

        if (npv > 0) low = guess;
        else high = guess;
      }
      
      return guess >= 99900 ? Infinity : guess;
    };

        }
      };

          value={localVal} 
          onChange={handleChange} 
          onFocus={() => setIsEditing(true)}
          onBlur={commitValue}

                            <div className="flex items-center gap-3 shrink-0 ml-auto">

                                  <input type="checkbox" checked={product.isForeignCurrency === true} onChange={(e) => handlers.updateField(pathIds, product.id, 'isForeignCurrency', null, e.target.checked)} className="accent-blue-600" /> 외화(USD)

                                  <input type="checkbox" checked={product.isInternal !== false} onChange={(e) => handlers.updateField(pathIds, product.id, 'isInternal', null, e.target.checked)} className="accent-red-700" /> 자체생산
                               </label>
                               <button onClick={() => handlers.rmProduct(pathIds, product.id)} className="text-slate-400 hover:text-red-700 font-black px-1 text-lg">&times;</button>
                            </div>
                         </div>
                         
                         <div className="flex flex-col gap-3 px-3 w-full">
                             <div className="w-full bg-white p-2.5 rounded border border-slate-300 shadow-sm">
                                 <div className="text-[11px] font-bold text-slate-700 mb-2">단가 (Price - {product.isForeignCurrency ? 'USD' : '원'})</div>
                                 <div className="grid grid-cols-6 gap-1">
                                    {pad6(product.prices).map((p, idx) => (

                                          <span className="text-[9px] text-slate-400 font-bold text-center mb-0.5">Y{idx}</span>

                                          <NumInput value={v} onChange={(val) => handlers.updateField(pathIds, product.id, 'volumes', idx, val)} className="text-[11px] font-semibold" />

                                    ))}
                                 </div>
                             </div>
                             {product.isInternal === false && (
                                 <div className="w-full bg-orange-50 p-2.5 rounded border border-orange-300 shadow-sm">

                                     <div className="grid grid-cols-6 gap-1">
                                        {pad6(product.supplyCosts||[]).map((sc, idx) => (

                                              <NumInput value={sc} onChange={(v) => handlers.updateField(pathIds, product.id, 'supplyCosts', idx, v)} className="text-[11px] font-semibold border-orange-300 focus:border-orange-500 bg-white text-orange-900" />

    function App() {
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [authLoading, setAuthLoading] = useState(true);
      const [authError, setAuthError] = useState('');
      const [signUpMessage, setSignUpMessage] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [rememberId, setRememberId] = useState(false);
      const [activeTab, setActiveTab] = useState('ir_data');
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [inputs, setInputs] = useState(DEFAULT_INPUTS);
      const [projects, setProjects] = useState([]);
      const [projectName, setProjectName] = useState('새 프로젝트');
      const [currentProjectId, setCurrentProjectId] = useState(null);
      const [saveStatus, setSaveStatus] = useState('');
      const [isPublicProject, setIsPublicProject] = useState(false);
      const [autoSaveEnabled, setAutoSaveEnabled] = useState(false);
      const [zoomedImg, setZoomedImg] = useState(null);
      const [appMessage, setAppMessage] = useState(null);
      const [pendingPasteImage, setPendingPasteImage] = useState(null);
      const [uploadingPpt, setUploadingPpt] = useState(false); // New state for PPT upload progress

      const checkApprovalAndSetUser = async (sessionUser) => {
        if (!sessionUser) {
          setUser(null); setAuthLoading(false); return;
        }
        try {
          const { data, error } = await supabaseClient.from('user_profiles').select('is_approved').eq('id', sessionUser.id);
          const userEmail = sessionUser.email.toLowerCase();
          const isSuperAdmin = userEmail === 'ceo@hyminternational.com';
          let isApproved = false;
          let isAdminCheck = isSuperAdmin || userEmail.includes('admin');

          if (error) console.warn("DB 프로필 조회 실패:", error.message);
          else if (data && data.length > 0) isApproved = data[0].is_approved === true;
          if (isSuperAdmin) { isApproved = true; isAdminCheck = true; }

          if (isApproved || isAdminCheck) {
            setUser(sessionUser); setIsAdmin(isAdminCheck); setIsSidebarOpen(isAdminCheck); setAuthError('');
          } else {
            await supabaseClient.auth.signOut(); setUser(null); setAuthError('⏳ 관리자 승인 대기 중입니다.');
          }
        } catch (e) { 
          const userEmail = sessionUser.email?.toLowerCase() || '';
          const isAdminCheck = userEmail === 'ceo@hyminternational.com' || userEmail.includes('admin');
          setUser(sessionUser); setIsAdmin(isAdminCheck); setIsSidebarOpen(isAdminCheck); setAuthError('');
        }
        setAuthLoading(false);
      };

      useEffect(() => {
        supabaseClient.auth.getSession().then(({ data }) => checkApprovalAndSetUser(data?.session?.user));
        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((event, session) => {
          if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') checkApprovalAndSetUser(session?.user);
          else if (event === 'SIGNED_OUT') setUser(null);
        });
        const savedEmail = localStorage.getItem('feasibility_saved_email');
        if(savedEmail) { setEmail(savedEmail); setRememberId(true); }
        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const fetchProjects = async () => {
          let { data, error } = await supabaseClient.from('feasibility_projects')
             .select('id, name, updated_at, inputs, is_public, user_id')
             .order('updated_at', { ascending: false });

          if (error) {
             const fallback = await supabaseClient.from('feasibility_projects')
                .select('id, name, updated_at, inputs')
                .order('updated_at', { ascending: false });
             data = fallback.data;
          }

          if (data) {
             if (!isAdmin) {
                data = data.filter(p => p.is_public === true || p.user_id === user.id);
             }
             setProjects(data);
          }
        };
        fetchProjects();
      }, [user, isAdmin]);

      const handleLogin = async (e) => {
        e.preventDefault(); setAuthError(''); setSignUpMessage(''); setAuthLoading(true);
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) setAuthError(`❌ 로그인 실패: ${error.message === 'Invalid login credentials' ? '정보 불일치' : error.message}`);
        else if(rememberId) localStorage.setItem('feasibility_saved_email', email);
        else localStorage.removeItem('feasibility_saved_email');
        setAuthLoading(false);
      };

      const handleSignUp = async (e) => {
        e.preventDefault(); setAuthError(''); setSignUpMessage('');
        if(password.length < 6) return setAuthError('비밀번호는 6자리 이상이어야 합니다.');
        setAuthLoading(true);
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) setAuthError(`❌ 가입 실패: ${error.message}`);
        else if (data?.user) { await supabaseClient.auth.signOut(); setSignUpMessage('✅ 가입 완료! 관리자 승인 후 로그인 가능합니다.'); }
        setAuthLoading(false);
      };

      const handleLogout = async () => { await supabaseClient.auth.signOut(); setUser(null); };

      const handleSave = async () => {
        if (!user) return; setSaveStatus('저장 중...');
        try {
          const basePayload = { name: projectName, inputs, updated_at: new Date().toISOString() };
          let savedId = currentProjectId;

          if (currentProjectId) {
            const { error } = await supabaseClient.from('feasibility_projects').update({ ...basePayload, is_public: isPublicProject }).eq('id', currentProjectId);
            if(error) await supabaseClient.from('feasibility_projects').update(basePayload).eq('id', currentProjectId);
          } else {
            const { data, error } = await supabaseClient.from('feasibility_projects').insert([{ ...basePayload, is_public: isPublicProject, user_id: user.id }]).select();
            if (error) {
               const fallback = await supabaseClient.from('feasibility_projects').insert([{ ...basePayload }]).select();
               if(fallback.data && fallback.data.length > 0) savedId = fallback.data[0].id;
            } else if (data && data.length > 0) {
               savedId = data[0].id;
            }
            if(savedId) setCurrentProjectId(savedId);
          }
          
          setSaveStatus('✅ 저장 완료');
          let { data, error } = await supabaseClient.from('feasibility_projects').select('id, name, updated_at, inputs, is_public, user_id').order('updated_at', { ascending: false });
          if(error) {
             const fb = await supabaseClient.from('feasibility_projects').select('id, name, updated_at, inputs').order('updated_at', { ascending: false });
             data = fb.data;
          }
          if(data) setProjects(isAdmin ? data : data.filter(p => p.is_public === true || p.user_id === user.id));
          setTimeout(() => setSaveStatus(''), 3000);
        } catch (e) { setSaveStatus('❌ 권한 오류'); }
      };

      const handleDelete = async () => {
        if (!currentProjectId || !isAdmin) return;
        try {
          await supabaseClient.from('feasibility_projects').delete().eq('id', currentProjectId);
          setInputs(DEFAULT_INPUTS); setProjectName('새 프로젝트'); setCurrentProjectId(null); setIsPublicProject(false); setAutoSaveEnabled(false);
          let { data, error } = await supabaseClient.from('feasibility_projects').select('id, name, updated_at, inputs, is_public, user_id').order('updated_at', { ascending: false });
          if(error) {
             const fb = await supabaseClient.from('feasibility_projects').select('id, name, updated_at, inputs').order('updated_at', { ascending: false });
             data = fb.data;
          }
          if(data) setProjects(isAdmin ? data : data.filter(p => p.is_public === true || p.user_id === user.id));
        } catch (e) { setAppMessage({ type: 'alert', text: '삭제 권한이 없습니다.' }); }
      };

      const handleLoad = (id) => {
        const proj = projects.find(p => p.id == id);
        if (proj) {
          try {
            let loaded = cloneDeep(proj.inputs);
            
            if (loaded.laborFix && !proj.inputs.sgaFixList) {
                loaded.sgaVarList = [

          try {

              const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

                      upsert: false

        } else {
          setInputs(prev => ({ ...prev, [targetField]: pendingPasteImage }));
        }
        setPendingPasteImage(null);
      };

      const handleZoomNav = (direction) => {
          setZoomedImg(prev => {
              if (!prev || !prev.images || prev.images.length <= 1) return prev;
              let nextIndex = prev.index + direction;
              if (nextIndex < 0) nextIndex = prev.images.length - 1;
              if (nextIndex >= prev.images.length) nextIndex = 0;
              return { ...prev, index: nextIndex };
          });
      };

      useEffect(() => {
          const handleKeyDown = (e) => {
              if (!zoomedImg) return;
              if (e.key === 'Escape') { setZoomedImg(null); return; }
              
              if (!zoomedImg.images || zoomedImg.images.length <= 1) return;
              if (e.key === 'ArrowRight' || e.key === 'ArrowDown') handleZoomNav(1);
              else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') handleZoomNav(-1);
          };
          
          if (zoomedImg) window.addEventListener('keydown', handleKeyDown);
          return () => window.removeEventListener('keydown', handleKeyDown);
      }, [zoomedImg]);

      const model = useMemo(() => {
        const infRate = pad6(inputs.inflationRate || [2.5]);
        const infMultArr = [1];
        for(let i=1; i<6; i++) infMultArr[i] = infMultArr[i-1] * (1 + (infRate[i]/100));

        const sumMil = (list, i) => (list||[]).reduce((s, it) => s + toMil((it.amounts||[])[i]), 0);
        const totalEquity = [0,1,2,3,4,5].map(i => sumMil(inputs.equityList, i));
        const totalDebt = [0,1,2,3,4,5].map(i => sumMil(inputs.debtList, i));
        const totalCapex = [0,1,2,3,4,5].map(i => sumMil(inputs.capexList, i));
        const totalIntangible = [0,1,2,3,4,5].map(i => sumMil(inputs.intangibleList, i));

        const initV = totalEquity[0] + totalDebt[0];
        const wE = initV > 0 ? totalEquity[0]/initV : 0;
        const wD = initV > 0 ? totalDebt[0]/initV : 0;
        const wacc = initV > 0 ? (wE * ((inputs.costOfEquity[0]||0)/100)) + (wD * ((inputs.interestRate[0]||0)/100) * (1 - (inputs.taxRate[0]||0)/100)) : ((inputs.costOfEquity[0]||0)/100);

        let res = { is_financial: [], is_managerial: [], bs: [], cf: [], fcffData: [], npv: 0, irr: 0, paybackPeriod: null, wacc, wE, wD, infMultArr, totalBaseCostArr: [], totalLaborArr: [] };
        
        let revTreeGlobal=[], intVolTreeGlobal=[], extCogsTreeGlobal=[], intCogsFactorTreeGlobal=[];
        let prevCash=0, accumDebt=0, accumCapital=0, accumBadDebt=0, accumOtherNonCash=0, prevArGross=0, prevInvValue=0, prevRetainedEarnings=0;

        let prevWcBal = { advances: 0, accrued: 0, prepaid: 0, receivable: 0 };

        for (let i = 0; i < 6; i++) {
          accumCapital += totalEquity[i]; accumDebt += totalDebt[i];

          const capa = (inputs.capexMaxCapa||[])[i]||0;
          const util = (inputs.utilization||[])[i]||0;
          const loss = (inputs.lossRate||[])[i]||0;
          const actualProdVol = capa * (util / 100) * (1 - loss / 100);

          const buildLevel = (nodes, type) => {
              let levelSum=0, levelSub=[];
              (nodes||[]).forEach(n => {
                  if (n.products) { 
                     let catSum=0, catSub=[];
                     (n.products||[]).forEach(p => {
                         let vol = (p.volumes||[])[i]||0;
                         for(let y=1; y<=i; y++) vol *= (1 + (((inputs.industryGrowth||[])[y]||0)/100));
                         
                         const currentExRate = p.isForeignCurrency ? ((inputs.exchangeRate||[])[i]||1) : 1;
                         
                         if (type === 'rev') {
                             const sales = ((p.prices||[])[i]||0) * currentExRate * vol;
                             catSum += sales; catSub.push({ id: p.id, label: p.name||'품목', values: pad6([0]).map((_,idx)=>idx===i?sales:0), level: 9 });
                         } else if (type === 'intCogsVol' && p.isInternal !== false) {
                             catSum += vol; catSub.push({ id: p.id, label: p.name||'품목', vol, level: 9 });
                         } else if (type === 'extCogs' && p.isInternal === false) {
                             const ecogs = ((p.supplyCosts||[])[i]||0) * currentExRate * vol;
                             catSum += ecogs; catSub.push({ id: p.id, label: p.name||'품목', values: pad6([0]).map((_,idx)=>idx===i?ecogs:0), level: 9 });
                         }
                     });
                     levelSum += catSum; if(catSum>0 || i===0) levelSub.push({ id: n.id, label: n.name||'품목군', values: pad6([0]).map((_,idx)=>idx===i?catSum:0), isGroup:true, level:8, sub: catSub });
                  } else if (n.categories) { const { sum, sub } = buildLevel(n.categories, type); levelSum += sum; if(sum>0 || i===0) levelSub.push({ id: n.id, label: n.name||'거래처', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:7, sub });
                  } else if (n.clients) { const { sum, sub } = buildLevel(n.clients, type); levelSum += sum; if(sum>0 || i===0) levelSub.push({ id: n.id, label: n.name||'채널', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:6, sub });
                  } else if (n.channels) { const { sum, sub } = buildLevel(n.channels, type); levelSum += sum; if(sum>0 || i===0) levelSub.push({ id: n.id, label: n.name||'판매형태', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:5, sub });
                  } else if (n.salesModes) { const { sum, sub } = buildLevel(n.salesModes, type); levelSum += sum; if(sum>0 || i===0) levelSub.push({ id: n.id, label: n.name||'사업영역', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:4, sub });
                  } else if (n.bizTypes) { const { sum, sub } = buildLevel(n.bizTypes, type); levelSum += sum; if(sum>0 || i===0) levelSub.push({ id: n.id, label: n.name||'브랜드', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:3, sub });
                  } else if (n.brands) { const { sum, sub } = buildLevel(n.brands, type); levelSum += sum; if(sum>0 || i===0) levelSub.push({ id: n.id, label: n.name||'국가', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:2, sub });
                  } else if (n.countries) { const { sum, sub } = buildLevel(n.countries, type); levelSum += sum; if(sum>0 || i===0) levelSub.push({ id: n.id, label: n.name||'수익모델', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:1, sub });
                  }
              }); return { sum: levelSum, sub: levelSub };
          };

          const { sum: revenue, sub: revTree } = buildLevel(inputs.salesHierarchy, 'rev');
          const { sum: totalInternalSalesVol, sub: intVolTree } = buildLevel(inputs.salesHierarchy, 'intCogsVol');
          const { sum: externalCogs, sub: extCogsTree } = buildLevel(inputs.salesHierarchy, 'extCogs');

          const calcMixedWcBal = (list) => (list||[]).reduce((s, it) => {
              const type = it.calcType || (it.isRate ? 'rate' : 'amount');
              if (type === 'rate') return s + revenue * (((it.rates||[])[i]||0)/100);
              return s + toMil((it.amounts||[])[i]) * infMultArr[i];
          }, 0);

          const balAdvances = calcMixedWcBal(inputs.advancesList);
          const balAccrued = calcMixedWcBal(inputs.accruedList);
          const balPrepaid = calcMixedWcBal(inputs.prepaidList);
          const balReceivable = calcMixedWcBal(inputs.receivableList);

          const flowAdvances = balAdvances - prevWcBal.advances;
          const flowAccrued = balAccrued - prevWcBal.accrued;
          const flowPrepaid = balPrepaid - prevWcBal.prepaid;
          const flowReceivable = balReceivable - prevWcBal.receivable;
          prevWcBal = { advances: balAdvances, accrued: balAccrued, prepaid: balPrepaid, receivable: balReceivable };

          const totalBaseCost = (inputs.baseCostList||[]).reduce((s, bc) => s + toMil((bc.amounts||[])[i])*infMultArr[i], 0);
          res.totalBaseCostArr.push(totalBaseCost);
          const totalDirExp = (inputs.directExpList||[]).reduce((s, de) => s + totalBaseCost*(((de.rates||[])[i]||0)/100), 0);
          const totalIndExp = (inputs.indirectExpList||[]).reduce((s, ie) => s + totalBaseCost*(((ie.rates||[])[i]||0)/100), 0);

          let depreciation=0, amortization=0;
          (inputs.capexList||[]).forEach(it => (it.amounts||[]).forEach((a, j) => { if(a && i >= j && i <= j+(it.usefulLife||5)-1) depreciation += toMil(a)/(it.usefulLife||5); }));
          (inputs.intangibleList||[]).forEach(it => (it.amounts||[]).forEach((a, j) => { if(a && i >= j && i <= j+(it.usefulLife||5)-1) amortization += toMil(a)/(it.usefulLife||5); }));

          const totalMfgCost = totalBaseCost + totalDirExp + totalIndExp + depreciation;
          const unitMfgCost = actualProdVol > 0 ? totalMfgCost / actualProdVol : 0;
          const internalCogs = totalInternalSalesVol * unitMfgCost;
          
          const convertVolToCogs = (nodes) => {
              nodes.forEach(n => {
                 if (n.vol !== undefined) { const cogs = n.vol * unitMfgCost; n.values = pad6([0]).map((_,idx)=>idx===i?cogs:0); delete n.vol; }
                 else if (n.sub) { convertVolToCogs(n.sub); n.values[i] = n.sub.reduce((s, c) => s + c.values[i], 0); }
              });
          };
          convertVolToCogs(intVolTree);

          const mergeTree = (target, source) => {
              source.forEach((sNode) => {
                  const tNode = target.find(t => t.id === sNode.id);
                  if (tNode) { 
                      tNode.values[i] = sNode.values[i]; 
                      if (sNode.sub) {
                          if (!tNode.sub) tNode.sub = [];
                          mergeTree(tNode.sub, sNode.sub); 
                      }
                  } else {
                      target.push(JSON.parse(JSON.stringify(sNode)));
                  }
              });
          };

          const ratio = actualProdVol > 0 ? totalInternalSalesVol / actualProdVol : 0;
          let factors = [];
          (inputs.baseCostList||[]).forEach(bc => factors.push({ label: bc.name, values: pad6([0]).map((_, idx) => idx===i ? (toMil((bc.amounts||[])[i])*infMultArr[i])*ratio : 0), level: 2 }));
          (inputs.directExpList||[]).forEach(de => factors.push({ label: de.name, values: pad6([0]).map((_, idx) => idx===i ? (totalBaseCost*(((de.rates||[])[i]||0)/100))*ratio : 0), level: 2 }));
          (inputs.indirectExpList||[]).forEach(ie => factors.push({ label: ie.name, values: pad6([0]).map((_, idx) => idx===i ? (totalBaseCost*(((ie.rates||[])[i]||0)/100))*ratio : 0), level: 2 }));
          factors.push({ label: '제조 감가상각비', values: pad6([0]).map((_, idx) => idx===i ? depreciation*ratio : 0), level: 2 });

          if (i === 0) {
              revTreeGlobal = cloneDeep(revTree); intVolTreeGlobal = cloneDeep(intVolTree); extCogsTreeGlobal = cloneDeep(extCogsTree); intCogsFactorTreeGlobal = factors;
          } else {
              mergeTree(revTreeGlobal, revTree); mergeTree(intVolTreeGlobal, intVolTree); mergeTree(extCogsTreeGlobal, extCogsTree);
              factors.forEach((f, fIdx) => { if(intCogsFactorTreeGlobal[fIdx]) intCogsFactorTreeGlobal[fIdx].values[i] = f.values[i]; });
          }

          const unsoldVol = Math.max(0, actualProdVol - totalInternalSalesVol);
          const unsoldInvValue = unsoldVol * unitMfgCost;

          let unsoldExtInvValue = 0;
          const calcExtInv = (nodes) => {
              (nodes||[]).forEach(n => {
                  if (n.products) {
                      (n.products||[]).forEach(p => {
                          if (p.isInternal === false) {
                              let sVol = (p.volumes||[])[i]||0;
                              let pVol = (p.purchaseVolumes||[])[i]||0;
                              
                              for(let y=1; y<=i; y++) {
                                  const g = 1 + (((inputs.industryGrowth||[])[y]||0)/100);
                                  sVol *= g; pVol *= g;
                              }
                              const currentExRate = p.isForeignCurrency ? ((inputs.exchangeRate||[])[i]||1) : 1;
                              const sc = ((p.supplyCosts||[])[i]||0) * currentExRate;
                              unsoldExtInvValue += Math.max(0, pVol - sVol) * sc;
                          }
                      });
                  } else if (n.categories) { calcExtInv(n.categories); }
                    else if (n.clients) { calcExtInv(n.clients); }
                    else if (n.channels) { calcExtInv(n.channels); }
                    else if (n.salesModes) { calcExtInv(n.salesModes); }
                    else if (n.bizTypes) { calcExtInv(n.bizTypes); }
                    else if (n.brands) { calcExtInv(n.brands); }
                    else if (n.countries) { calcExtInv(n.countries); }
              });
          };
          calcExtInv(inputs.salesHierarchy);

          let totalLabor = 0;
          [inputs.sgaVarList, inputs.sgaSemiList, inputs.sgaFixList].forEach(list => {
              (list||[]).forEach(it => {
                  if(it.name.includes('인건비') || it.name.includes('급여')) {
                      const type = it.calcType || (it.isRate ? 'rate' : 'amount');
                      if (type === 'rate') totalLabor += revenue * (((it.rates||[])[i]||0)/100);
                      else totalLabor += toMil((it.amounts||[])[i]) * infMultArr[i];
                  }
              });
          });
          res.totalLaborArr.push(totalLabor);

          const calcSgaItem = (it) => {
              const type = it.calcType || (it.isRate ? 'rate' : 'amount');
              if (type === 'rate') return revenue * (((it.rates||[])[i]||0)/100);
              if (type === 'labor_rate') return totalLabor * (((it.rates||[])[i]||0)/100);
              return toMil((it.amounts||[])[i]) * infMultArr[i];
          };

          let totalSgaVar = 0, totalSgaSemi = 0, totalSgaFixOnly = 0, fixBadDebt = 0;
          
          (inputs.sgaVarList||[]).forEach(it => totalSgaVar += calcSgaItem(it));
          (inputs.sgaSemiList||[]).forEach(it => totalSgaSemi += calcSgaItem(it));
          (inputs.sgaFixList||[]).forEach(it => {
              const val = calcSgaItem(it);
              totalSgaFixOnly += val;
              if (it.name.includes('대손')) { fixBadDebt += val; accumBadDebt += val; }
          });

          res.varMfgRatioArr = res.varMfgRatioArr || [];
          res.varMfgRatioArr.push(totalMfgCost > 0 ? (totalBaseCost + totalDirExp) / totalMfgCost : 0);
          
          res.varSgaRateArr = res.varSgaRateArr || [];
          res.varSgaRateArr.push(revenue > 0 ? totalSgaVar / revenue : 0);

          const cogs = internalCogs + externalCogs;
          const grossProfit = revenue - cogs;
          const totalSga = totalSgaVar + totalSgaSemi + totalSgaFixOnly + amortization;
          const operatingProfit = grossProfit - totalSga;

          const interestExpense = accumDebt * (((inputs.interestRate||[])[i]||0) / 100);
          const totalNonOpIncC = sumMil(inputs.nonOpIncCashList, i);
          const totalNonOpIncNC = sumMil(inputs.nonOpIncNonCashList, i);
          const totalNonOpExpC = sumMil(inputs.nonOpExpCashList, i);
          const totalNonOpExpNC = sumMil(inputs.nonOpExpNonCashList, i);

          const totalNonOpInc = totalNonOpIncC + totalNonOpIncNC;
          const totalNonOpExp = interestExpense + totalNonOpExpC + totalNonOpExpNC;
          const ebt = operatingProfit + totalNonOpInc - totalNonOpExp;
          const tax = Math.max(0, ebt * (((inputs.taxRate||[])[i]||0) / 100));
          const netIncome = ebt - tax;

          accumOtherNonCash += (totalNonOpIncNC - totalNonOpExpNC);

          const arGross = revenue * (((inputs.arDays||[])[i]||0) / 365);
          const deltaArGross = -(arGross - prevArGross); prevArGross = arGross;

          const invBase = cogs * (((inputs.invDays||[])[i]||0) / 365);
          const inv = invBase + unsoldInvValue + unsoldExtInvValue;
          const ap = cogs * (((inputs.apDays||[])[i]||0) / 365); 
          
          let ppeNet = totalCapex.slice(0, i+1).reduce((a,b)=>a+b,0);
          let intangibleNet = totalIntangible.slice(0, i+1).reduce((a,b)=>a+b,0);
          (inputs.capexList||[]).forEach(it => (it.amounts||[]).forEach((a, j) => { if(a && i >= j) ppeNet -= (toMil(a)/(it.usefulLife||5)) * (Math.min(i, j+(it.usefulLife||5)-1) - j + 1); }));
          (inputs.intangibleList||[]).forEach(it => (it.amounts||[]).forEach((a, j) => { if(a && i >= j) intangibleNet -= (toMil(a)/(it.usefulLife||5)) * (Math.min(i, j+(it.usefulLife||5)-1) - j + 1); }));

          const deltaWc = deltaArGross - (inv - prevInvValue) + (ap - (i>0?res.bs[i-1].bsDetails.ap:0)) + flowAdvances + flowAccrued - flowPrepaid - flowReceivable;
          const nonCashExpAdd = depreciation + amortization + fixBadDebt + totalNonOpExpNC;
          const operatingCf = netIncome + nonCashExpAdd - totalNonOpIncNC + deltaWc;
          const netCf = operatingCf - totalCapex[i] - totalIntangible[i] + totalEquity[i] + totalDebt[i]; 
          const endingCash = prevCash + netCf;

          res.is_financial.push({
            revenue, cogs, grossProfit, totalSga, operatingProfit, totalNonOpInc, totalNonOpExp, interestExpense, nonOpIncC: totalNonOpIncC, nonOpIncNC: totalNonOpIncNC, nonOpExpC: totalNonOpExpC, nonOpExpNC: totalNonOpExpNC, tax, netIncome, internalCogs, externalCogs,
            sgaDetails: { totalSgaVar, totalSgaSemi, totalSgaFixOnly, amortization, fixBadDebt },
            ratios: { cogsRatio: revenue>0?cogs/revenue:0, grossMargin: revenue>0?grossProfit/revenue:0, sgaRatio: revenue>0?totalSga/revenue:0, opMargin: revenue>0?operatingProfit/revenue:0, netMargin: revenue>0?netIncome/revenue:0 }
          });

          const variableCosts = (totalBaseCost + totalDirExp)*ratio + externalCogs + totalSgaVar;
          const contributionMargin = revenue - variableCosts;
          const fixedCosts = totalIndExp*ratio + depreciation*ratio + totalSgaSemi + totalSgaFixOnly + amortization;
          
          res.is_managerial.push({
            actualProdVol, revenue, variableCosts, contributionMargin, fixedCosts, operatingProfit: contributionMargin-fixedCosts, bepRevenue: contributionMargin>0?(fixedCosts*revenue)/contributionMargin:0,
            varCostDetails: { totalSgaVar },
            ratios: { varRatio: revenue>0?variableCosts/revenue:0, cmRatio: revenue>0?contributionMargin/revenue:0, fixedRatio: revenue>0?fixedCosts/revenue:0 }
          });

          res.bs.push({
            currentAssets: endingCash + Math.max(0, arGross-accumBadDebt) + inv + balPrepaid + balReceivable,
            nonCurrentAssets: ppeNet + intangibleNet + accumOtherNonCash,
            totalAssets: endingCash + Math.max(0, arGross-accumBadDebt) + inv + balPrepaid + balReceivable + ppeNet + intangibleNet + accumOtherNonCash,
            currentLiabilities: ap + balAdvances + balAccrued,
            nonCurrentLiabilities: accumDebt,
            totalLiabilities: ap + balAdvances + balAccrued + accumDebt,
            totalEquity: accumCapital + prevRetainedEarnings + netIncome,
            bsDetails: { cash: endingCash, ar: Math.max(0, arGross-accumBadDebt), inv, invBase, unsoldInvValue, unsoldExtInvValue, prepaidNet: balPrepaid, receivableNet: balReceivable, ppeNet, intangibleNet, otherNetAssets: accumOtherNonCash, ap, advancesNet: balAdvances, accruedNet: balAccrued, debt: accumDebt, capital: accumCapital, retainedEarnings: prevRetainedEarnings + netIncome }
          });

          res.cf.push({
            beginningCash: prevCash, operatingCf, investingCf: -totalCapex[i] - totalIntangible[i], financingCf: totalEquity[i] + totalDebt[i], netCf, endingCash, nonCashExpAdd, nonCashIncDed: totalNonOpIncNC, deltaWc,
            cfDetails: { netIncome, depreciation, amortization, badDebtExp: fixBadDebt, nonOpExpNonCash: totalNonOpExpNC, nonOpIncNonCash: totalNonOpIncNC, deltaArGross, deltaInv: -(inv - prevInvValue), deltaAp: (ap - (i>0?res.bs[i-1].bsDetails.ap:0)), advancesInflow: flowAdvances, accruedInflow: flowAccrued, prepaidOutflow: -flowPrepaid, receivableOutflow: -flowReceivable, capex: -totalCapex[i], intangibleCapex: -totalIntangible[i], equity: totalEquity[i], debt: totalDebt[i] }
          });

          const nopat = operatingProfit * (1 - (((inputs.taxRate||[])[i]||0)/100));
          
          let terminalValue = 0;
          if (i === 5) {
              const method = inputs.terminalValueMethod || 'nav';
              if (method === 'nav') {
                  terminalValue = Math.max(0, arGross-accumBadDebt) + inv - ap + ppeNet + intangibleNet + balPrepaid + balReceivable - balAdvances - balAccrued + accumOtherNonCash;
              } else if (method === 'pgm') {
                  const fcff_before_tv = nopat + depreciation + amortization - totalCapex[i] - totalIntangible[i] + deltaWc;
                  const g = (inputs.perpetualGrowthRate ?? 1.0) / 100;
                  const effectiveWacc = Math.max(wacc, g + 0.001);
                  terminalValue = (fcff_before_tv * (1 + g)) / (effectiveWacc - g);
                  if (terminalValue < 0) terminalValue = 0;
              }
          }
          const fcff = nopat + depreciation + amortization + terminalValue - totalCapex[i] - totalIntangible[i] + deltaWc;
          
          res.fcffData.push({ nopat, depreciation, amortization, terminalValue, capex: totalCapex[i], intangibleCapex: totalIntangible[i], deltaWc: deltaWc, fcff, pvFcff: fcff / Math.pow(1 + wacc, i) });
          
          prevCash = endingCash; prevInvValue = inv; prevRetainedEarnings += netIncome;
        }

        const fcffArray = res.fcffData.map(d=>d.fcff);
        res.npv = fcffArray.reduce((acc, cf, idx) => acc + (cf / Math.pow(1 + wacc, idx)), 0);
        res.irr = calculateIRR(fcffArray);

        let cumFcff = 0;
        fcffArray.forEach((cf, idx) => {
          const prevCum = cumFcff; cumFcff += cf;
          if (res.paybackPeriod === null && cumFcff >= 0) res.paybackPeriod = idx === 0 ? 0 : (idx - 1) + Math.abs(prevCum) / cf;
        });

        res.revenueDetails = revTreeGlobal;
        res.internalCogsDetails = intVolTreeGlobal;
        res.externalCogsDetails = extCogsTreeGlobal;
        res.internalCogsFactorTree = intCogsFactorTreeGlobal;

        const valuationArr = pad6(inputs.equityValuation || []).map(v => toMil(v));
        let ownershipHistory = []; 
        let currentOwnership = {}; 

        const y0Total = totalEquity[0];
        (inputs.equityList || []).forEach(eq => {
            currentOwnership[eq.id] = y0Total > 0 ? toMil(eq.amounts[0]) / y0Total : 0;
        });
        ownershipHistory.push({ ...currentOwnership });

        for(let t = 1; t < 6; t++) {
            const tTotal = totalEquity[t];
            let v_t = valuationArr[t];
            
            if (tTotal > 0) {
                if (v_t <= tTotal) {
                   const accumPrev = totalEquity.slice(0, t).reduce((a,b)=>a+b,0);
                   v_t = accumPrev + tTotal; 
                }
                const newSharePool = tTotal / v_t; 
                const dilutionFactor = 1 - newSharePool; 
                
                (inputs.equityList || []).forEach(eq => {
                    const investAmount = toMil(eq.amounts[t]);
                    const newlyAcquiredShare = investAmount / v_t;
                    currentOwnership[eq.id] = (currentOwnership[eq.id] * dilutionFactor) + newlyAcquiredShare;
                });
            }
            
            const sumOwnership = Object.values(currentOwnership).reduce((a,b)=>a+b,0);
            if(sumOwnership > 0 && Math.abs(sumOwnership - 1) > 0.000001 && y0Total > 0) { 
                (inputs.equityList || []).forEach(eq => { currentOwnership[eq.id] /= sumOwnership; });
            }
            ownershipHistory.push({ ...currentOwnership });
        }
        res.ownershipHistory = ownershipHistory;

        const equityIRRs = (inputs.equityList || []).map(eq => {
            let totalInvest = 0;
            let totalReturn = 0;

            const cf_j = [0,1,2,3,4,5].map(i => {
                const eqInvest = toMil((eq.amounts || [])[i]);
                totalInvest += eqInvest;
                const share = ownershipHistory[i][eq.id] || 0;
                
                let j_cf = -eqInvest;
                
                if (i === 5) {
                   const method = inputs.terminalValueMethod || 'nav';
                   const tv_entity = res.fcffData[5].terminalValue;
                   const endingCash = res.cf[5].endingCash;
                   const accumDebt = res.bs[5].bsDetails.debt;
                   
                   let tv_equity = (method === 'none' ? 0 : tv_entity) + endingCash - accumDebt;
                   
                   if (tv_equity > 0) {
                       const returnAmount = tv_equity * share;
                       j_cf += returnAmount;
                       totalReturn = returnAmount;
                   }
                }
                return j_cf;
            });
            const moic = totalInvest > 0 ? totalReturn / totalInvest : 0;
            return { name: eq.name, irr: calculateIRR(cf_j), moic };
        });
        res.equityIRRs = equityIRRs;

        const buildCostRatioTree = (costNodes, revNodes) => {
            costNodes.forEach(c => {
                const r = revNodes.find(x => x.id === c.id);
                if (r && r.values) {
                    c.ratios = c.values.map((v, i) => r.values[i] > 0 ? v / r.values[i] : 0);
                    if (c.sub && r.sub) buildCostRatioTree(c.sub, r.sub);
                }
            });
        };
        buildCostRatioTree(res.internalCogsDetails, res.revenueDetails);
        buildCostRatioTree(res.externalCogsDetails, res.revenueDetails);

        const buildGpTree = (revNodes, intCogsNodes, extCogsNodes) => {
            return (revNodes || []).map(r => {
                const iNode = intCogsNodes?.find(x => x.id === r.id);
                const eNode = extCogsNodes?.find(x => x.id === r.id);
                const gpValues = [0,1,2,3,4,5].map(y => {
                    const rev = r.values[y] || 0;
                    const intCogs = iNode?.values?.[y] || 0;
                    const extCogs = eNode?.values?.[y] || 0;
                    return rev - (intCogs + extCogs);
                });
                const gpRatios = [0,1,2,3,4,5].map(y => r.values[y] > 0 ? gpValues[y] / r.values[y] : 0);
                
                let sub = [];
                if (r.sub) {
                    sub = buildGpTree(r.sub, iNode?.sub||[], eNode?.sub||[]);
                }
                return { id: r.id, label: r.label, isGroup: r.isGroup, level: r.level, values: gpValues, ratios: gpRatios, sub };
            });
        };
        res.gpAnalysisTree = buildGpTree(res.revenueDetails, res.internalCogsDetails, res.externalCogsDetails);

        const buildCmTree = (revNodes, intCogsNodes, extCogsNodes) => {
            return revNodes.map(r => {
                const iNode = intCogsNodes?.find(x => x.id === r.id);
                const eNode = extCogsNodes?.find(x => x.id === r.id);
                const cmValues = [0,1,2,3,4,5].map(y => {
                    const rev = r.values[y] || 0;
                    const intCogs = iNode?.values?.[y] || 0;
                    const extCogs = eNode?.values?.[y] || 0;
                    const varSga = rev * res.varSgaRateArr[y];
                    const intVarCogs = intCogs * res.varMfgRatioArr[y];
                    const totalVar = intVarCogs + extCogs + varSga;
                    return rev - totalVar;
                });
                const cmRatios = [0,1,2,3,4,5].map(y => r.values[y] > 0 ? cmValues[y] / r.values[y] : 0);
                
                let sub = [];
                if (r.sub) {
                    sub = buildCmTree(r.sub, iNode?.sub||[], eNode?.sub||[]);
                }
                return { id: r.id, label: r.label, isGroup: r.isGroup, level: r.level, values: cmValues, ratios: cmRatios, sub };
            });
        };
        res.cmAnalysisTree = buildCmTree(res.revenueDetails, res.internalCogsDetails, res.externalCogsDetails);

        return res;
      }, [inputs]);

                  <div className="p-10 flex flex-col gap-8">
                    <div className="border border-slate-200 rounded-sm shadow-sm overflow-hidden bg-white">
                      <div className="bg-slate-100 p-3.5 font-black text-center border-b border-slate-300 text-slate-800 tracking-widest text-sm">자 산 (Assets)</div>
                      <table className="w-full text-right border-collapse">
                        <TableHead />
                        <tbody className="divide-y divide-slate-100">
                          <ExpandableRow label="I. 유동자산" values={getB('currentAssets')} isBold details={[
                              { label: '현금및현금성자산', values: getB('bsDetails', 'cash'), level: 1 },
                              { label: '매출채권 (순액)', values: getB('bsDetails', 'ar'), level: 1 },
                              { label: '재고자산', values: getB('bsDetails', 'inv'), level: 1 },
                              { label: '선급금/선급비용', values: getB('bsDetails', 'prepaidNet'), level: 1 },
                              { label: '미수금/미수수익', values: getB('bsDetails', 'receivableNet'), level: 1 }
                            ]} />
                          <ExpandableRow label="II. 비유동자산" values={getB('nonCurrentAssets')} isBold details={[
                              { label: '유형자산 (순액)', values: getB('bsDetails', 'ppeNet'), level: 1 },
                              { label: '무형자산 (순액)', values: getB('bsDetails', 'intangibleNet'), level: 1 },
                              { label: '기타 비유동자산', values: getB('bsDetails', 'otherNetAssets'), level: 1 }
                            ]} />
                          <ExpandableRow label="자산 총계" values={getB('totalAssets')} isHeader />
                        </tbody>
                      </table>
                    </div>
                    <div className="border border-slate-200 rounded-sm shadow-sm overflow-hidden bg-white">
                      <div className="bg-slate-100 p-3.5 font-black text-center border-b border-slate-300 text-slate-800 tracking-widest text-sm">부채 및 자본 (Liabilities & Equity)</div>
                      <table className="w-full text-right border-collapse">
                        <TableHead />
                        <tbody className="divide-y divide-slate-100">
                          <ExpandableRow label="I. 유동부채" values={getB('currentLiabilities')} isBold details={[
                              { label: '매입채무', values: getB('bsDetails', 'ap'), level: 1 },
                              { label: '선수금/선수수익', values: getB('bsDetails', 'advancesNet'), level: 1 },
                              { label: '미지급금/예수금', values: getB('bsDetails', 'accruedNet'), level: 1 }
                            ]} />
                          <ExpandableRow label="II. 비유동부채" values={getB('nonCurrentLiabilities')} isBold details={[{ label: '장기차입금', values: getB('bsDetails', 'debt'), level: 1 }]} />
                          <ExpandableRow label="부채 총계" values={getB('totalLiabilities')} isTotal />
                          <ExpandableRow label="III. 자본금" values={getB('bsDetails', 'capital')} isBold />
                          <ExpandableRow label="IV. 이익잉여금" values={getB('bsDetails', 'retainedEarnings')} isBold />
                          <ExpandableRow label="자본 총계" values={getB('totalEquity')} isTotal />
                          <ExpandableRow label="부채 및 자본 총계" values={model.bs.map(d => d.totalLiabilities + d.totalEquity)} isHeader />
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>

                {/* 6. 현금흐름표 탭 */}
                <div style={{ display: activeTab === 'cf' ? 'block' : 'none' }}>
                  <div className="px-10 py-8 border-b border-slate-200 bg-slate-50 flex justify-between items-end">
                    <div>
                      <h2 className="text-2xl font-black text-slate-900 tracking-tight">추정 현금흐름표</h2>
                      <p className="text-xs text-slate-500 mt-2 font-semibold">Statement of Cash Flows</p>
                    </div>
                    <span className="text-[11px] text-slate-500 font-bold">(단위: 백만원)</span>
                  </div>
                  <div className="p-10">
                    <table className="w-full text-sm text-right border-collapse border-y-2 border-slate-800 bg-white">
                      <TableHead />
                      <tbody className="divide-y divide-slate-200">
                        <ExpandableRow label="I. 영업활동 현금흐름" values={getC('operatingCf')} isBold details={[
                            { label: '당기순이익', values: getC('cfDetails', 'netIncome'), level: 1 },
                            { label: '현금유출 없는 비용 가산 (+)', values: getC('nonCashExpAdd'), isGroup: true, level: 1, sub: [
                                { label: '감가상각비', values: getC('cfDetails', 'depreciation'), level: 2 },
                                { label: '무형자산상각비', values: getC('cfDetails', 'amortization'), level: 2 },
                                { label: '대손상각비', values: getC('cfDetails', 'badDebtExp'), level: 2 },
                                { label: '기타 비현금성 비용', values: getC('cfDetails', 'nonOpExpNonCash'), level: 2 }
                            ]},
                            { label: '현금유입 없는 수익 차감 (-)', values: getC('nonCashIncDed'), isGroup: true, level: 1, sub: [
                                { label: '기타 비현금성 수익', values: getC('cfDetails', 'nonOpIncNonCash'), level: 2 }
                            ]},
                            { label: '영업자산부채 변동 증감 (ΔWC)', values: getC('deltaWc'), isGroup: true, level: 1, sub: [
                                { label: '매출채권 감소(증가)', values: getC('cfDetails', 'deltaArGross'), level: 2 },
                                { label: '재고자산 감소(증가)', values: getC('cfDetails', 'deltaInv'), level: 2 },
                                { label: '선급금 등 감소(증가)', values: getC('cfDetails', 'prepaidOutflow'), level: 2 },
                                { label: '미수금 등 감소(증가)', values: getC('cfDetails', 'receivableOutflow'), level: 2 },
                                { label: '매입채무 증가(감소)', values: getC('cfDetails', 'deltaAp'), level: 2 },
                                { label: '선수금 등 증가(감소)', values: getC('cfDetails', 'advancesInflow'), level: 2 },
                                { label: '미지급금 등 증가(감소)', values: getC('cfDetails', 'accruedInflow'), level: 2 }
                            ]}
                          ]} />
                        <ExpandableRow label="II. 투자활동 현금흐름" values={getC('investingCf')} isBold details={[
                            { label: '자본적지출 (CAPEX)', values: getC('cfDetails', 'capex'), level: 1 },
                            { label: '무형자산 투자액', values: getC('cfDetails', 'intangibleCapex'), level: 1 }
                          ]} />
                        <ExpandableRow label="III. 재무활동 현금흐름" values={getC('financingCf')} isBold details={[
                            { label: '자기자본 유입 (증자)', values: getC('cfDetails', 'equity'), level: 1 },
                            { label: '타인자본 유입 (차입)', values: getC('cfDetails', 'debt'), level: 1 }
                          ]} />
                        <ExpandableRow label="현금의 증감 (I + II + III)" values={getC('netCf')} isTotal />
                        <ExpandableRow label="기초 현금" values={getC('beginningCash')} isBold />
                        <ExpandableRow label="기말 현금" values={getC('endingCash')} isHeader />
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            </div>
          </div>
          
          {}
          {zoomedImg && (
             <div 
                className="fixed inset-0 z-[9999] bg-slate-900/95 flex flex-col items-center justify-center p-4 cursor-pointer backdrop-blur-sm transition-all" 
                onClick={() => setZoomedImg(null)}
                onWheel={(e) => {
                   if (zoomedImg.images && zoomedImg.images.length > 1) {
                       if (e.deltaY > 0) handleZoomNav(1);
                       else if (e.deltaY < 0) handleZoomNav(-1);
                   }
                }}
             >
                <div className="absolute top-6 right-8 text-white/70 hover:text-red-400 text-4xl font-light transition-colors p-2">&times;</div>
                
                {zoomedImg.images && zoomedImg.images.length > 1 && (
                    <button onClick={(e) => { e.stopPropagation(); handleZoomNav(-1); }} className="absolute left-4 md:left-12 text-white/40 hover:text-white text-6xl font-light transition-colors z-10 p-4">‹</button>
                )}

                <img 
                    src={zoomedImg.images ? zoomedImg.images[zoomedImg.index] : zoomedImg} 
                    alt="Zoomed" 
                    className="max-w-full max-h-[85vh] object-contain rounded-md shadow-2xl transition-transform duration-200" 
                    onClick={(e) => e.stopPropagation()} 
                />
                
                {zoomedImg.images && zoomedImg.images.length > 1 && (
                    <button onClick={(e) => { e.stopPropagation(); handleZoomNav(1); }} className="absolute right-4 md:right-12 text-white/40 hover:text-white text-6xl font-light transition-colors z-10 p-4">›</button>
                )}

                <div className="mt-6 flex flex-col items-center gap-2.5">
                    {zoomedImg.images && zoomedImg.images.length > 1 && (
                        <div className="text-white font-bold text-sm bg-black/60 px-5 py-1.5 rounded-full shadow-lg border border-white/10">
                            {zoomedImg.index + 1} / {zoomedImg.images.length}
                        </div>
                    )}
                    <div className="text-white/60 text-[11px] font-semibold tracking-wide bg-black/40 px-4 py-1.5 rounded-full">
                        {zoomedImg.images && zoomedImg.images.length > 1 
                            ? '마우스 휠이나 좌우 방향키(←/→)로 이동 • 여백을 클릭하여 닫기' 
                            : '여백을 클릭하여 닫기'}
                    </div>
                </div>
             </div>
          )}

          {appMessage && (
             <div className="fixed inset-0 z-[10000] bg-slate-900/50 flex items-center justify-center backdrop-blur-sm p-4">
                <div className="bg-white p-6 rounded-md shadow-xl min-w-[300px] max-w-sm border-t-4 border-slate-900">
                   <p className="text-sm font-bold text-slate-800 mb-6 whitespace-pre-wrap">{appMessage.text}</p>
                   <div className="flex justify-end gap-2">
                      {appMessage.type === 'confirm' && (
                         <button onClick={() => setAppMessage(null)} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded transition-colors">취소</button>
                      )}
                      <button onClick={() => { if (appMessage.onConfirm) appMessage.onConfirm(); setAppMessage(null); }} className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded shadow-sm transition-colors">확인</button>
                   </div>
                </div>
             </div>
          )}

          {pendingPasteImage && (
             <div className="fixed inset-0 z-[10001] bg-slate-900/70 flex items-center justify-center backdrop-blur-sm p-4">
                <div className="bg-white rounded-lg shadow-2xl p-6 max-w-lg w-full border-t-4 border-blue-600">
                   <h3 className="text-lg font-black text-slate-900 mb-4 flex items-center gap-2">📋 클립보드 이미지 감지</h3>
                   <div className="bg-slate-100 rounded border border-slate-200 p-2 mb-5 flex justify-center">
                       <img src={pendingPasteImage} alt="Pasted preview" className="max-h-56 object-contain rounded shadow-sm" />
                   </div>
                   <p className="text-xs font-bold text-slate-600 mb-3 text-center">캡처한 이미지를 어느 항목에 추가하시겠습니까?</p>
                   <div className="grid grid-cols-2 gap-2 mb-4">
                       <button onClick={() => applyPaste('irSlideImages', true)} className="p-2.5 text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 rounded hover:bg-indigo-100 shadow-sm transition-colors">IR 슬라이드 (다중)</button>
                       <button onClick={() => applyPaste('majorClientsImages', true)} className="p-2.5 text-xs font-bold bg-teal-50 text-teal-700 border border-teal-200 rounded hover:bg-teal-100 shadow-sm transition-colors">주요 거래처 (다중)</button>
                       <button onClick={() => applyPaste('govInvestRoadmapImages', true)} className="p-2.5 text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 rounded hover:bg-emerald-100 shadow-sm transition-colors">투자 로드맵 (다중)</button>
                       <button onClick={() => applyPaste('missionImageBase64', false)} className="p-2.5 text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200 rounded hover:bg-blue-100 shadow-sm transition-colors">미션 (단일 이미지)</button>
                       <button onClick={() => applyPaste('visionImageBase64', false)} className="p-2.5 text-xs font-bold bg-red-50 text-red-700 border border-red-200 rounded hover:bg-red-100 shadow-sm transition-colors col-span-2">비전 (단일 이미지)</button>
                   </div>
                   <div className="flex justify-end border-t border-slate-200 pt-3">
                       <button onClick={() => setPendingPasteImage(null)} className="px-5 py-2.5 bg-slate-800 text-white text-xs font-bold rounded shadow-sm hover:bg-slate-700 transition-colors">붙여넣기 취소</button>
                   </div>
                </div>
             </div>
          )}
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
