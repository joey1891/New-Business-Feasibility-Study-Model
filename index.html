    const calculateIRR = (cashFlows) => {
      let guess = 0.1;
      for (let i = 0; i < 1000; i++) {
        let npv = 0, derivative = 0;
        for (let t = 0; t < cashFlows.length; t++) {
          npv += cashFlows[t] / Math.pow(1 + guess, t);
          if (t > 0) derivative -= (t * cashFlows[t]) / Math.pow(1 + guess, t + 1);
        }
        if (Math.abs(npv) < 0.001) return guess;
        let nextGuess = guess - npv / derivative;
        if (nextGuess <= -1) nextGuess = -0.99;
        if (Math.abs(nextGuess - guess) < 0.00001) return nextGuess;
        guess = nextGuess;
      }
      return guess;
    };

      const [localVal, setLocalVal] = useState(value === 0 ? '0' : (value||0).toLocaleString());

      useEffect(() => { 
        if (!isEditing) setLocalVal(value === 0 ? '0' : (value||0).toLocaleString()); 
      }, [value, isEditing]);

      const handleChange = (e) => {
        // 숫자, 쉼표, 소수점 및 사칙연산 기호(+, -, *, /, (, )) 허용
        const raw = e.target.value.replace(/[^0-9.,+\-*/()\s]/g, '');
        setLocalVal(raw);
      };

      const applyCalculation = () => {
        setIsEditing(false);
        try {
          // 쉼표를 제거하고 수식만 추출
          const expr = localVal.replace(/,/g, '');
          if (expr.trim() === '') { onChange(0); setLocalVal('0'); return; }
          
          // 보안을 위해 숫자와 수식 관련 기호만 남김
          const cleanExpr = expr.replace(/[^0-9.+\-*/()\s]/g, '');
          
          // 자바스크립트 엔진을 통한 수식 계산 (안전한 문자열만 실행)
          const result = new Function('return ' + cleanExpr)();
          const finalNum = (isNaN(result) || !isFinite(result)) ? 0 : Number(result);
          
          onChange(finalNum);
          setLocalVal(finalNum === 0 ? '0' : finalNum.toLocaleString());
        } catch (e) {
          // 수식 오류 시 기존 정상 값으로 롤백
          setLocalVal(value === 0 ? '0' : (value||0).toLocaleString());
        }
      };

      return <input 
        type="text" 
        value={localVal} 
        onFocus={() => setIsEditing(true)}
        onChange={handleChange} 
        onBlur={applyCalculation}
        onKeyDown={(e) => { if(e.key === 'Enter') e.target.blur(); }}

      />;
    });

                         {product.isInternal === false && <div className="absolute top-0 left-0 w-1 h-full bg-orange-500"></div>}
                         <div className="flex justify-between items-center mb-3 border-b border-slate-200 pb-2 pl-2">
                            <input type="text" value={product.name} onChange={(e) => handlers.updateField(pathIds, product.id, 'name', null, e.target.value)} placeholder="품목명 입력" className="text-[12px] font-bold text-slate-800 bg-transparent border-b border-transparent focus:border-red-700 outline-none w-1/2 px-1" />
                            <div className="flex items-center gap-3">

                                  <input type="checkbox" checked={product.isInternal !== false} onChange={(e) => handlers.updateField(pathIds, product.id, 'isInternal', null, e.target.checked)} className="accent-red-700" /> 자체생산
                               </label>
                               <button onClick={() => handlers.rmProduct(pathIds, product.id)} className="text-slate-400 hover:text-red-700 font-bold px-1">&times;</button>
                            </div>
                         </div>
                         <div className="pl-2">
                             <div className="text-[10px] font-bold text-slate-600 mb-1.5">단가 (Price - 원)</div>
                             <div className="grid grid-cols-3 gap-2 mb-4">
                                {pad6(product.prices).map((p, idx) => (
                                   <div key={`p-${idx}`} className="flex flex-col">
                                      <span className="text-[9px] text-slate-400 mb-0.5 text-center font-bold">Y{idx}</span>
                                      <NumInput value={p} onChange={(v) => handlers.updateField(pathIds, product.id, 'prices', idx, v)} className="text-[10px] font-semibold w-full" />
                                   </div>
                                ))}
                             </div>
                             <div className="text-[10px] font-bold text-slate-600 mb-1.5">목표 수량 (Volume - 개)</div>
                             <div className="grid grid-cols-3 gap-2 mb-2">
                                {pad6(product.volumes).map((v, idx) => (
                                   <div key={`v-${idx}`} className="flex flex-col">
                                      <span className="text-[9px] text-slate-400 mb-0.5 text-center font-bold">Y{idx}</span>
                                      <NumInput value={v} onChange={(val) => handlers.updateField(pathIds, product.id, 'volumes', idx, val)} className="text-[10px] font-semibold w-full" />

                             </div>
                             {product.isInternal === false && (
                                 <div className="mt-4 bg-orange-50/50 p-3 rounded border border-orange-100">

                                            <NumInput value={sc} onChange={(v) => handlers.updateField(pathIds, product.id, 'supplyCosts', idx, v)} className="text-[10px] border-orange-300 focus:border-orange-500 bg-white text-orange-900 font-bold w-full" />

        const cfg = levelConfig[level];
        return (

                        <div className="flex justify-between items-center mb-2 pb-1 border-b border-slate-200/50">
                            <input type="text" value={item.name} onChange={(e) => handlers.updateName(pathIds, item.id, e.target.value)} placeholder={cfg.ph} className="text-xs font-bold text-slate-800 bg-transparent border-b border-transparent focus:border-red-700 outline-none w-1/2 px-1" />

    function App() {
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [authLoading, setAuthLoading] = useState(true);
      const [authError, setAuthError] = useState('');
      const [signUpMessage, setSignUpMessage] = useState('');
      
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [rememberId, setRememberId] = useState(false);

      const [activeTab, setActiveTab] = useState('npv');
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [inputs, setInputs] = useState(DEFAULT_INPUTS);
      const [projects, setProjects] = useState([]);
      const [projectName, setProjectName] = useState('새 프로젝트');
      const [currentProjectId, setCurrentProjectId] = useState(null);
      const [saveStatus, setSaveStatus] = useState('');
      const [deleteConfirmOpen, setDeleteConfirmOpen] = useState(false);

      const checkApprovalAndSetUser = async (sessionUser) => {
        if (!sessionUser) {
          setUser(null); setAuthLoading(false); return;
        }
        try {
          const { data, error } = await supabaseClient.from('user_profiles').select('is_approved').eq('id', sessionUser.id);
          const userEmail = sessionUser.email.toLowerCase();
          const isSuperAdmin = userEmail === 'ceo@hyminternational.com';
          let isApproved = false;
          let isAdminCheck = isSuperAdmin || userEmail.includes('admin');

          if (error) {
            console.warn("DB 프로필 조회 실패(테이블 미생성 등):", error.message);
          } else if (data && data.length > 0) {
            isApproved = data[0].is_approved === true;
          }

          if (isSuperAdmin) {
            isApproved = true;
            isAdminCheck = true;
          }

          if (isApproved || isAdminCheck) {
            setUser(sessionUser);
            setIsAdmin(isAdminCheck);
            setIsSidebarOpen(isAdminCheck);
            setAuthError('');
          } else {
            await supabaseClient.auth.signOut(); 
            setUser(null); 
            setAuthError('⏳ 관리자 승인 대기 중입니다.');
          }
        } catch (e) { 
          console.error("Auth Exception:", e);
          const userEmail = sessionUser.email?.toLowerCase() || '';
          const isSuperAdmin = userEmail === 'ceo@hyminternational.com';
          const isAdminCheck = isSuperAdmin || userEmail.includes('admin');
          
          setUser(sessionUser); 
          setIsAdmin(isAdminCheck);
          setIsSidebarOpen(isAdminCheck);
          setAuthError('');
        }
        setAuthLoading(false);
      };

      useEffect(() => {
        supabaseClient.auth.getSession().then(({ data }) => checkApprovalAndSetUser(data?.session?.user));
        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((event, session) => {
          if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') checkApprovalAndSetUser(session?.user);
          else if (event === 'SIGNED_OUT') setUser(null);
        });
        const savedEmail = localStorage.getItem('feasibility_saved_email');
        if(savedEmail) { setEmail(savedEmail); setRememberId(true); }
        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const fetchProjects = async () => {
          const { data } = await supabaseClient.from('feasibility_projects').select('id, name, updated_at, inputs, user_id').order('updated_at', { ascending: false });
          if (data) {
             if (isAdmin) setProjects(data);
             else setProjects(data.filter(p => p.inputs?.isPublic === true || p.user_id === user.id));
          }
        };
        fetchProjects();
      }, [user, isAdmin]);

      const handleLogin = async (e) => {
        e.preventDefault(); setAuthError(''); setSignUpMessage(''); setAuthLoading(true);
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) setAuthError(`❌ 로그인 실패: ${error.message === 'Invalid login credentials' ? '정보 불일치' : error.message}`);
        else if(rememberId) localStorage.setItem('feasibility_saved_email', email);
        else localStorage.removeItem('feasibility_saved_email');
        setAuthLoading(false);
      };

      const handleSignUp = async (e) => {
        e.preventDefault(); setAuthError(''); setSignUpMessage('');
        if(password.length < 6) return setAuthError('비밀번호는 6자리 이상이어야 합니다.');
        setAuthLoading(true);
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) setAuthError(`❌ 가입 실패: ${error.message}`);
        else if (data?.user) { await supabaseClient.auth.signOut(); setSignUpMessage('✅ 가입 완료! 관리자 승인 후 로그인 가능합니다.'); }
        setAuthLoading(false);
      };

      const handleLogout = async () => { await supabaseClient.auth.signOut(); setUser(null); };

      const handleSave = async () => {
        if (!user) return; setSaveStatus('저장 중...');
        try {
          if (currentProjectId) await supabaseClient.from('feasibility_projects').update({ name: projectName, inputs, updated_at: new Date().toISOString() }).eq('id', currentProjectId);
          else {
            const { data } = await supabaseClient.from('feasibility_projects').insert([{ name: projectName, inputs, user_id: user.id }]).select();
            if (data && data.length > 0) setCurrentProjectId(data[0].id);
          }
          setSaveStatus('✅ 저장 완료');
          const { data: updated } = await supabaseClient.from('feasibility_projects').select('id, name, updated_at, inputs, user_id').order('updated_at', { ascending: false });
          if (updated) {
             if (isAdmin) setProjects(updated);
             else setProjects(updated.filter(p => p.inputs?.isPublic === true || p.user_id === user.id));
          }
          setTimeout(() => setSaveStatus(''), 3000);
        } catch (e) { setSaveStatus('❌ 권한 오류'); }
      };

      const handleDeleteProject = async () => {
        if (!currentProjectId) return; 
        setSaveStatus('삭제 중...');
        try {
          await supabaseClient.from('feasibility_projects').delete().eq('id', currentProjectId);
          const { data: updated } = await supabaseClient.from('feasibility_projects').select('id, name, updated_at, inputs, user_id').order('updated_at', { ascending: false });
          if (updated) {
             if (isAdmin) setProjects(updated);
             else setProjects(updated.filter(p => p.inputs?.isPublic === true || p.user_id === user.id));
          }
          setInputs(DEFAULT_INPUTS); setProjectName('새 프로젝트'); setCurrentProjectId(null);
          setSaveStatus('✅ 삭제 완료');
          setDeleteConfirmOpen(false);
          setTimeout(() => setSaveStatus(''), 3000);
        } catch (e) { setSaveStatus('❌ 삭제 권한 오류'); }
      };

      const handleLoad = (id) => {
        const proj = projects.find(p => p.id == id);
        if (proj) {
          let loaded = cloneDeep(proj.inputs);
          loaded = { ...DEFAULT_INPUTS, ...loaded };
          
          ['inflationRate', 'interestRate', 'exchangeRate', 'industryGrowth', 'taxRate', 'costOfEquity', 'capexMaxCapa', 'utilization', 'lossRate', 'arDays', 'invDays', 'apDays'].forEach(k => {
             loaded[k] = pad6(loaded[k] || DEFAULT_INPUTS[k]);
          });
          
          ['advancesList', 'accruedList', 'prepaidList', 'receivableList', 'sgaVarList', 'sgaSemiList', 'sgaFixList'].forEach(k => {
             if(loaded[k]) loaded[k] = loaded[k].map(it => ({...it, amounts: pad6(it.amounts), rates: pad6(it.rates), isRate: it.isRate ?? true}));
          });

          ['equityList', 'debtList', 'capexList', 'intangibleList', 'baseCostList', 'nonOpIncCashList', 'nonOpIncNonCashList', 'nonOpExpCashList', 'nonOpExpNonCashList'].forEach(k => {
             if(loaded[k]) loaded[k] = loaded[k].map(it => ({...it, amounts: pad6(it.amounts)}));
          });
          
          ['directExpList', 'indirectExpList'].forEach(k => {
             if(loaded[k]) loaded[k] = loaded[k].map(it => ({...it, rates: pad6(it.rates || it.amounts)}));
          });

          if (!loaded.sgaVarList) {
             const getT = (key) => (loaded.sgaTypes && loaded.sgaTypes[key]) ? (loaded.sgaTypes[key] === 'rate') : true;
             const getF = (key) => (loaded.sgaTypes && loaded.sgaTypes[key]) ? (loaded.sgaTypes[key] === 'rate') : false;
             loaded.sgaVarList = [

          const fixTree = (cList) => (cList||[]).map(rt => {
             rt.countries = (rt.countries||[]).map(c => {
                 c.brands = (c.brands||[]).map(br => {
                     br.bizTypes = (br.bizTypes||[]).map(bt => {
                         bt.salesModes = (bt.salesModes||[]).map(sm => {

                                             p.purchaseVolumes = pad6(p.purchaseVolumes||[0]);
                                             if(p.isInternal === undefined) p.isInternal = true;

          if (loaded.salesHierarchy && loaded.salesHierarchy.length>0 && !loaded.salesHierarchy[0].countries) {

      const handleListField = (listName, id, field, value) => setInputs(prev => ({ ...prev, [listName]: prev[listName].map(item => item.id === id ? { ...item, [field]: value } : item) }));
      const addListItem = (listName) => setInputs(prev => ({ ...prev, [listName]: [...prev[listName], { id: Date.now(), name: '', amounts: pad6([0]), rates: pad6([0]), isRate: true, usefulLife: 5 }] }));
      const removeListItem = (listName, id) => setInputs(prev => ({ ...prev, [listName]: prev[listName].filter(item => item.id !== id) }));

      const hHandlers = {
          addLevelItem: (pathIds, newObj, targetKey) => setInputs(p => {

              const node = targetArr.find(x => x.id === targetId);

      const treeActions = {
          addRevType: () => hHandlers.addLevelItem([], {id: Date.now().toString(), name: '', countries: []}, 'salesHierarchy'),

          rmCountry: (p, id) => hHandlers.rmLevelItem(p, id),

          rmBrand: (p, id) => hHandlers.rmLevelItem(p, id),
          addBizType: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', salesModes: []}, 'bizTypes'),
          rmBizType: (p, id) => hHandlers.rmLevelItem(p, id),
          addSalesMode: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', channels: []}, 'salesModes'),
          rmSalesMode: (p, id) => hHandlers.rmLevelItem(p, id),
          addChannel: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', clients: []}, 'channels'),
          rmChannel: (p, id) => hHandlers.rmLevelItem(p, id),
          addClient: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', categories: []}, 'clients'),
          rmClient: (p, id) => hHandlers.rmLevelItem(p, id),
          addCategory: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', products: []}, 'categories'),
          rmCategory: (p, id) => hHandlers.rmLevelItem(p, id),
          addProduct: (p, id) => hHandlers.addLevelItem([...p, id], {id: Date.now().toString(), name: '', isInternal: true, prices: pad6([0]), volumes: pad6([0]), supplyCosts: pad6([0]), purchaseVolumes: pad6([0])}, 'products'),
          rmProduct: (p, id) => hHandlers.rmLevelItem(p, id),
          updateName: hHandlers.updateName, updateField: hHandlers.updateField
      };

      const model = useMemo(() => {
        const infRate = pad6(inputs.inflationRate || [2.5]);
        const infMultArr = [1];
        for(let i=1; i<6; i++) infMultArr[i] = infMultArr[i-1] * (1 + (infRate[i]/100));

        const sumMil = (list, i) => (list||[]).reduce((s, it) => s + toMil((it.amounts||[])[i]), 0);
        const totalEquity = [0,1,2,3,4,5].map(i => sumMil(inputs.equityList, i));
        const totalDebt = [0,1,2,3,4,5].map(i => sumMil(inputs.debtList, i));
        const totalCapex = [0,1,2,3,4,5].map(i => sumMil(inputs.capexList, i));
        const totalIntangible = [0,1,2,3,4,5].map(i => sumMil(inputs.intangibleList, i));

        const initV = totalEquity[0] + totalDebt[0];
        const wE = initV > 0 ? totalEquity[0]/initV : 0;
        const wD = initV > 0 ? totalDebt[0]/initV : 0;
        const wacc = initV > 0 ? (wE * ((inputs.costOfEquity[0]||0)/100)) + (wD * ((inputs.interestRate[0]||0)/100) * (1 - (inputs.taxRate[0]||0)/100)) : ((inputs.costOfEquity[0]||0)/100);

        let res = { is_financial: [], is_managerial: [], bs: [], cf: [], fcffData: [], npv: 0, irr: 0, paybackPeriod: null, wacc, wE, wD, infMultArr, totalBaseCostArr: [] };
        
        let revTreeGlobal=[], intVolTreeGlobal=[], extCogsTreeGlobal=[], intCogsFactorTreeGlobal=[];
        let varSgaTree = (inputs.sgaVarList||[]).map(it => ({ label: it.name, values: pad6([0]), level: 2 }));
        let semiSgaTree = (inputs.sgaSemiList||[]).map(it => ({ label: it.name, values: pad6([0]), level: 2 }));
        let fixSgaTree = (inputs.sgaFixList||[]).map(it => ({ label: it.name, values: pad6([0]), level: 2 }));
        let nonOpIncCTree = (inputs.nonOpIncCashList||[]).map(it => ({ label: it.name, values: pad6([0]), level: 1 }));
        let nonOpIncNCTree = (inputs.nonOpIncNonCashList||[]).map(it => ({ label: it.name, values: pad6([0]), level: 1 }));
        let nonOpExpCTree = (inputs.nonOpExpCashList||[]).map(it => ({ label: it.name, values: pad6([0]), level: 1 }));
        let nonOpExpNCTree = (inputs.nonOpExpNonCashList||[]).map(it => ({ label: it.name, values: pad6([0]), level: 1 }));

        let prevCash=0, accumDebt=0, accumCapital=0, accumBadDebt=0, accumOtherNonCash=0, prevArGross=0, prevInvValue=0, prevRetainedEarnings=0;
        let prevBalAdvances=0, prevBalAccrued=0, prevBalPrepaid=0, prevBalReceivable=0;

        for (let i = 0; i < 6; i++) {
          accumCapital += totalEquity[i]; accumDebt += totalDebt[i];

          const capa = (inputs.capexMaxCapa||[])[i]||0;
          const util = (inputs.utilization||[])[i]||0;
          const loss = (inputs.lossRate||[])[i]||0;
          const actualProdVol = capa * (util / 100) * (1 - loss / 100);

          const buildLevel = (nodes, type, currentExRate=1) => {
              let levelSum=0, levelSub=[];
              (nodes||[]).forEach(n => {
                  const exRate = n.brands ? ((n.name && (n.name.includes('한국')||n.name.includes('대한민국')||n.name.includes('korea'))) ? 1 : ((inputs.exchangeRate||[])[i]||1)) : currentExRate;
                  if (n.products) { 
                     let catSum=0, catSub=[];
                     (n.products||[]).forEach(p => {
                         let vol = (p.volumes||[])[i]||0;
                         for(let y=1; y<=i; y++) vol *= (1 + (((inputs.industryGrowth||[])[y]||0)/100));
                         
                         if (type === 'rev') {
                             const sales = ((p.prices||[])[i]||0) * exRate * vol;
                             catSum += sales; catSub.push({ label: p.name||'품목', values: pad6([0]).map((_,idx)=>idx===i?sales:0), level: 9 });
                         } else if (type === 'intCogsVol' && p.isInternal !== false) {
                             catSum += vol; catSub.push({ label: p.name||'품목', vol, level: 9 });
                         } else if (type === 'extCogs' && p.isInternal === false) {
                             const ecogs = ((p.supplyCosts||[])[i]||0) * exRate * vol;
                             catSum += ecogs; catSub.push({ label: p.name||'품목', values: pad6([0]).map((_,idx)=>idx===i?ecogs:0), level: 9 });
                         }
                     });
                     levelSum += catSum; if(catSum>0 || i===0) levelSub.push({ label: n.name||'품목군', values: pad6([0]).map((_,idx)=>idx===i?catSum:0), isGroup:true, level:8, sub: catSub });
                  } else if (n.categories) { const { sum, sub } = buildLevel(n.categories, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ label: n.name||'거래처', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:7, sub });
                  } else if (n.clients) { const { sum, sub } = buildLevel(n.clients, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ label: n.name||'채널', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:6, sub });
                  } else if (n.channels) { const { sum, sub } = buildLevel(n.channels, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ label: n.name||'판매형태', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:5, sub });
                  } else if (n.salesModes) { const { sum, sub } = buildLevel(n.salesModes, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ label: n.name||'사업영역', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:4, sub });
                  } else if (n.bizTypes) { const { sum, sub } = buildLevel(n.bizTypes, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ label: n.name||'브랜드', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:3, sub });
                  } else if (n.brands) { const { sum, sub } = buildLevel(n.brands, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ label: n.name||'국가', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:2, sub });
                  } else if (n.countries) { const { sum, sub } = buildLevel(n.countries, type, exRate); levelSum += sum; if(sum>0 || i===0) levelSub.push({ label: n.name||'매출유형', values: pad6([0]).map((_,idx)=>idx===i?sum:0), isGroup:true, level:1, sub });
                  }
              }); return { sum: levelSum, sub: levelSub };
          };

          const { sum: revenue, sub: revTree } = buildLevel(inputs.salesHierarchy, 'rev');
          const { sum: totalInternalSalesVol, sub: intVolTree } = buildLevel(inputs.salesHierarchy, 'intCogsVol');
          const { sum: externalCogs, sub: extCogsTree } = buildLevel(inputs.salesHierarchy, 'extCogs');

          const calcWcBalance = (list) => (list||[]).reduce((s, it) => {
              if (it.isRate) return s + revenue * (((it.rates||[])[i]||0)/100);
              return s + toMil((it.amounts||[])[i]);
          }, 0);

          const balAdvances = calcWcBalance(inputs.advancesList);
          const balAccrued = calcWcBalance(inputs.accruedList);
          const balPrepaid = calcWcBalance(inputs.prepaidList);
          const balReceivable = calcWcBalance(inputs.receivableList);

          const flowAdvances = balAdvances - prevBalAdvances;
          const flowAccrued = balAccrued - prevBalAccrued;
          const flowPrepaid = balPrepaid - prevBalPrepaid;
          const flowReceivable = balReceivable - prevBalReceivable;

          const totalBaseCost = (inputs.baseCostList||[]).reduce((s, bc) => s + toMil((bc.amounts||[])[i])*infMultArr[i], 0);
          res.totalBaseCostArr.push(totalBaseCost);
          const totalDirExp = (inputs.directExpList||[]).reduce((s, de) => s + totalBaseCost*(((de.rates||[])[i]||0)/100), 0);
          const totalIndExp = (inputs.indirectExpList||[]).reduce((s, ie) => s + totalBaseCost*(((ie.rates||[])[i]||0)/100), 0);

          let depreciation=0, amortization=0;
          (inputs.capexList||[]).forEach(it => (it.amounts||[]).forEach((a, j) => { if(a && i >= j && i <= j+(it.usefulLife||5)-1) depreciation += toMil(a)/(it.usefulLife||5); }));
          (inputs.intangibleList||[]).forEach(it => (it.amounts||[]).forEach((a, j) => { if(a && i >= j && i <= j+(it.usefulLife||5)-1) amortization += toMil(a)/(it.usefulLife||5); }));

          const totalMfgCost = totalBaseCost + totalDirExp + totalIndExp + depreciation;
          const unitMfgCost = actualProdVol > 0 ? totalMfgCost / actualProdVol : 0;
          const internalCogs = totalInternalSalesVol * unitMfgCost;
          
          const convertVolToCogs = (nodes) => {
              nodes.forEach(n => {
                 if (n.vol !== undefined) { const cogs = n.vol * unitMfgCost; n.values = pad6([0]).map((_,idx)=>idx===i?cogs:0); delete n.vol; }
                 else if (n.sub) { convertVolToCogs(n.sub); n.values[i] = n.sub.reduce((s, c) => s + c.values[i], 0); }
              });
          };
          convertVolToCogs(intVolTree);

          const mergeTree = (target, source) => {
              source.forEach((sNode, idx) => {
                  if(target[idx]) { target[idx].values[i] = sNode.values[i]; if(sNode.sub) mergeTree(target[idx].sub, sNode.sub); } 
                  else target.push(sNode);
              });
          };

          const ratio = actualProdVol > 0 ? totalInternalSalesVol / actualProdVol : 0;
          let factors = [];
          (inputs.baseCostList||[]).forEach(bc => factors.push({ label: bc.name, values: pad6([0]).map((_, idx) => idx===i ? (toMil((bc.amounts||[])[i])*infMultArr[i])*ratio : 0), level: 2 }));
          (inputs.directExpList||[]).forEach(de => factors.push({ label: de.name, values: pad6([0]).map((_, idx) => idx===i ? (totalBaseCost*(((de.rates||[])[i]||0)/100))*ratio : 0), level: 2 }));
          (inputs.indirectExpList||[]).forEach(ie => factors.push({ label: ie.name, values: pad6([0]).map((_, idx) => idx===i ? (totalBaseCost*(((ie.rates||[])[i]||0)/100))*ratio : 0), level: 2 }));
          factors.push({ label: '제조 감가상각비', values: pad6([0]).map((_, idx) => idx===i ? depreciation*ratio : 0), level: 2 });

          if (i === 0) {
              revTreeGlobal = cloneDeep(revTree); intVolTreeGlobal = cloneDeep(intVolTree); extCogsTreeGlobal = cloneDeep(extCogsTree); intCogsFactorTreeGlobal = factors;
          } else {
              mergeTree(revTreeGlobal, revTree); mergeTree(intVolTreeGlobal, intVolTree); mergeTree(extCogsTreeGlobal, extCogsTree);
              factors.forEach((f, fIdx) => { if(intCogsFactorTreeGlobal[fIdx]) intCogsFactorTreeGlobal[fIdx].values[i] = f.values[i]; });
          }

          const unsoldVol = Math.max(0, actualProdVol - totalInternalSalesVol);
          const unsoldInvValue = unsoldVol * unitMfgCost;

          let unsoldExtInvValue = 0;
          const calcExtInv = (nodes, currentExRate=1) => {
              (nodes||[]).forEach(n => {
                  const exRate = n.brands ? ((n.name && (n.name.includes('한국')||n.name.includes('대한민국')||n.name.includes('korea'))) ? 1 : ((inputs.exchangeRate||[])[i]||1)) : currentExRate;
                  if (n.products) {
                      (n.products||[]).forEach(p => {
                          if (p.isInternal === false) {
                              let sVol = (p.volumes||[])[i]||0;
                              let pVol = (p.purchaseVolumes||[])[i]||0;
                              
                              for(let y=1; y<=i; y++) {
                                  const g = 1 + (((inputs.industryGrowth||[])[y]||0)/100);
                                  sVol *= g;
                                  pVol *= g;
                              }
                              const sc = ((p.supplyCosts||[])[i]||0) * exRate;
                              
                              const unsoldExtVol = Math.max(0, pVol - sVol);
                              unsoldExtInvValue += unsoldExtVol * sc;
                          }
                      });
                  } else if (n.categories) { calcExtInv(n.categories, exRate); }
                    else if (n.clients) { calcExtInv(n.clients, exRate); }
                    else if (n.channels) { calcExtInv(n.channels, exRate); }
                    else if (n.salesModes) { calcExtInv(n.salesModes, exRate); }
                    else if (n.bizTypes) { calcExtInv(n.bizTypes, exRate); }
                    else if (n.brands) { calcExtInv(n.brands, exRate); }
                    else if (n.countries) { calcExtInv(n.countries, exRate); }
              });
          };
          calcExtInv(inputs.salesHierarchy);

          const calcSgaItem = (it) => {
              if (it.isRate) return revenue * (((it.rates||[])[i]||0)/100);
              return toMil((it.amounts||[])[i]) * infMultArr[i];
          };

          let totalSgaVar = 0, totalSgaSemi = 0, totalSgaFixOnly = 0, fixBadDebt = 0;
          (inputs.sgaVarList||[]).forEach((it, idx) => { const v = calcSgaItem(it); totalSgaVar += v; if(varSgaTree[idx]) varSgaTree[idx].values[i] = v; });
          (inputs.sgaSemiList||[]).forEach((it, idx) => { const v = calcSgaItem(it); totalSgaSemi += v; if(semiSgaTree[idx]) semiSgaTree[idx].values[i] = v; });
          (inputs.sgaFixList||[]).forEach((it, idx) => { 
              const v = calcSgaItem(it); 
              totalSgaFixOnly += v; 
              if(fixSgaTree[idx]) fixSgaTree[idx].values[i] = v; 
              if(it.name.includes('대손')) fixBadDebt += v; 
          });
          accumBadDebt += fixBadDebt;

          const cogs = internalCogs + externalCogs;
          const grossProfit = revenue - cogs;
          const totalSga = totalSgaVar + totalSgaSemi + totalSgaFixOnly + amortization;
          const operatingProfit = grossProfit - totalSga;

          let totalNonOpIncC = 0, totalNonOpIncNC = 0, totalNonOpExpC = 0, totalNonOpExpNC = 0;
          (inputs.nonOpIncCashList||[]).forEach((it, idx) => { const v = toMil((it.amounts||[])[i]); totalNonOpIncC += v; if(nonOpIncCTree[idx]) nonOpIncCTree[idx].values[i] = v; });
          (inputs.nonOpIncNonCashList||[]).forEach((it, idx) => { const v = toMil((it.amounts||[])[i]); totalNonOpIncNC += v; if(nonOpIncNCTree[idx]) nonOpIncNCTree[idx].values[i] = v; });
          (inputs.nonOpExpCashList||[]).forEach((it, idx) => { const v = toMil((it.amounts||[])[i]); totalNonOpExpC += v; if(nonOpExpCTree[idx]) nonOpExpCTree[idx].values[i] = v; });
          (inputs.nonOpExpNonCashList||[]).forEach((it, idx) => { const v = toMil((it.amounts||[])[i]); totalNonOpExpNC += v; if(nonOpExpNCTree[idx]) nonOpExpNCTree[idx].values[i] = v; });

          const interestExpense = accumDebt * (((inputs.interestRate||[])[i]||0) / 100);
          const totalNonOpInc = totalNonOpIncC + totalNonOpIncNC;
          const totalNonOpExp = interestExpense + totalNonOpExpC + totalNonOpExpNC;
          const ebt = operatingProfit + totalNonOpInc - totalNonOpExp;
          const tax = Math.max(0, ebt * (((inputs.taxRate||[])[i]||0) / 100));
          const netIncome = ebt - tax;

          accumOtherNonCash += totalNonOpIncNC - totalNonOpExpNC;

          const arGross = revenue * (((inputs.arDays||[])[i]||0) / 365);
          const deltaArGross = -(arGross - prevArGross); prevArGross = arGross;

          const invBase = cogs * (((inputs.invDays||[])[i]||0) / 365);
          const inv = invBase + unsoldInvValue + unsoldExtInvValue;
          const ap = cogs * (((inputs.apDays||[])[i]||0) / 365); 
          
          let ppeNet = totalCapex.slice(0, i+1).reduce((a,b)=>a+b,0);
          let intangibleNet = totalIntangible.slice(0, i+1).reduce((a,b)=>a+b,0);
          (inputs.capexList||[]).forEach(it => (it.amounts||[]).forEach((a, j) => { if(a && i >= j) ppeNet -= (toMil(a)/(it.usefulLife||5)) * (Math.min(i, j+(it.usefulLife||5)-1) - j + 1); }));
          (inputs.intangibleList||[]).forEach(it => (it.amounts||[]).forEach((a, j) => { if(a && i >= j) intangibleNet -= (toMil(a)/(it.usefulLife||5)) * (Math.min(i, j+(it.usefulLife||5)-1) - j + 1); }));

          const deltaWc = deltaArGross - (inv - prevInvValue) + (ap - (i>0?res.bs[i-1].bsDetails.ap:0)) + flowAdvances + flowAccrued - flowPrepaid - flowReceivable;
          const nonCashExpAdd = depreciation + amortization + fixBadDebt + totalNonOpExpNC;
          const operatingCf = netIncome + nonCashExpAdd - totalNonOpIncNC + deltaWc;
          const netCf = operatingCf - totalCapex[i] - totalIntangible[i] + totalEquity[i] + totalDebt[i]; 
          const endingCash = prevCash + netCf;

          res.is_financial.push({
            revenue, cogs, grossProfit, totalSga, operatingProfit, totalNonOpInc, totalNonOpExp, interestExpense, nonOpIncC: totalNonOpIncC, nonOpIncNC: totalNonOpIncNC, nonOpExpC: totalNonOpExpC, nonOpExpNC: totalNonOpExpNC, tax, netIncome, internalCogs, externalCogs,
            sgaDetails: { totalSgaVar, totalSgaSemi, totalSgaFixOnly, amortization },
            ratios: { cogsRatio: revenue>0?cogs/revenue:0, grossMargin: revenue>0?grossProfit/revenue:0, sgaRatio: revenue>0?totalSga/revenue:0, opMargin: revenue>0?operatingProfit/revenue:0, netMargin: revenue>0?netIncome/revenue:0 }
          });

          const variableCosts = (totalBaseCost + totalDirExp)*ratio + externalCogs + totalSgaVar;
          const contributionMargin = revenue - variableCosts;
          const fixedCosts = totalIndExp*ratio + depreciation*ratio + totalSgaSemi + totalSgaFixOnly + amortization;
          
          res.is_managerial.push({
            actualProdVol, revenue, variableCosts, contributionMargin, fixedCosts, operatingProfit: contributionMargin-fixedCosts, bepRevenue: contributionMargin>0?(fixedCosts*revenue)/contributionMargin:0,
            varCostDetails: { totalSgaVar },
            ratios: { varRatio: revenue>0?variableCosts/revenue:0, cmRatio: revenue>0?contributionMargin/revenue:0, fixedRatio: revenue>0?fixedCosts/revenue:0 }
          });

          res.bs.push({
            currentAssets: endingCash + Math.max(0, arGross-accumBadDebt) + inv + balPrepaid + balReceivable,
            nonCurrentAssets: ppeNet + intangibleNet + accumOtherNonCash,
            totalAssets: endingCash + Math.max(0, arGross-accumBadDebt) + inv + balPrepaid + balReceivable + ppeNet + intangibleNet + accumOtherNonCash,
            currentLiabilities: ap + balAdvances + balAccrued,
            nonCurrentLiabilities: accumDebt,
            totalLiabilities: ap + balAdvances + balAccrued + accumDebt,
            totalEquity: accumCapital + prevRetainedEarnings + netIncome,
            bsDetails: { cash: endingCash, ar: Math.max(0, arGross-accumBadDebt), inv, invBase, unsoldInvValue, unsoldExtInvValue, prepaidNet: balPrepaid, receivableNet: balReceivable, ppeNet, intangibleNet, otherNetAssets: accumOtherNonCash, ap, advancesNet: balAdvances, accruedNet: balAccrued, debt: accumDebt, capital: accumCapital, retainedEarnings: prevRetainedEarnings + netIncome }
          });

          res.cf.push({
            beginningCash: prevCash, operatingCf, investingCf: -totalCapex[i] - totalIntangible[i], financingCf: totalEquity[i] + totalDebt[i], netCf, endingCash, nonCashExpAdd, nonCashIncDed: totalNonOpIncNC, deltaWc,
            cfDetails: { netIncome, depreciation, amortization, badDebtExp: fixBadDebt, nonOpExpNonCash: totalNonOpExpNC, nonOpIncNonCash: totalNonOpIncNC, deltaArGross, deltaInv: -(inv - prevInvValue), deltaAp: (ap - (i>0?res.bs[i-1].bsDetails.ap:0)), advancesInflow: flowAdvances, accruedInflow: flowAccrued, prepaidOutflow: -flowPrepaid, receivableOutflow: -flowReceivable, capex: -totalCapex[i], intangibleCapex: -totalIntangible[i], equity: totalEquity[i], debt: totalDebt[i] }
          });

          const nopat = operatingProfit * (1 - (((inputs.taxRate||[])[i]||0)/100));
          const terminalValue = i === 5 ? Math.max(0, arGross-accumBadDebt) + inv - ap + ppeNet + intangibleNet + balPrepaid + balReceivable - balAdvances - balAccrued + accumOtherNonCash : 0;
          const wInflow = deltaArGross - (inv - prevInvValue) + (ap - (i>0?res.bs[i-1].bsDetails.ap:0)) + flowAdvances + flowAccrued - flowPrepaid - flowReceivable;
          const fcff = nopat + depreciation + amortization + terminalValue - totalCapex[i] - totalIntangible[i] + wInflow;
          
          res.fcffData.push({ nopat, depreciation, amortization, terminalValue, capex: totalCapex[i], intangibleCapex: totalIntangible[i], deltaWc: wInflow, fcff, pvFcff: fcff / Math.pow(1 + wacc, i) });
          
          prevCash = endingCash; prevInvValue = inv; prevRetainedEarnings += netIncome;
          prevBalAdvances = balAdvances; prevBalAccrued = balAccrued; prevBalPrepaid = balPrepaid; prevBalReceivable = balReceivable;
        }

        const fcffArray = res.fcffData.map(d=>d.fcff);
        res.npv = fcffArray.reduce((acc, cf, idx) => acc + (cf / Math.pow(1 + wacc, idx)), 0);
        res.irr = calculateIRR(fcffArray);

        let cumFcff = 0;
        fcffArray.forEach((cf, idx) => {
          const prevCum = cumFcff; cumFcff += cf;
          if (res.paybackPeriod === null && cumFcff >= 0) res.paybackPeriod = idx === 0 ? 0 : (idx - 1) + Math.abs(prevCum) / cf;
        });

        res.revenueDetails = revTreeGlobal;
        res.internalCogsDetails = intVolTreeGlobal;
        res.externalCogsDetails = extCogsTreeGlobal;
        res.internalCogsFactorTree = intCogsFactorTreeGlobal;
        
        res.varSgaTree = varSgaTree;
        res.semiSgaTree = semiSgaTree;
        res.fixSgaTree = fixSgaTree;
        res.nonOpIncCTree = nonOpIncCTree;
        res.nonOpIncNCTree = nonOpIncNCTree;
        res.nonOpExpCTree = nonOpExpCTree;
        res.nonOpExpNCTree = nonOpExpNCTree;

        return res;
      }, [inputs]);

      const getF = (k1, k2) => model.is_financial.map(d => k2 ? d[k1][k2] : d[k1]);
      const getM = (k1, k2) => model.is_managerial.map(d => k2 ? d[k1][k2] : d[k1]);
      const getB = (k1, k2) => model.bs.map(d => k2 ? d[k1][k2] : d[k1]);
      const getC = (k1, k2) => model.cf.map(d => k2 ? d[k1][k2] : d[k1]);

      if (authLoading) return <div className="flex h-screen items-center justify-center bg-slate-100 font-bold text-slate-600">로딩 중...</div>;

      if (!user) {
        return (
          <div className="flex h-screen items-center justify-center bg-slate-200 font-sans">
            <div className="bg-white p-8 rounded-lg shadow-xl w-96 border-t-4 border-slate-800">
              <h1 className="text-2xl font-black text-slate-900 tracking-tighter mb-2">사업타당성 시뮬레이터</h1>
              <p className="text-xs text-slate-500 font-semibold mb-6">데이터를 클라우드에 안전하게 보관하세요.</p>
              <form onSubmit={handleLogin} className="flex flex-col gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">이메일 계정</label>
                  <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required className="w-full border border-slate-300 rounded p-2 text-sm focus:border-red-700 outline-none" placeholder="admin@email.com"/>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">비밀번호 (6자리 이상)</label>
                  <input type="password" value={password} onChange={e=>setPassword(e.target.value)} required minLength="6" className="w-full border border-slate-300 rounded p-2 text-sm focus:border-red-700 outline-none" placeholder="••••••"/>
                </div>
                <label className="flex items-center gap-2 text-xs font-bold text-slate-600 cursor-pointer">
                  <input type="checkbox" checked={rememberId} onChange={(e)=>setRememberId(e.target.checked)} className="accent-slate-900" /> 아이디 저장 및 로그인 유지
                </label>
                {authError && <div className="bg-red-50 text-red-600 p-2 text-xs font-bold rounded border border-red-200">{authError}</div>}
                {signUpMessage && <div className="bg-green-50 text-green-700 p-2 text-xs font-bold rounded border border-green-200">{signUpMessage}</div>}
                <button type="submit" disabled={authLoading} className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded shadow transition-colors mt-2 disabled:opacity-50">{authLoading ? '확인 중...' : '이메일로 로그인'}</button>
                <button type="button" onClick={handleSignUp} disabled={authLoading} className="w-full bg-white border border-slate-300 hover:border-slate-800 text-slate-800 font-bold py-2.5 rounded shadow-sm transition-colors disabled:opacity-50">새 계정으로 회원가입</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen bg-slate-200 font-sans text-slate-800 overflow-hidden">
          {isAdmin && isSidebarOpen && (
            <div className="w-[500px] min-w-[500px] bg-slate-50 border-r border-slate-300 flex flex-col z-10 shadow-[4px_0_24px_rgba(0,0,0,0.05)]">
              <div className="p-4 bg-white border-b border-slate-300 flex justify-between items-center">
                <div>
                  <h1 className="text-xl font-black text-slate-900 tracking-tighter">사업타당성 시뮬레이터</h1>
                  <p className="text-[10px] text-slate-500 mt-1 font-semibold tracking-tight">수정된 수치는 우측 보고서에 실시간 반영됩니다.</p>
                </div>
              </div>

              <div className="flex-1 overflow-y-auto p-4 custom-scrollbar bg-slate-50/50">
                <InputGroup title="📂 프로젝트 데이터 관리">
                   <input type="text" value={projectName} onChange={(e) => setProjectName(e.target.value)} placeholder="프로젝트명 입력" className="w-full text-xs font-bold border border-slate-300 rounded focus:border-red-700 outline-none p-2 mb-2 bg-slate-50" />
                   <label className="flex items-center gap-2 mb-3 text-[11px] font-bold text-slate-700 cursor-pointer bg-white border border-slate-200 p-2 rounded shadow-sm hover:bg-slate-50 transition-colors">
                      <input type="checkbox" checked={inputs.isPublic || false} onChange={(e) => setInputs(prev => ({...prev, isPublic: e.target.checked}))} className="accent-red-700 w-3.5 h-3.5" />
                      🌐 일반 사용자(뷰어)에게 이 프로젝트 공개
                   </label>
                   <div className="flex gap-2 mb-3">
                     <button onClick={handleSave} className="flex-1 bg-slate-900 hover:bg-slate-800 text-white text-[11px] font-bold py-2 rounded shadow-sm transition-colors">💾 클라우드 저장</button>
                     <button onClick={() => { setInputs(DEFAULT_INPUTS); setProjectName('새 프로젝트'); setCurrentProjectId(null); setDeleteConfirmOpen(false); }} className="flex-1 bg-white border border-slate-300 hover:border-slate-800 text-slate-800 text-[11px] font-bold py-2 rounded shadow-sm transition-colors">📄 신규 캔버스</button>
                     {currentProjectId && (
                       <button onClick={() => setDeleteConfirmOpen(true)} className="flex-1 bg-red-50 border border-red-200 hover:bg-red-100 text-red-700 text-[11px] font-bold py-2 rounded shadow-sm transition-colors">🗑️ 삭제</button>
                     )}
                   </div>
                   {deleteConfirmOpen && (
                     <div className="mb-3 p-3 bg-red-100 border border-red-300 rounded shadow-sm text-center">
                        <p className="text-red-800 text-[11px] font-bold mb-2">정말 이 프로젝트를 삭제하시겠습니까?</p>

                        </div>

                  <YearlyInputField label="산업성장률 (%)" arrName="industryGrowth" values={inputs.industryGrowth} onChangeArray={handleArrayChange} />
                  <YearlyInputField label="법인세율 (%)" arrName="taxRate" values={inputs.taxRate} onChangeArray={handleArrayChange} />

                  <div className="my-6 border-t border-dashed border-slate-300"></div>

                  <DynamicListYearly listName="debtList" items={inputs.debtList} title="타인자본 조달 (백만원)" namePlaceholder="조달처" onAdd={addListItem} onRemove={removeListItem} onFieldChange={handleListField} onAmountChange={handleListAmt} />
                  <div className="bg-slate-900 text-white p-3 rounded mt-4 shadow-inner">
                    <div className="flex justify-between mb-1"><span className="text-slate-400 text-[10px] font-semibold">자기자본 비율 (초기 Y0)</span><span className="font-bold text-xs">{formatPercent(model.wE)}</span></div>
                    <div className="flex justify-between mb-1"><span className="text-slate-400 text-[10px] font-semibold">타인자본 비율 (초기 Y0)</span><span className="font-bold text-xs">{formatPercent(model.wD)}</span></div>
                    <div className="flex justify-between border-t border-slate-700 pt-2 mt-2"><span className="font-bold text-xs text-slate-200">가중평균자본비용 (WACC)</span><span className="font-black text-red-400 text-sm">{formatPercent(model.wacc)}</span></div>
                  </div>
                </InputGroup>

                <InputGroup title="3. 자금소요 (투자/CAPEX)">

                  <DynamicListYearly listName="intangibleList" items={inputs.intangibleList} title="무형자산 투자 (백만원)" namePlaceholder="항목" hasUsefulLife onAdd={addListItem} onRemove={removeListItem} onFieldChange={handleListField} onAmountChange={handleListAmt} />
                </InputGroup>

                <InputGroup title="4. 자금소요 (운전자본 및 제조경비)">
                  <DynamicBaseCostList listName="baseCostList" items={inputs.baseCostList} title="기본 제조원가 (연간 총액 백만원)" onAdd={addListItem} onRemove={removeListItem} onFieldChange={handleListField} onAmountChange={handleListAmt} model={model} />
                  <DynamicExpRateList listName="directExpList" items={inputs.directExpList} title="직접 제조경비율 (기본원가 대비 %)" onAdd={addListItem} onRemove={removeListItem} onFieldChange={handleListField} onAmountChange={handleListAmt} model={model} />
                  <DynamicExpRateList listName="indirectExpList" items={inputs.indirectExpList} title="간접 제조경비율 (기본원가 대비 %)" onAdd={addListItem} onRemove={removeListItem} onFieldChange={handleListField} onAmountChange={handleListAmt} model={model} />
                  
                  <div className="bg-slate-800 text-white text-[10px] font-bold px-2 py-1 rounded-sm inline-block mb-3 mt-4">외부조달제품 매입 현황 (6번 설정 연동)</div>
                  <div className="space-y-2 mb-6">
                    {(() => {
                      let extProds = [];
                      const findExt = (revTypes) => {
                        (revTypes||[]).forEach(rt => {

                            (country.brands||[]).forEach(brand => {
                              (brand.bizTypes||[]).forEach(biz => {
                                (biz.salesModes||[]).forEach(sm => {

                                      (cl.categories||[]).forEach(cat => {
                                        (cat.products||[]).forEach(p => {
                                          if(p.isInternal === false) {
                                            extProds.push({...p, pathIds: [rt.id, country.id, brand.id, biz.id, sm.id, ch.id, cl.id, cat.id]});
                                          }
                                        });
                                      });
                                    });
                                  });
                                });
                              });
                            });
                          });
                        });
                      };
                      findExt(inputs.salesHierarchy);

                      if (extProds.length === 0) return <div className="text-[10px] text-slate-400 font-bold border border-slate-200 bg-white p-3 rounded">등록된 외부조달 제품이 없습니다. 6번 탭에서 품목을 추가하고 '자체생산'을 해제하세요.</div>;
