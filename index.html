  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const supabaseUrl = 'https://iyvfybwzlamucanqedfz.supabase.co';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5dmZ5Ynd6bGFtdWNhbnFlZGZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNTI4NDcsImV4cCI6MjA5ODgyODg0N30.DnMoQGjTPrzf1UaMFsZdSzS21ALYufS6Sa3OKegXVM0';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

    const arr5 = (val) => Array(5).fill(val);
    const arr6 = (y0, yRem) => [y0, ...Array(5).fill(yRem)];

    const DEFAULT_INPUTS = {
      inflationRate: arr5(2.5), interestRate: arr5(5.0), exchangeRate: arr5(1300), industryGrowth: arr5(3.0), taxRate: arr5(20.0), costOfEquity: arr5(10.0),
      equityList: [{ id: 1, name: '창업자', amounts: arr6(500000000, 0) }],
      debtList: [{ id: 1, name: 'A은행 차입', amounts: arr6(500000000, 0) }],
      capexList: [{ id: 1, name: '기계장치', amounts: arr6(800000000, 0), usefulLife: 5 }],
      intangibleList: [{ id: 1, name: '소프트웨어', amounts: arr6(0, 0), usefulLife: 5 }],
      advancesList: [{ id: 1, name: '계약금/선수금', amounts: arr6(0, 0) }],
      accruedList: [{ id: 1, name: '미지급비용/예수금', amounts: arr6(0, 0) }],
      prepaidList: [{ id: 1, name: '선급금/선급비용', amounts: arr6(0, 0) }],

      utilization: [80, 85, 90, 95, 100], lossRate: arr5(2.0),
      rawMaterialMain: arr5(2500), rawMaterialSub: arr5(1500), directLabor: arr5(2000), directExpPower: arr5(200), directExpWater: arr5(100), directExpConsumables: arr5(200),
      indirectExpQC: arr5(400), indirectExpMaintenance: arr5(400), indirectExpWaste: arr5(200),
      arDays: arr5(30), invDays: arr5(30), apDays: arr5(30),
      logisticsRate: arr5(2.0), salesCommRate: arr5(1.5), asCostRate: arr5(0.5),
      utilities: arr5(10000000), travel: arr5(8000000), telecom: arr5(5000000),
      laborFix: arr5(150000000), benefits: arr5(20000000), rent: arr5(60000000), taxes: arr5(5000000), insurance: arr5(12000000), fees: arr5(15000000), rnd: arr5(20000000), marketing: arr5(50000000), supplies: arr5(12000000), badDebt: arr5(0), otherSga: arr5(10000000),
      nonOpIncCash: arr5(0), nonOpIncNonCash: arr5(0), nonOpExpCash: arr5(0), nonOpExpNonCash: arr5(0),
      salesHierarchy: [{ id: 'c1', name: '대한민국', clients: [{ id: 'cl1', name: 'A상사', products: [{ id: 'p1', name: '기본 제품', prices: arr5(15000), volumes: [100000, 110000, 120000, 130000, 140000] }] }] }]
    };

    const formatCurrency = (val) => (val || 0).toLocaleString('ko-KR', { maximumFractionDigits: 0 });
    const formatPercent = (val) => `${((val || 0) * 100).toFixed(1)}%`;
    const toMil = (val) => (val || 0) / 1000000;

    const calculateIRR = (cashFlows) => {
      let guess = 0.1;
      for (let i = 0; i < 1000; i++) {
        let npv = 0, derivative = 0;
        for (let t = 0; t < cashFlows.length; t++) {
          npv += cashFlows[t] / Math.pow(1 + guess, t);
          if (t > 0) derivative -= (t * cashFlows[t]) / Math.pow(1 + guess, t + 1);
        }
        if (Math.abs(npv) < 0.001) return guess;
        let nextGuess = guess - npv / derivative;
        if (nextGuess <= -1) nextGuess = -0.99;
        if (Math.abs(nextGuess - guess) < 0.00001) return nextGuess;
        guess = nextGuess;
      }
      return guess;
    };

    const NumInput = ({ value, onChange, placeholder, className = "" }) => {
      const [localVal, setLocalVal] = useState(value === 0 ? '0' : value.toLocaleString());
      useEffect(() => { setLocalVal(value === 0 ? '0' : value.toLocaleString()); }, [value]);
      const handleChange = (e) => {
        const raw = e.target.value.replace(/[^0-9.-]/g, '');
        setLocalVal(raw);
        if (raw !== '' && raw !== '-' && raw !== '.') onChange(Number(raw));
      };
      return <input type="text" value={localVal} onChange={handleChange} placeholder={placeholder} className={`text-right border border-slate-300 rounded py-1 px-1.5 transition-all ${className}`} />;
    };

    const ExpandableRow = ({ label, values, ratios, details, isBold, isTotal, isHeader }) => {
      const [ex, setEx] = useState(false);
      const hasD = details && details.length > 0;
      let rowCls = 'border-b border-slate-200 text-slate-800 bg-white';
      if (isHeader) rowCls = 'border-y border-slate-800 font-bold bg-slate-50 text-slate-900';
      else if (isTotal) rowCls = 'border-y border-slate-300 font-bold bg-slate-50 text-slate-900';
      else if (isBold) rowCls = 'font-semibold text-slate-900';

      return (
        <React.Fragment>
          <tr className={rowCls}>
            <td className={`py-2 px-4 text-left ${hasD ? 'cursor-pointer hover:bg-slate-50 select-none' : ''}`} onClick={() => hasD && setEx(!ex)}>
              <span className="inline-block w-4">{hasD ? (ex ? '▼' : '▶') : ''}</span>
              <span className="text-[13px]">{label}</span>
            </td>
            {values.map((val, idx) => (
              <td key={idx} className="py-2 px-4 text-right text-[13px]">
                {formatCurrency(toMil(val))}
                {ratios && ratios[idx] !== 0 ? <div className="text-[10px] text-slate-400">({formatPercent(ratios[idx])})</div> : null}
              </td>
            ))}
          </tr>
          {ex && hasD && details.map((d, i) => (
            <tr key={i} className="bg-white border-b border-slate-100 hover:bg-slate-50">
              <td className={`py-1.5 px-4 text-left text-[12px] text-slate-600 ${d.level === 2 ? 'pl-12' : 'pl-8'}`}>{d.label}</td>
              {d.values.map((v, vi) => (
                <td key={vi} className="py-1.5 px-4 text-right text-[12px] text-slate-600">
                  {formatCurrency(toMil(v))}
                </td>
              ))}
            </tr>
          ))}
        </React.Fragment>
      );
    };

    function App() {
      const [activeTab, setActiveTab] = useState('npv');
      const [inputs, setInputs] = useState(DEFAULT_INPUTS);
      const [user, setUser] = useState(null);
      const [projects, setProjects] = useState([]);
      const [projectName, setProjectName] = useState('새 프로젝트');
      const [currentProjectId, setCurrentProjectId] = useState(null);
      const [saveStatus, setSaveStatus] = useState('');
      const [lang, setLang] = useState('ko');

      // 다국어 번역 함수 추가
      const translations = {
        '새 프로젝트': 'New Project'
      };
      const t = (key) => (lang === 'en' && translations[key]) ? translations[key] : key;

      useEffect(() => {
        supabaseClient.auth.signInAnonymously().then(({ data }) => setUser(data?.user)).catch(console.error);
      }, []);

      useEffect(() => {
        if (!user) return;
        const fetchProjects = async () => {
          const { data } = await supabaseClient.from('feasibility_projects').select('*').order('updated_at', { ascending: false });
          if (data) setProjects(data);
        };
        fetchProjects();
      }, [user]);

      const handleSave = async () => {
        if (!user) return;
        setSaveStatus('저장 중...');
        try {
          if (currentProjectId) {
            await supabaseClient.from('feasibility_projects').update({ name: projectName, inputs, updated_at: new Date().toISOString() }).eq('id', currentProjectId);
          } else {
            const { data } = await supabaseClient.from('feasibility_projects').insert([{ name: projectName, inputs, user_id: user.id }]).select();
            if (data) setCurrentProjectId(data[0].id);
          }
          setSaveStatus('✅ 저장 완료');
          const { data: updated } = await supabaseClient.from('feasibility_projects').select('*').order('updated_at', { ascending: false });
          if (updated) setProjects(updated);
          setTimeout(() => setSaveStatus(''), 3000);
        } catch (e) { setSaveStatus('❌ 오류 발생'); }
      };

      // 누락되었던 필수 기능(불러오기/새로만들기) 복구
      const handleLoad = (id) => {
        const proj = projects.find(p => p.id == id);
        if (proj) {
          setInputs(proj.inputs);
          setProjectName(proj.name);
          setCurrentProjectId(proj.id);
        }
      };

      const handleNew = () => {
        setInputs(DEFAULT_INPUTS);
        setProjectName(t('새 프로젝트'));
        setCurrentProjectId(null);
      };

      const handleArrayChange = (name, index, value) => {
        setInputs(prev => { const newArr = [...prev[name]]; newArr[index] = value; return { ...prev, [name]: newArr }; });
      };

      const handleListAmountChange = (listName, id, index, value) => {
        setInputs(prev => ({ ...prev, [listName]: prev[listName].map(item => item.id === id ? { ...item, amounts: item.amounts.map((a, i) => i === index ? value : a) } : item) }));
      };
      
      const handleListFieldChange = (listName, id, field, value) => {
        setInputs(prev => ({ ...prev, [listName]: prev[listName].map(item => item.id === id ? { ...item, [field]: value } : item) }));
      };

      const addListItem = (listName) => setInputs(prev => ({ ...prev, [listName]: [...prev[listName], { id: Date.now(), name: '', amounts: arr6(0, 0), usefulLife: 5 }] }));
      const removeListItem = (listName, id) => setInputs(prev => ({ ...prev, [listName]: prev[listName].filter(item => item.id !== id) }));

      // 누락되었던 매출 구조 조작 함수 복구
      const addCountry = () => setInputs(p => ({ ...p, salesHierarchy: [...p.salesHierarchy, { id: Date.now().toString(), name: '', clients: [] }] }));
      const updateCountry = (cId, name) => setInputs(p => ({ ...p, salesHierarchy: p.salesHierarchy.map(c => c.id === cId ? { ...c, name } : c) }));
      const removeCountry = (cId) => setInputs(p => ({ ...p, salesHierarchy: p.salesHierarchy.filter(c => c.id !== cId) }));
      const addClient = (cId) => setInputs(p => ({ ...p, salesHierarchy: p.salesHierarchy.map(c => c.id === cId ? { ...c, clients: [...c.clients, { id: Date.now().toString(), name: '', products: [] }] } : c) }));
      const updateClient = (cId, clId, name) => setInputs(p => ({ ...p, salesHierarchy: p.salesHierarchy.map(c => c.id === cId ? { ...c, clients: c.clients.map(cl => cl.id === clId ? { ...cl, name } : cl) } : c) }));
      const removeClient = (cId, clId) => setInputs(p => ({ ...p, salesHierarchy: p.salesHierarchy.map(c => c.id === cId ? { ...c, clients: c.clients.filter(cl => cl.id !== clId) } : c) }));
      const addProduct = (cId, clId) => setInputs(p => ({ ...p, salesHierarchy: p.salesHierarchy.map(c => c.id === cId ? { ...c, clients: c.clients.map(cl => cl.id === clId ? { ...cl, products: [...cl.products, { id: Date.now().toString(), name: '', prices: arr5(0), volumes: arr5(0) }] } : cl) } : c) }));
      const updateProduct = (cId, clId, pId, field, index, value) => setInputs(p => ({ ...p, salesHierarchy: p.salesHierarchy.map(c => c.id === cId ? { ...c, clients: c.clients.map(cl => cl.id === clId ? { ...cl, products: cl.products.map(pr => pr.id === pId ? (field === 'name' ? { ...pr, name: value } : { ...pr, [field]: pr[field].map((v, i) => i === index ? value : v) }) : pr) } : cl) } : c) }));
      const removeProduct = (cId, clId, pId) => setInputs(p => ({ ...p, salesHierarchy: p.salesHierarchy.map(c => c.id === cId ? { ...c, clients: c.clients.map(cl => cl.id === clId ? { ...cl, products: cl.products.filter(pr => pr.id !== pId) } : c) } : c) }));

      const totalEquity = arr6(0, 0).map((_, i) => inputs.equityList.reduce((s, it) => s + (it.amounts[i] || 0), 0));
      const totalDebt = arr6(0, 0).map((_, i) => inputs.debtList.reduce((s, it) => s + (it.amounts[i] || 0), 0));
      const totalCapex = arr6(0, 0).map((_, i) => inputs.capexList.reduce((s, it) => s + (it.amounts[i] || 0), 0));
      const totalIntangible = arr6(0, 0).map((_, i) => inputs.intangibleList.reduce((s, it) => s + (it.amounts[i] || 0), 0));
      const totalAdvances = arr6(0, 0).map((_, i) => inputs.advancesList.reduce((s, it) => s + (it.amounts[i] || 0), 0));
      const totalAccrued = arr6(0, 0).map((_, i) => inputs.accruedList.reduce((s, it) => s + (it.amounts[i] || 0), 0));
      const totalPrepaid = arr6(0, 0).map((_, i) => inputs.prepaidList.reduce((s, it) => s + (it.amounts[i] || 0), 0));
      const totalReceivable = arr6(0, 0).map((_, i) => inputs.receivableList.reduce((s, it) => s + (it.amounts[i] || 0), 0));

      const model = useMemo(() => {
        const initV = totalEquity[0] + totalDebt[0];
        const wE = initV > 0 ? totalEquity[0] / initV : 0;
        const wD = initV > 0 ? totalDebt[0] / initV : 0;
        const wacc = initV > 0 ? (wE * (inputs.costOfEquity[0] / 100)) + (wD * (inputs.interestRate[0] / 100) * (1 - inputs.taxRate[0] / 100)) : (inputs.costOfEquity[0] / 100);

        let res = { is_financial: [], is_managerial: [], bs: [], cf: [], fcffData: [], npv: 0, irr: 0, wacc, wE, wD, paybackPeriod: null };
        let prevCash = totalEquity[0] + totalDebt[0] - totalCapex[0] - totalIntangible[0] + totalAdvances[0] + totalAccrued[0] - totalPrepaid[0] - totalReceivable[0];
        let prevRetainedEarnings = 0;
        
        res.bs.push({
          currentAssets: prevCash + totalPrepaid[0] + totalReceivable[0], nonCurrentAssets: totalCapex[0] + totalIntangible[0], totalAssets: prevCash + totalCapex[0] + totalIntangible[0] + totalPrepaid[0] + totalReceivable[0],
          currentLiabilities: totalAdvances[0] + totalAccrued[0], nonCurrentLiabilities: totalDebt[0], totalLiabilities: totalDebt[0] + totalAdvances[0] + totalAccrued[0],
          totalEquity: totalEquity[0], bsDetails: { cash: prevCash, ar: 0, inv: 0, prepaidNet: totalPrepaid[0], receivableNet: totalReceivable[0], ppeNet: totalCapex[0], intangibleNet: totalIntangible[0], otherNetAssets: 0, ap: 0, advancesNet: totalAdvances[0], accruedNet: totalAccrued[0], debt: totalDebt[0], capital: totalEquity[0], retainedEarnings: 0 }
        });

        const netCfY0 = totalAdvances[0] + totalAccrued[0] - totalPrepaid[0] - totalReceivable[0] - totalCapex[0] - totalIntangible[0] + totalEquity[0] + totalDebt[0];
        res.cf.push({ operatingCf: totalAdvances[0] + totalAccrued[0] - totalPrepaid[0] - totalReceivable[0], investingCf: -totalCapex[0] - totalIntangible[0], financingCf: totalEquity[0] + totalDebt[0], netCf: netCfY0, beginningCash: 0, endingCash: prevCash, nonCashExpAdd:0, nonCashIncDed:0, deltaWc:0, cfDetails: { netIncome: 0, depreciation: 0, amortization: 0, badDebtExp: 0, nonOpExpNonCash: 0, nonOpIncNonCash: 0, deltaArGross: 0, deltaInv: 0, deltaAp: 0, advancesInflow: totalAdvances[0], accruedInflow: totalAccrued[0], prepaidOutflow: -totalPrepaid[0], receivableOutflow: -totalReceivable[0], capex: -totalCapex[0], intangibleCapex: -totalIntangible[0], equity: totalEquity[0], debt: totalDebt[0] } });

        const fcffY0 = totalAdvances[0] + totalAccrued[0] - totalCapex[0] - totalIntangible[0] - totalPrepaid[0] - totalReceivable[0];
        res.fcffData.push({ nopat: 0, depreciation: 0, amortization: 0, advancesInflow: totalAdvances[0], accruedInflow: totalAccrued[0], terminalValue: 0, capex: totalCapex[0], intangibleCapex: totalIntangible[0], deltaWc: 0, prepaidOutflow: totalPrepaid[0], receivableOutflow: totalReceivable[0], fcff: fcffY0, pvFcff: fcffY0 });

        let accumDebt = totalDebt[0];
        let accumCapital = totalEquity[0];
        let accumBadDebt = 0;
        let accumOtherNonCash = 0; 
        let prevArGross = 0;

        for (let i = 0; i < 5; i++) {
          const year = i + 1; 
          accumCapital += totalEquity[year];
          accumDebt += totalDebt[year];

          let revenue = 0, currentSalesVol = 0;
          inputs.salesHierarchy.forEach(c => c.clients.forEach(cl => cl.products.forEach(p => { const val = (p.prices[i]||0) * (p.volumes[i]||0); revenue += val; currentSalesVol += (p.volumes[i]||0); })));
          
          const currentProdVol = currentSalesVol / (1 - inputs.lossRate[i] / 100);
          const mfgCostPerUnit = inputs.rawMaterialMain[i] + inputs.rawMaterialSub[i] + inputs.directLabor[i] + inputs.directExpPower[i] + inputs.directExpWater[i] + inputs.directExpConsumables[i] + inputs.indirectExpQC[i] + inputs.indirectExpMaintenance[i] + inputs.indirectExpWaste[i];
          
          let depreciation = 0, amortization = 0;
          inputs.capexList.forEach(it => it.amounts.forEach((a, j) => { if(a && year >= (j===0?1:j) && year <= (j===0?1:j)+it.usefulLife-1) depreciation += a/it.usefulLife; }));
          inputs.intangibleList.forEach(it => it.amounts.forEach((a, j) => { if(a && year >= (j===0?1:j) && year <= (j===0?1:j)+it.usefulLife-1) amortization += a/it.usefulLife; }));

          const cogs = (currentProdVol * mfgCostPerUnit) + depreciation; 
          const grossProfit = revenue - cogs;

          const totalSgaVar = revenue * ((inputs.logisticsRate[i]+inputs.salesCommRate[i]+inputs.asCostRate[i])/100);
          const totalSgaSemi = inputs.utilities[i] + inputs.travel[i] + inputs.telecom[i];
          const totalSgaFixOnly = inputs.laborFix[i] + inputs.benefits[i] + inputs.rent[i] + inputs.taxes[i] + inputs.insurance[i] + inputs.fees[i] + inputs.rnd[i] + inputs.marketing[i] + inputs.supplies[i] + inputs.badDebt[i] + inputs.otherSga[i];
          accumBadDebt += inputs.badDebt[i];

          const totalSga = totalSgaVar + totalSgaSemi + totalSgaFixOnly + amortization;
          const operatingProfit = grossProfit - totalSga;

          const interestExpense = accumDebt * (inputs.interestRate[i] / 100);
          const totalNonOpInc = inputs.nonOpIncCash[i] + inputs.nonOpIncNonCash[i];
          const totalNonOpExp = interestExpense + inputs.nonOpExpCash[i] + inputs.nonOpExpNonCash[i];
          const ebt = operatingProfit + totalNonOpInc - totalNonOpExp;
          const tax = Math.max(0, ebt * (inputs.taxRate[i] / 100));
          const netIncome = ebt - tax;

          accumOtherNonCash += (inputs.nonOpIncNonCash[i] - inputs.nonOpExpNonCash[i]);

          res.is_financial.push({
            revenue, cogs, grossProfit, totalSga, operatingProfit, totalNonOpInc, totalNonOpExp, interestExpense, nonOpIncC: inputs.nonOpIncCash[i], nonOpIncNC: inputs.nonOpIncNonCash[i], nonOpExpC: inputs.nonOpExpCash[i], nonOpExpNC: inputs.nonOpExpNonCash[i], tax, netIncome,
            cogsDetails: { rawMatMain: inputs.rawMaterialMain[i]*currentProdVol, rawMatSub: inputs.rawMaterialSub[i]*currentProdVol, directLabor: inputs.directLabor[i]*currentProdVol, dirExpPower: inputs.directExpPower[i]*currentProdVol, dirExpWater: inputs.directExpWater[i]*currentProdVol, dirExpConsumables: inputs.directExpConsumables[i]*currentProdVol, indExpQC: inputs.indirectExpQC[i]*currentProdVol, indExpMaintenance: inputs.indirectExpMaintenance[i]*currentProdVol, indExpWaste: inputs.indirectExpWaste[i]*currentProdVol, depreciation },
            sgaDetails: { varLogistics: revenue*(inputs.logisticsRate[i]/100), varSalesComm: revenue*(inputs.salesCommRate[i]/100), varAsCost: revenue*(inputs.asCostRate[i]/100), totalSgaVar, semiUtilities: inputs.utilities[i], semiTravel: inputs.travel[i], semiTelecom: inputs.telecom[i], totalSgaSemi, fixLabor: inputs.laborFix[i], fixBenefits: inputs.benefits[i], fixRent: inputs.rent[i], fixTaxes: inputs.taxes[i], fixInsurance: inputs.insurance[i], fixFees: inputs.fees[i], fixRnd: inputs.rnd[i], fixMarketing: inputs.marketing[i], fixSupplies: inputs.supplies[i], fixBadDebt: inputs.badDebt[i], fixOther: inputs.otherSga[i], totalSgaFixOnly, amortization },
            ratios: { cogsRatio: revenue>0?cogs/revenue:0, grossMargin: revenue>0?grossProfit/revenue:0, sgaRatio: revenue>0?totalSga/revenue:0, opMargin: revenue>0?operatingProfit/revenue:0, netMargin: revenue>0?netIncome/revenue:0 }
          });

          const variableCosts = (inputs.rawMaterialMain[i]+inputs.rawMaterialSub[i]+inputs.directLabor[i]+inputs.directExpPower[i]+inputs.directExpWater[i]+inputs.directExpConsumables[i])*currentProdVol + totalSgaVar;
          const contributionMargin = revenue - variableCosts;
          const fixedCosts = (inputs.indirectExpQC[i]+inputs.indirectExpMaintenance[i]+inputs.indirectExpWaste[i])*currentProdVol + depreciation + totalSgaSemi + totalSgaFixOnly + amortization;
          
          res.is_managerial.push({
            revenue, variableCosts, contributionMargin, fixedCosts, operatingProfit: contributionMargin-fixedCosts, bepRevenue: contributionMargin>0?(fixedCosts*revenue)/contributionMargin:0,
            varCostDetails: { rawMat: (inputs.rawMaterialMain[i]+inputs.rawMaterialSub[i])*currentProdVol, dirLabor: inputs.directLabor[i]*currentProdVol, dirExp: (inputs.directExpPower[i]+inputs.directExpWater[i]+inputs.directExpConsumables[i])*currentProdVol, sgaVarLogistics: revenue*(inputs.logisticsRate[i]/100), sgaVarSalesComm: revenue*(inputs.salesCommRate[i]/100), sgaVarAsCost: revenue*(inputs.asCostRate[i]/100), totalSgaVar },
            fixCostDetails: { indExpQC: inputs.indirectExpQC[i]*currentProdVol, indExpMaintenance: inputs.indirectExpMaintenance[i]*currentProdVol, indExpWaste: inputs.indirectExpWaste[i]*currentProdVol, depreciation, semiUtilities: inputs.utilities[i], semiTravel: inputs.travel[i], semiTelecom: inputs.telecom[i], totalSgaSemi, fixLabor: inputs.laborFix[i], fixBenefits: inputs.benefits[i], fixRent: inputs.rent[i], fixTaxes: inputs.taxes[i], fixInsurance: inputs.insurance[i], fixFees: inputs.fees[i], fixRnd: inputs.rnd[i], fixMarketing: inputs.marketing[i], fixSupplies: inputs.supplies[i], fixBadDebt: inputs.badDebt[i], fixOther: inputs.otherSga[i], totalSgaFixOnly, amortization },
            ratios: { varRatio: revenue>0?variableCosts/revenue:0, cmRatio: revenue>0?contributionMargin/revenue:0, fixedRatio: revenue>0?fixedCosts/revenue:0 }
          });

          const arGross = revenue * (inputs.arDays[i] / 365);
          const deltaArGross = -(arGross - prevArGross); prevArGross = arGross;
          const inv = cogs * (inputs.invDays[i] / 365);
          const ap = cogs * (inputs.apDays[i] / 365); 
          
          let ppeNet = totalCapex.slice(0, year+1).reduce((a,b)=>a+b,0);
          let intangibleNet = totalIntangible.slice(0, year+1).reduce((a,b)=>a+b,0);
          inputs.capexList.forEach(it => it.amounts.forEach((a, j) => { if(a && year >= (j===0?1:j)) ppeNet -= (a/it.usefulLife) * (Math.min(year, (j===0?1:j)+it.usefulLife-1) - (j===0?1:j) + 1); }));
          inputs.intangibleList.forEach(it => it.amounts.forEach((a, j) => { if(a && year >= (j===0?1:j)) intangibleNet -= (a/it.usefulLife) * (Math.min(year, (j===0?1:j)+it.usefulLife-1) - (j===0?1:j) + 1); }));

          const deltaWc = deltaArGross - (inv - res.bs[i].bsDetails.inv) + (ap - res.bs[i].bsDetails.ap) + totalAdvances[year] + totalAccrued[year] - totalPrepaid[year] - totalReceivable[year];
          const nonCashExpAdd = depreciation + amortization + inputs.badDebt[i] + inputs.nonOpExpNonCash[i];
          
          const operatingCf = netIncome + nonCashExpAdd - inputs.nonOpIncNonCash[i] + deltaWc;
          const netCf = operatingCf - totalCapex[year] - totalIntangible[year] + totalEquity[year] + totalDebt[year]; 
          const endingCash = prevCash + netCf;
          
          res.bs.push({
            currentAssets: endingCash + Math.max(0, arGross-accumBadDebt) + inv + totalPrepaid.slice(0,year+1).reduce((a,b)=>a+b,0) + totalReceivable.slice(0,year+1).reduce((a,b)=>a+b,0),
            nonCurrentAssets: ppeNet + intangibleNet + accumOtherNonCash,
            totalAssets: endingCash + Math.max(0, arGross-accumBadDebt) + inv + totalPrepaid.slice(0,year+1).reduce((a,b)=>a+b,0) + totalReceivable.slice(0,year+1).reduce((a,b)=>a+b,0) + ppeNet + intangibleNet + accumOtherNonCash,
            currentLiabilities: ap + totalAdvances.slice(0,year+1).reduce((a,b)=>a+b,0) + totalAccrued.slice(0,year+1).reduce((a,b)=>a+b,0),
            nonCurrentLiabilities: accumDebt,
            totalLiabilities: ap + totalAdvances.slice(0,year+1).reduce((a,b)=>a+b,0) + totalAccrued.slice(0,year+1).reduce((a,b)=>a+b,0) + accumDebt,
            totalEquity: accumCapital + prevRetainedEarnings + netIncome,
            bsDetails: { cash: endingCash, ar: Math.max(0, arGross-accumBadDebt), inv, prepaidNet: totalPrepaid.slice(0,year+1).reduce((a,b)=>a+b,0), receivableNet: totalReceivable.slice(0,year+1).reduce((a,b)=>a+b,0), ppeNet, intangibleNet, otherNetAssets: accumOtherNonCash, ap, advancesNet: totalAdvances.slice(0,year+1).reduce((a,b)=>a+b,0), accruedNet: totalAccrued.slice(0,year+1).reduce((a,b)=>a+b,0), debt: accumDebt, capital: accumCapital, retainedEarnings: prevRetainedEarnings + netIncome }
          });

          res.cf.push({
            beginningCash: prevCash, operatingCf, investingCf: -totalCapex[year] - totalIntangible[year], financingCf: totalEquity[year] + totalDebt[year], netCf, endingCash, nonCashExpAdd, nonCashIncDed: inputs.nonOpIncNonCash[i], deltaWc,
            cfDetails: { netIncome, depreciation, amortization, badDebtExp: inputs.badDebt[i], nonOpExpNonCash: inputs.nonOpExpNonCash[i], nonOpIncNonCash: inputs.nonOpIncNonCash[i], deltaArGross, deltaInv: -(inv - res.bs[i].bsDetails.inv), deltaAp: (ap - res.bs[i].bsDetails.ap), advancesInflow: totalAdvances[year], accruedInflow: totalAccrued[year], prepaidOutflow: -totalPrepaid[year], receivableOutflow: -totalReceivable[year], capex: -totalCapex[year], intangibleCapex: -totalIntangible[year], equity: totalEquity[year], debt: totalDebt[year] }
          });

          const nopat = operatingProfit * (1 - (inputs.taxRate[i]/100));
          const terminalValue = i === 4 ? Math.max(0, arGross-accumBadDebt) + inv - ap + ppeNet + intangibleNet + totalPrepaid.slice(0,year+1).reduce((a,b)=>a+b,0) + totalReceivable.slice(0,year+1).reduce((a,b)=>a+b,0) - totalAdvances.slice(0,year+1).reduce((a,b)=>a+b,0) - totalAccrued.slice(0,year+1).reduce((a,b)=>a+b,0) + accumOtherNonCash : 0;
          const fcff = nopat + depreciation + amortization + totalAdvances[year] + totalAccrued[year] + terminalValue - totalCapex[year] - totalIntangible[year] - (-deltaArGross + (inv - res.bs[i].bsDetails.inv) - (ap - res.bs[i].bsDetails.ap)) - totalPrepaid[year] - totalReceivable[year];
          
          res.fcffData.push({ nopat, depreciation, amortization, advancesInflow: totalAdvances[year], accruedInflow: totalAccrued[year], terminalValue, capex: totalCapex[year], intangibleCapex: totalIntangible[year], deltaWc: (-deltaArGross + (inv - res.bs[i].bsDetails.inv) - (ap - res.bs[i].bsDetails.ap)), prepaidOutflow: totalPrepaid[year], receivableOutflow: totalReceivable[year], fcff, pvFcff: fcff / Math.pow(1 + wacc, year) });
          
          prevCash = endingCash;
          prevRetainedEarnings += netIncome;
        }

        const fcffArray = res.fcffData.map(d=>d.fcff);
        res.npv = fcffArray.reduce((acc, cf, idx) => acc + (cf / Math.pow(1 + wacc, idx)), 0);
        res.irr = calculateIRR(fcffArray);

        let cumFcff = 0;
        fcffArray.forEach((cf, idx) => {
          const prevCum = cumFcff; cumFcff += cf;
          if (res.paybackPeriod === null && cumFcff >= 0) res.paybackPeriod = idx === 0 ? 0 : (idx - 1) + Math.abs(prevCum) / cf;
        });

        return res;
      }, [inputs]);

                      <thead><tr className="bg-slate-100 border-y border-slate-400"><th className="p-2 text-left">항목</th>{[0,1,2,3,4,5].map(y=><th key={y} className="p-2">Y{y}</th>)}</tr></thead>
                      <tbody className="divide-y divide-slate-100">
                        <ExpandableRow label="현금유입" isBold values={model.fcffData.map(d=>d.nopat+d.depreciation+d.amortization+d.advancesInflow+d.accruedInflow+d.terminalValue)} details={[{label:'NOPAT', values:model.fcffData.map(d=>d.nopat)}, {label:'상각비', values:model.fcffData.map(d=>d.depreciation+d.amortization)}]} />
                        <ExpandableRow label="현금유출" isBold values={model.fcffData.map(d=>d.capex+d.intangibleCapex+d.deltaWc+d.prepaidOutflow+d.receivableOutflow)} details={[{label:'CAPEX', values:model.fcffData.map(d=>d.capex+d.intangibleCapex)}, {label:'운전자본증감', values:model.fcffData.map(d=>d.deltaWc)}]} />
                        <ExpandableRow label="잉여현금흐름" isHeader values={model.fcffData.map(d=>d.fcff)} />
                      </tbody>
                    </table>
                  </div>
                ) : null}

                {activeTab === 'is_fin' ? (
                  <div className="p-8">
                    <div className="flex justify-between items-end mb-2"><h3 className="text-sm font-bold text-slate-900">재무회계 손익계산서</h3><span className="text-[10px] text-slate-500">(백만원)</span></div>
                    <table className="w-full text-right text-xs">
                      <thead><tr className="bg-slate-100 border-y border-slate-400"><th className="p-2 text-left">항목</th>{[1,2,3,4,5].map(y=><th key={y} className="p-2">Y{y}</th>)}</tr></thead>
                      <tbody className="divide-y divide-slate-100">
                        <ExpandableRow label="매출액" values={model.is_financial.map(d=>d.revenue)} isBold />
                        <ExpandableRow label="매출원가" values={model.is_financial.map(d=>d.cogs)} />
                        <ExpandableRow label="매출총이익" values={model.is_financial.map(d=>d.grossProfit)} isTotal />
                        <ExpandableRow label="판매비와관리비" values={model.is_financial.map(d=>d.totalSga)} />
                        <ExpandableRow label="영업이익" values={model.is_financial.map(d=>d.operatingProfit)} isTotal />
                        <ExpandableRow label="당기순이익" values={model.is_financial.map(d=>d.netIncome)} isHeader />
                      </tbody>
                    </table>
                  </div>
                ) : null}

                {activeTab === 'is_mgr' ? (
                  <div className="p-8">
                    <div className="flex justify-between items-end mb-2"><h3 className="text-sm font-bold text-slate-900">관리회계 손익계산서</h3><span className="text-[10px] text-slate-500">(백만원)</span></div>
                    <table className="w-full text-right text-xs">
                      <thead><tr className="bg-slate-100 border-y border-slate-400"><th className="p-2 text-left">항목</th>{[1,2,3,4,5].map(y=><th key={y} className="p-2">Y{y}</th>)}</tr></thead>
                      <tbody className="divide-y divide-slate-100">
                        <ExpandableRow label="매출액" values={model.is_managerial.map(d=>d.revenue)} isBold />
                        <ExpandableRow label="변동비" values={model.is_managerial.map(d=>d.variableCosts)} />
                        <ExpandableRow label="공헌이익" values={model.is_managerial.map(d=>d.contributionMargin)} isTotal />
                        <ExpandableRow label="고정비" values={model.is_managerial.map(d=>d.fixedCosts)} />
                        <ExpandableRow label="영업이익" values={model.is_managerial.map(d=>d.operatingProfit)} isHeader />
                      </tbody>
                    </table>
                  </div>
                ) : null}

                {activeTab === 'bs' ? (
                  <div className="p-8">
                    <div className="flex justify-between items-end mb-2"><h3 className="text-sm font-bold text-slate-900">재무상태표</h3><span className="text-[10px] text-slate-500">(백만원)</span></div>
                    <div className="flex gap-4">
                      <table className="w-1/2 text-right text-xs">
                        <thead><tr className="bg-slate-100 border-y border-slate-400"><th className="p-2 text-left">자산</th>{[0,1,2,3,4,5].map(y=><th key={y} className="p-2">Y{y}</th>)}</tr></thead>
                        <tbody className="divide-y divide-slate-100">
                          <ExpandableRow label="유동자산" values={model.bs.map(d=>d.currentAssets)} />
                          <ExpandableRow label="비유동자산" values={model.bs.map(d=>d.nonCurrentAssets)} />
                          <ExpandableRow label="자산총계" values={model.bs.map(d=>d.totalAssets)} isHeader />
                        </tbody>
                      </table>
                      <table className="w-1/2 text-right text-xs">
                        <thead><tr className="bg-slate-100 border-y border-slate-400"><th className="p-2 text-left">부채/자본</th>{[0,1,2,3,4,5].map(y=><th key={y} className="p-2">Y{y}</th>)}</tr></thead>
                        <tbody className="divide-y divide-slate-100">
                          <ExpandableRow label="유동부채" values={model.bs.map(d=>d.currentLiabilities)} />
                          <ExpandableRow label="비유동부채" values={model.bs.map(d=>d.nonCurrentLiabilities)} />
                          <ExpandableRow label="자본총계" values={model.bs.map(d=>d.totalEquity)} />
                          <ExpandableRow label="부채/자본총계" values={model.bs.map(d=>d.totalLiabilities+d.totalEquity)} isHeader />
                        </tbody>
                      </table>
                    </div>
                  </div>
                ) : null}

                {activeTab === 'cf' ? (
                  <div className="p-8">
                    <div className="flex justify-between items-end mb-2"><h3 className="text-sm font-bold text-slate-900">현금흐름표</h3><span className="text-[10px] text-slate-500">(백만원)</span></div>
                    <table className="w-full text-right text-xs">
                      <thead><tr className="bg-slate-100 border-y border-slate-400"><th className="p-2 text-left">항목</th>{[0,1,2,3,4,5].map(y=><th key={y} className="p-2">Y{y}</th>)}</tr></thead>
                      <tbody className="divide-y divide-slate-100">
                        <ExpandableRow label="영업활동현금흐름" values={model.cf.map(d=>d.operatingCf)} isBold />
                        <ExpandableRow label="투자활동현금흐름" values={model.cf.map(d=>d.investingCf)} isBold />
                        <ExpandableRow label="재무활동현금흐름" values={model.cf.map(d=>d.financingCf)} isBold />
                        <ExpandableRow label="현금의 증감" values={model.cf.map(d=>d.netCf)} isTotal />
                        <ExpandableRow label="기말현금" values={model.cf.map(d=>d.endingCash)} isHeader />
                      </tbody>
                    </table>
                  </div>
                ) : null}
              </div>
            </div>
          </div>
        </div>
    );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
